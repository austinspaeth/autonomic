org: discoverymark
service: autonomic

# The master dashboard's backend. One DynamoDB table, one Lambda behind an
# HTTP API guarded by a Cognito JWT authorizer. The user pool is DiscoveryMark's
# (shared identity across the account) — which is exactly why the Lambda ALSO
# enforces an email allowlist: a valid token from that pool proves you are a
# DiscoveryMark customer, not that you are allowed in here.

stages:
  default:
    params:
      tableName: "Autonomic-${sls:stage}"
      apiDomain: "api.autonomic.care"
      # The live site's bucket and distribution. Created out-of-band (the
      # pipeline stack only references them), and passed to CodeBuild as
      # S3_BUCKET / CLOUDFRONT_DISTRIBUTION_ID — see infrastructure/pipeline.yml.
      # They are here because saving a campaign download link writes its page
      # straight into that bucket; see lambdas/api/links.js.
      siteBucket: "${env:S3_BUCKET, 'autonomic.care'}"
      siteDistributionId: "${env:CLOUDFRONT_DISTRIBUTION_ID, 'E17FMCFPDR3P3D'}"
      hostedZoneId: "${env:AUTONOMIC_HOSTED_ZONE_ID, 'Z101404626QO1OFJN008E'}"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-west-2
  stage: prod
  architecture: arm64
  memorySize: 512
  timeout: 20
  logRetentionInDays: 30
  httpApi:
    cors:
      allowedOrigins:
        - https://autonomic.care
        - https://www.autonomic.care
        - http://localhost:5173
        - http://localhost:8080
        # A third local port, because the other two are routinely taken by other
        # projects on the same machine. Origins only get you as far as the
        # Cognito token and the email allowlist behind it.
        - http://localhost:8099
      allowedMethods:
        - GET
        - POST
        - OPTIONS
      allowedHeaders:
        - Content-Type
        - Authorization
      maxAge: 3600
    authorizers:
      cognitoAuthorizer:
        type: jwt
        identitySource: $request.header.Authorization
        # DiscoveryMark's user pool, reused per the product decision. The
        # allowlist below is the real access control.
        issuerUrl: https://cognito-idp.us-west-2.amazonaws.com/us-west-2_0YCieUoYt
        audience:
          - 472fpu6vqbtu24e4m55a5dko98
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${param:tableName}
            - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${param:tableName}/index/*
        # The Web Push keypair, read on a cold start by `api` and `push`.
        # This role is shared with `ping`, which is public and unauthenticated
        # and never reads it — Serverless has no native per-function role, and
        # the alternative (build-time injection) is the one that can break
        # every deploy. Documented rather than hidden.
        # Campaign download pages. Scoped to the `download/` prefix: this role
        # can publish a campaign link and can never touch the rest of the site,
        # which the pipeline owns. No ListBucket — nothing here enumerates.
        #
        # Serverless has no native per-function role, so `ping` and `push` are
        # handed this too. Neither reads it, and neither ever will: publishing
        # lives behind the Cognito authorizer and the email allowlist. Same
        # trade, and the same reasoning, as the SSM grant below.
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::${param:siteBucket}/download/*
        # Clearing the edge after an edit. Best effort in the code; the objects
        # also carry a 60s max-age, so a missing grant costs a minute.
        - Effect: Allow
          Action: cloudfront:CreateInvalidation
          Resource:
            - !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${param:siteDistributionId}
        - Effect: Allow
          Action: ssm:GetParameter
          Resource:
            - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${self:custom.vapidParam}
        # The parameter is a SecureString under the AWS-managed SSM key.
        - Effect: Allow
          Action: kms:Decrypt
          Resource: '*'
          Condition:
            StringEquals:
              kms:ViaService: !Sub ssm.${AWS::Region}.amazonaws.com
  environment:
    DYNAMO_TABLE_NAME: ${param:tableName}
    STAGE: ${sls:stage}
    # Who may use the master dashboard. A valid Cognito token is necessary but
    # not sufficient — the pool is shared with DiscoveryMark's customers.
    ALLOWED_EMAILS: ${env:AUTONOMIC_ALLOWED_EMAILS, 'austinspaeth@msn.com'}

# Web Push credentials live in ONE SSM SecureString, read at RUN time.
#
# Not injected by CodeBuild the way PING_REPORT_KEY is, and the difference is
# deliberate: a PARAMETER_STORE build variable is resolved at build START, so a
# parameter that does not exist yet fails the whole build — landing site
# included. That is the trap the note beside PingReportKeyParameter in
# infrastructure/pipeline.yml describes, and this feature must be mergeable
# before the secret exists.
#
# Not `${ssm:...}` here either, for the reason that note gives: it resolves with
# whatever credentials the deploy runs under, and a missing permission would
# fail the deploy rather than one feature.
#
# So the functions are given the parameter's NAME and read it themselves on a
# cold start. UNSET IS SAFE AND IS THE DEFAULT: with no parameter, `PUSH_KEY`
# reports `configured: false`, the settings card says exactly that, nothing can
# subscribe and the hourly job sends nothing. Creating the parameter turns the
# feature on with no redeploy — see sls/README.md.
custom:
  vapidParam: ${env:AUTONOMIC_VAPID_PARAM, '/autonomic/vapid'}

functions:
  api:
    handler: lambdas/api/main.handler
    description: Autonomic master dashboard data API
    environment:
      VAPID_PARAM: ${self:custom.vapidParam}
      # Where a campaign download page is published. Unset is safe: the
      # dashboard stores and syncs campaigns either way and says they are not
      # live. See lambdas/api/links.js.
      SITE_BUCKET: ${param:siteBucket}
      CLOUDFRONT_DISTRIBUTION_ID: ${param:siteDistributionId}
    events:
      - httpApi:
          method: POST
          path: /api/master
          authorizer:
            name: cognitoAuthorizer

  # The mobile app's cohort ping. Public by design — the app has no accounts
  # and no credentials to present, and the request carries nothing worth
  # protecting: one date, no identifier, no body. See lambdas/ping/main.js.
  ping:
    handler: lambdas/ping/main.handler
    description: Anonymous cohort ping from the mobile app (installs, captures, paywall, offers, product events)
    memorySize: 256
    timeout: 5
    events:
      - httpApi:
          method: GET
          path: /ping/open/{cohort}
      - httpApi:
          method: GET
          path: /ping/sub/{cohort}
      # First HRV reading ever saved by an install. The code carries one extra
      # letter for the sensor it used (W watch / B strap / F finger / G Garmin).
      - httpApi:
          method: GET
          path: /ping/act/{cohort}
      # A reading STARTED. Its twin below fires when one completes, and the gap
      # between them is abandonment — the thing neither counter sees alone.
      - httpApi:
          method: GET
          path: /ping/cap/{cohort}
      # An HRV reading COMPLETED today. Once per install per Eastern day, the
      # same rule and the same code the open route uses — which is what makes
      # readings-over-opens a share of people rather than of pings. It carries
      # the sensor letter too — the letter splits the key, never the count.
      - httpApi:
          method: GET
          path: /ping/hrv/{cohort}
      # The paywall came up today. Once per install per Eastern day, like the
      # two above, so it is a share of PEOPLE who met a wall and not a count of
      # taps. One letter for which surface raised it (R progress range /
      # I insights / P POTS / O,M,N the AI reports / S the Settings button).
      - httpApi:
          method: GET
          path: /ping/pay/{cohort}
      # A notification was turned ON (M morning reminder / C crash warning),
      # a POTS capture finished (T stand test / E episode), a gated view was
      # opened (I insights / P progress). All three are capped once per install
      # per Eastern day PER LETTER, not per route: their letters are choices the
      # user made between real alternatives, and a whole-route cap would drop
      # whichever came second every time somebody did both.
      - httpApi:
          method: GET
          path: /ping/not/{cohort}
      - httpApi:
          method: GET
          path: /ping/pot/{cohort}
      - httpApi:
          method: GET
          path: /ping/see/{cohort}
      # Something on this install failed. Once per install EVER, and it carries
      # no tag and no message: how many phones are having a bad time, never what
      # went wrong. Diagnosis is the support dump, from the user's own device.
      - httpApi:
          method: GET
          path: /ping/err/{cohort}
      # The offer funnel — shown, then dismissed or accepted — as three routes
      # over one alphabet (A the half-off annual window / F founding member), so
      # accepts over shows is that offer's conversion. "Accepted" is a tap on the
      # card's own buy button, not a completed purchase: that is /ping/sub, and
      # the gap between the two is the store sheet.
      - httpApi:
          method: GET
          path: /ping/osh/{cohort}
      - httpApi:
          method: GET
          path: /ping/odm/{cohort}
      - httpApi:
          method: GET
          path: /ping/oac/{cohort}
      # Reading the counters back. Not public — guarded by PING_REPORT_KEY,
      # which is unset by default, and an unset key refuses everyone.
      - httpApi:
          method: GET
          path: /ping/report
    environment:
      # CodeBuild injects this from SSM (/autonomic/ping-report-key) — see
      # infrastructure/pipeline.yml. Deliberately NOT a ${ssm:...} lookup here:
      # that resolves with whatever credentials the deploy runs under, and a
      # missing permission would fail the whole deploy, landing site included.
      # Empty is safe — the read route refuses everyone without a key.
      PING_REPORT_KEY: ${env:AUTONOMIC_PING_REPORT_KEY, ''}

  # The hour that actually ticks. A service worker cannot check anything on a
  # schedule — it runs when its page is open, when a fetch it controls happens,
  # or when a push arrives, and iOS has no Periodic Background Sync — so the
  # hourly check lives here and the worker's job is to receive. The long form
  # of that argument is at the top of lambdas/push/main.js.
  push:
    handler: lambdas/push/main.handler
    description: Hourly check of the cohort counter; Web Push on a sale or a new install
    memorySize: 256
    # Web Push is one HTTPS request per subscribed device, sent in parallel.
    # 30s is generous for a handful of phones and still well short of a run
    # that would overlap the next hour's.
    timeout: 30
    events:
      - schedule:
          rate: rate(1 hour)
          description: Autonomic — check the ping counter and push arrivals
          # Disabled when no keys are set would be tidier and is not possible:
          # the schedule is created at deploy time and the key is read at run
          # time. The handler's first act is to check, and it returns having
          # sent nothing. An empty run is a few milliseconds.
          enabled: true
    environment:
      VAPID_PARAM: ${self:custom.vapidParam}

resources:
  Resources:

    # ------------------------------------------------------------------
    # Data table. Single-table: PK = DASH#<email>, SK = the record.
    #   SK = ENTRY#<date>#<platform>   one store-metrics day
    #   SK = SETTINGS                  trial/wall lengths, currency
    #   SK = UI                        view/filter preferences
    # One item per entry rather than one blob, so the document can never
    # grow into DynamoDB's 400KB item ceiling.
    # ------------------------------------------------------------------
    DashboardTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      UpdateReplacePolicy: Retain
      Properties:
        TableName: ${param:tableName}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: PK
            AttributeType: S
          - AttributeName: SK
            AttributeType: S
        KeySchema:
          - AttributeName: PK
            KeyType: HASH
          - AttributeName: SK
            KeyType: RANGE
        PointInTimeRecoverySpecification:
          PointInTimeRecoveryEnabled: true

    # ------------------------------------------------------------------
    # Custom domain: api.autonomic.care
    # ACM validates via DNS; giving CloudFormation the HostedZoneId lets it
    # write the validation records itself, so the whole thing is one deploy.
    # ------------------------------------------------------------------
    ApiCertificate:
      Type: AWS::CertificateManager::Certificate
      Properties:
        DomainName: ${param:apiDomain}
        ValidationMethod: DNS
        DomainValidationOptions:
          - DomainName: ${param:apiDomain}
            HostedZoneId: ${param:hostedZoneId}

    ApiDomainName:
      Type: AWS::ApiGatewayV2::DomainName
      Properties:
        DomainName: ${param:apiDomain}
        DomainNameConfigurations:
          - CertificateArn: !Ref ApiCertificate
            EndpointType: REGIONAL
            SecurityPolicy: TLS_1_2

    ApiMapping:
      Type: AWS::ApiGatewayV2::ApiMapping
      Properties:
        ApiId: !Ref HttpApi
        DomainName: !Ref ApiDomainName
        Stage: $default

    ApiDnsRecord:
      Type: AWS::Route53::RecordSet
      Properties:
        HostedZoneId: ${param:hostedZoneId}
        Name: ${param:apiDomain}
        Type: A
        AliasTarget:
          DNSName: !GetAtt ApiDomainName.RegionalDomainName
          HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId
          EvaluateTargetHealth: false

  Outputs:
    ApiEndpoint:
      Description: Master dashboard API endpoint
      Value: !Sub https://${param:apiDomain}/api/master
    TableName:
      Description: DynamoDB table backing the dashboard
      Value: ${param:tableName}
    OpenPingEndpoint:
      Description: Mobile app daily open ping (cohort is D{MMDDYY}{platform})
      Value: !Sub https://${param:apiDomain}/ping/open/{cohort}
    SubPingEndpoint:
      Description: Mobile app subscribe ping (cohort is D{MMDDYY}{platform})
      Value: !Sub https://${param:apiDomain}/ping/sub/{cohort}
    ActPingEndpoint:
      Description: Mobile app activation ping (cohort is D{MMDDYY}{platform}{method})
      Value: !Sub https://${param:apiDomain}/ping/act/{cohort}
    HrvPingEndpoint:
      Description: Mobile app daily HRV-reading ping (cohort is D{MMDDYY}{platform}{method})
      Value: !Sub https://${param:apiDomain}/ping/hrv/{cohort}
    PayPingEndpoint:
      Description: Mobile app daily paywall ping (cohort is D{MMDDYY}{platform}{surface})
      Value: !Sub https://${param:apiDomain}/ping/pay/{cohort}
    PingReportEndpoint:
      Description: Read the ping counters (needs ?key= — see sls/README.md)
      Value: !Sub https://${param:apiDomain}/ping/report
