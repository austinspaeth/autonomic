name: EAS Build

# Manually-triggered native builds. Native builds consume EAS build credits and
# are only needed when native code changes (new native module, new permission,
# SDK bump) — day-to-day JS changes ship via eas-update.yml instead.
#
# A build must be created for each channel you intend to serve OTA updates to
# (e.g. a "production" build pointed at the "production" channel), otherwise
# there is no installed app to pick the update up.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        type: choice
        options: [ios, android, all]
        default: ios
        required: true
      profile:
        description: "eas.json build profile"
        type: choice
        options: [development, preview, production]
        default: production
        required: true

jobs:
  build:
    name: Build ${{ github.event.inputs.platform }} (${{ github.event.inputs.profile }})
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          # NPM, not the action's default. It installs eas-cli with the packager
          # named here, and `yarn global add` fails outright on the current
          # runner image ("/usr/local/bin/yarn failed with exit code 1") — which
          # killed the job before it reached a single EAS command, so no OTA was
          # ever published from a push to main. This project has no yarn lockfile
          # and every other step uses npm.
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Start build
        env:
          PLATFORM: ${{ github.event.inputs.platform }}
          PROFILE: ${{ github.event.inputs.profile }}
        run: |
          eas build \
            --platform "$PLATFORM" \
            --profile "$PROFILE" \
            --non-interactive \
            --no-wait
