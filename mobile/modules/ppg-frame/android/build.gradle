apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

group = 'com.autonomic.ppgframe'
version = '1.0.0'

def expoModulesCorePlugin = new File(project(":expo-modules-core").projectDir.absolutePath, "ExpoModulesCorePlugin.gradle")
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

android {
  namespace "com.autonomic.ppgframe"
  compileSdkVersion safeExtGet("compileSdkVersion", 35)
  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 26)
    targetSdkVersion safeExtGet("targetSdkVersion", 35)
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // The frame processor plugin API (Frame, FrameProcessorPlugin, the registry).
  // Only platform classes are touched beyond that — android.media.Image, never
  // CameraX's ImageProxy, which VisionCamera does not expose as an api dep.
  implementation project(':react-native-vision-camera')
}
