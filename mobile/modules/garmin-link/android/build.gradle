// `expo-module-gradle-plugin` is NOT optional from Expo SDK 58: it applies the
// Kotlin compiler plugin the module DSL's reified type lookups depend on (see
// the note in modules/app-env/android/build.gradle — without it the module
// compiles and then throws from `definition()` at app launch). It also brings
// the Kotlin plugin, expo-modules-core, Java 17 and the SDK levels.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'care.autonomic.garminlink'
version = '1.0.0'

android {
  namespace 'care.autonomic.garminlink'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

repositories {
  mavenCentral()
}

dependencies {
  // Garmin's Connect IQ companion SDK. Unlike iOS this is the LIVE transport
  // path: it talks to the Garmin Connect app over a bound service, so Garmin
  // Connect must be installed and running for a reading to arrive.
  implementation 'com.garmin.connectiq:ciq-companion-app-sdk:2.4.0'
}
