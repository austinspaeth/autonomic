<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1024px; height:500px; overflow:hidden; }
  .wrap {
    position:relative; width:1024px; height:500px;
    background:
      radial-gradient(680px 520px at 82% 42%, rgba(255,72,54,0.30), rgba(255,72,54,0) 62%),
      radial-gradient(420px 360px at 96% 8%, rgba(255,120,90,0.18), rgba(0,0,0,0) 60%),
      #0B0B0C;
    font-family:-apple-system,system-ui,"Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
  }
  /* faint baseline grid */
  .grid { position:absolute; inset:0;
    background-image:linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:100% 50px; opacity:0.6; }
  .text { position:absolute; left:70px; top:0; height:500px;
    display:flex; flex-direction:column; justify-content:center; width:560px; }
  .eyebrow { color:#FF7A63; font-size:19px; font-weight:700; letter-spacing:5px;
    text-transform:uppercase; margin-bottom:20px; }
  .head { color:#F5F5F7; font-size:58px; line-height:1.04; font-weight:800;
    letter-spacing:-1.2px; }
  .head .accent { color:#FF5A44; }
  .sub { color:#A6A6AD; font-size:23px; line-height:1.35; font-weight:500;
    margin-top:24px; max-width:500px; }
  /* waveform */
  .wave { position:absolute; left:0; top:0; width:1024px; height:500px; }
  /* score ring */
  .ring { position:absolute; right:96px; top:50%; transform:translateY(-50%); }
  .ringnum { position:absolute; right:96px; top:50%; width:150px; text-align:center;
    transform:translate(0,-50%); }
  .ringnum .n { color:#F5F5F7; font-size:64px; font-weight:800; letter-spacing:-2px; }
  .ringnum .l { color:#63E6A3; font-size:17px; font-weight:700; letter-spacing:2px;
    text-transform:uppercase; margin-top:2px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="grid"></div>

    <svg class="wave" viewBox="0 0 1024 500" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0"   stop-color="#FF5A44" stop-opacity="0"/>
          <stop offset="0.28" stop-color="#FF5A44" stop-opacity="0.9"/>
          <stop offset="0.75" stop-color="#FF8A6E" stop-opacity="1"/>
          <stop offset="1"   stop-color="#FFB59E" stop-opacity="0.9"/>
        </linearGradient>
        <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
          <feGaussianBlur stdDeviation="5" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <!-- ECG / beat-to-beat trace centered vertically ~ y=360 baseline -->
      <path filter="url(#glow)" fill="none" stroke="url(#wg)" stroke-width="4"
        stroke-linejoin="round" stroke-linecap="round"
        d="M0,362 L150,362 L196,362 L214,352 L236,372 L262,300 L286,410 L312,362 L360,362
           L470,362 L500,362 L516,356 L532,368 L556,318 L580,398 L604,362 L660,362
           L720,362 L742,362 L760,300 L790,430 L816,362 L860,362
           L905,362 L924,354 L942,370 L1024,362"/>
    </svg>

    <div class="text">
      <div class="eyebrow">HRV · POTS · Recovery</div>
      <div class="head">See your nervous<br>system <span class="accent">recover.</span></div>
      <div class="sub">Research-graded HRV, symptom &amp; recovery tracking. Private and on-device.</div>
    </div>

    <svg class="ring" width="188" height="188" viewBox="0 0 188 188">
      <circle cx="94" cy="94" r="82" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/>
      <circle cx="94" cy="94" r="82" fill="none" stroke="#63E6A3" stroke-width="12"
        stroke-linecap="round" stroke-dasharray="515" stroke-dashoffset="93"
        transform="rotate(-90 94 94)"/>
    </svg>
    <div class="ringnum"><div class="n">87</div><div class="l">Great</div></div>
  </div>
</body>
</html>
