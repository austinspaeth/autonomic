    // Render the ordered field schema into `body`, collecting controls into
    // `inputs` (keyed by field key). Consecutive number fields are grouped into
    // a 2-column grid; everything else (select/time/check/divider, and lone
    // numbers) is rendered full width.
    function buildFieldInputs(body, fields, r, inputs) {
      // Number field -> .field; signed fields get a ± toggle (decimal keypads
      // lack a minus key, so you type the magnitude and tap ± to negate).
      const makeField = (f) => {
        const inp = numInput(r[f.key]);
        inputs[f.key] = inp;
        if (f.signed) {
          const btn = el("button.sign-btn", {
            type: "button", text: "±", "aria-label": "Toggle negative",
            onclick: () => { const v = inp.value.trim(); if (v === "" || v === "-") return; inp.value = v[0] === "-" ? v.slice(1) : "-" + v; },
          });
          return field(fieldLabel(f), el("div.signed-input", {}, [inp, btn]));
        }
        return field(fieldLabel(f), inp);
      };
      let run = [];
      const flushRun = () => {
        if (!run.length) return;
        if (run.length === 1) {
          body.appendChild(makeField(run[0]));
        } else {
          const grid = el("div.field-grid");
          run.forEach((f) => grid.appendChild(makeField(f)));
          body.appendChild(grid);
        }
        run = [];
      };
      fields.forEach((f) => {
        if (isNumberField(f)) { run.push(f); return; }
        flushRun();
        if (isDivider(f)) {
          body.appendChild(el("div.field-divider"));
        } else if (f.type === "select") {
          const sel = el("select", {}, f.options.map((o) => el("option", { value: o, text: o })));
          sel.value = r[f.key] != null && r[f.key] !== "" ? r[f.key] : f.options[0];
          inputs[f.key] = sel;
          body.appendChild(field(fieldLabel(f), sel));
        } else if (f.type === "time") {
          const t = el("input", { type: "time", value: r[f.key] || nowTime() });
          inputs[f.key] = t;
          body.appendChild(field(f.label || "Time", t));
        } else if (f.type === "check") {
          const cb = el("input", { type: "checkbox" });
          cb.checked = !!r[f.key];
          inputs[f.key] = cb;
          body.appendChild(el("div.field.field-check", {}, [el("label", {}, [cb, el("span", { text: f.label })])]));
        } else if (f.type === "textarea") {
          const ta = el("textarea", { placeholder: f.placeholder || "" });
          ta.value = r[f.key] || "";
          inputs[f.key] = ta;
          body.appendChild(field(f.label, ta));
        } else if (f.type === "text") {
          const ti = el("input", { type: "text", value: r[f.key] || "", placeholder: f.placeholder || "" });
          inputs[f.key] = ti;
          body.appendChild(field(f.label, ti));
        }
      });
      flushRun();
    }

    // Generic add/edit form for a typed entry (reading or activity).
    function openEntryForm(typeMap, arrKey, type, existing) {
      const def = typeMap[type];
      const r = existing ? { ...existing } : { id: uid(), type, time: nowTime(), note: "" };
      const fields = entryFields(def);
      openModal((body) => {
        body.appendChild(el("h2", { text: (existing ? "Edit " : "") + def.label }));
        const inputs = {};
        buildFieldInputs(body, fields, r, inputs);

        body.appendChild(
          el("div.modal-actions", {}, [
            existing
              ? el("button.btn.btn-danger", {
                  text: "Delete",
                  onclick: () => {
                    const d = day(currentKey, true);
                    d[arrKey] = d[arrKey].filter((x) => x.id !== r.id);
                    save();
                    closeAll();
                    renderDay();
                  },
                })
              : null,
            el("button.btn.btn-primary", {
              text: "Save",
              onclick: () => {
                const numFields = fields.filter(isNumberField);
                const anyNum = numFields.some((f) => String(inputs[f.key].value).trim() !== "");
                const anyCheck = fields.filter((f) => f.type === "check").some((f) => inputs[f.key].checked);
                if (type === "bp") {
                  if (!inputs.sys.value.trim() && !inputs.dia.value.trim())
                    return toast("Enter a blood pressure");
                } else if (numFields.length && !anyNum && !anyCheck) {
                  return toast("Enter a value");
                }
                fields.forEach((f) => {
                  if (isDivider(f)) return;
                  if (f.type === "check") r[f.key] = inputs[f.key].checked;
                  else r[f.key] = String(inputs[f.key].value).trim();
                });
                r.scores = computeScores(r); // store category scores with the entry
                const d = day(currentKey, true);
                const i = d[arrKey].findIndex((x) => x.id === r.id);
                if (i >= 0) d[arrKey][i] = r;
                else d[arrKey].push(r);
                if (def && typeof def.onSave === "function") def.onSave(r);
                save();
                closeAll();
                renderDay();
              },
            }),
          ])
        );
      });
    }

    // Indoor bike - custom form: a conditional section that is either a single
    // Resistance field or a repeatable list of interval cards, depending on the
    // Interval-training checkbox.
    function bikeForm(existing) {
      const r = existing
        ? JSON.parse(JSON.stringify(existing))
        : { id: uid(), type: "indoorBike", time: nowTime(), note: "", interval: false, intervals: [] };
      if (!Array.isArray(r.intervals)) r.intervals = [];
      openModal((body) => {
        body.appendChild(el("h2", { text: (existing ? "Edit " : "") + "Indoor bike" }));

        const time = el("input", { type: "time", value: r.time || nowTime() });
        body.appendChild(field("Time", time));

        const num = {};
        const mk = (key, label, unit) => {
          num[key] = numInput(r[key]);
          return field(label + (unit ? ` (${unit})` : ""), num[key]);
        };
        body.appendChild(el("div.field-grid", {}, [
          mk("duration", "Duration", "min"),
          mk("distance", "Distance", "mi"),
          mk("avgHr", "Avg HR"),
          mk("maxHr", "Max HR"),
          mk("minHr", "Min HR"),
        ]));

        const intervalCb = el("input", { type: "checkbox" });
        intervalCb.checked = !!r.interval;
        body.appendChild(el("div.field.field-check", {}, [
          el("label", {}, [intervalCb, el("span", { text: "Interval training" })]),
        ]));

        body.appendChild(el("div.field-divider"));
        const dyn = el("div");
        body.appendChild(dyn);

        let resistanceInput = null;
        const rows = []; // { card, inp } for each interval
        const renderDyn = () => {
          dyn.innerHTML = "";
          rows.length = 0;
          if (!intervalCb.checked) {
            resistanceInput = numInput(r.resistance);
            dyn.appendChild(field("Resistance", resistanceInput));
            return;
          }
          resistanceInput = null;
          const list = el("div");
          dyn.appendChild(list);
          const renumber = () =>
            rows.forEach((e, i) => { e.card.querySelector(".interval-head span").textContent = "Interval " + (i + 1); });
          const addInterval = (data) => {
            const iv = data || {};
            const inp = {};
            const grid = el("div.field-grid", {}, [
              (() => { inp.length = numInput(iv.length); return field("Length (min)", inp.length); })(),
              (() => { inp.resistance = numInput(iv.resistance); return field("Resistance", inp.resistance); })(),
              (() => { inp.avgHr = numInput(iv.avgHr); return field("Avg HR", inp.avgHr); })(),
              (() => { inp.maxHr = numInput(iv.maxHr); return field("Max HR", inp.maxHr); })(),
            ]);
            const del = el("button.interval-del", { type: "button", html: ICONS.x, "aria-label": "Remove interval" });
            const card = el("div.interval-card", {}, [
              el("div.interval-head", {}, [el("span"), del]),
              grid,
            ]);
            const entry = { card, inp };
            del.onclick = () => {
              const idx = rows.indexOf(entry);
              if (idx >= 0) rows.splice(idx, 1);
              card.remove();
              renumber();
            };
            rows.push(entry);
            list.appendChild(card);
            renumber();
          };
          (r.intervals || []).forEach(addInterval);
          dyn.appendChild(el("button.add-interval", { type: "button", text: "+ Add interval", onclick: () => addInterval() }));
        };
        intervalCb.addEventListener("change", renderDyn);
        renderDyn();

        body.appendChild(el("div.field-divider"));
        const hr60 = numInput(r.hr60);
        body.appendChild(field("HR after 60 seconds", hr60));

        const note = el("textarea", { placeholder: "Optional note" });
        note.value = r.note || "";
        body.appendChild(field("Notes", note));

        body.appendChild(el("div.modal-actions", {}, [
          existing
            ? el("button.btn.btn-danger", {
                text: "Delete",
                onclick: () => {
                  const d = day(currentKey, true);
                  d.activities = d.activities.filter((x) => x.id !== r.id);
                  save();
                  closeAll();
                  renderDay();
                },
              })
            : null,
          el("button.btn.btn-primary", {
            text: "Save",
            onclick: () => {
              r.time = time.value;
              ["duration", "distance", "avgHr", "maxHr", "minHr"].forEach((k) => { r[k] = num[k].value.trim(); });
              r.interval = intervalCb.checked;
              if (intervalCb.checked) {
                r.intervals = rows.map((e) => ({
                  length: e.inp.length.value.trim(),
                  resistance: e.inp.resistance.value.trim(),
                  avgHr: e.inp.avgHr.value.trim(),
                  maxHr: e.inp.maxHr.value.trim(),
                }));
                r.resistance = "";
              } else {
                r.resistance = resistanceInput ? resistanceInput.value.trim() : "";
                r.intervals = [];
              }
              r.hr60 = hr60.value.trim();
              r.note = note.value.trim();
              const d = day(currentKey, true);
              const i = d.activities.findIndex((x) => x.id === r.id);
              if (i >= 0) d.activities[i] = r;
              else d.activities.push(r);
              save();
              closeAll();
              renderDay();
            },
          }),
        ]));
      });
    }

          if (!matches.length) { listWrap.appendChild(el("div.muted", { text: "No matches." })); return; }
          matches.forEach((type) => {

              el("button.menu-item", {

                el("div", {}, [el("div", { text: opts.typeMap[type].label })]),

          });
        };

        draw();
      });
    }

    /* ---------------- Calendar ---------------- */
    function openCalendar() {
      let view = dateFromKey(currentKey);
      view.setDate(1);
      openModal((body) => {
        body.appendChild(el("h2", { text: "Select date" }));
        const wrap = el("div");
        body.appendChild(wrap);
        const draw = () => {
          wrap.innerHTML = "";
          const monthName = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
          wrap.appendChild(
            el("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:12px" }, [
              el("button.icon-btn", { text: "‹", onclick: () => { view.setMonth(view.getMonth() - 1); draw(); } }),
              el("strong", { text: monthName, style: "font-size:16px" }),
              el("button.icon-btn", { text: "›", onclick: () => { view.setMonth(view.getMonth() + 1); draw(); } }),
            ])
          );
          const grid = el("div", { style: "display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center" });
          ["S", "M", "T", "W", "T", "F", "S"].forEach((d) =>
            grid.appendChild(el("div", { text: d, style: "font-size:11px;color:var(--text-dim);font-weight:700;padding:4px 0" }))
          );
          const first = new Date(view.getFullYear(), view.getMonth(), 1);
          const startPad = first.getDay();
          const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
          for (let i = 0; i < startPad; i++) grid.appendChild(el("div"));
          const todayKey = keyOf(new Date());
          for (let dn = 1; dn <= daysInMonth; dn++) {
            const dk = keyOf(new Date(view.getFullYear(), view.getMonth(), dn));
            const isSel = dk === currentKey;
            const isToday = dk === todayKey;
            const hasData = dayHasData(dk);
            const btn = el("button", {
              style:
                "position:relative;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;font-size:14px;font-family:inherit;" +
                (isSel
                  ? "background:var(--accent);color:#fff;font-weight:700;"
                  : "background:transparent;color:var(--text);") +
                (isToday && !isSel ? "outline:2px solid var(--accent);outline-offset:-2px;" : ""),
              text: String(dn),
              onclick: () => {
                currentKey = dk;
                closeAll();
                renderDate();
                renderDay();
              },
            });
            if (hasData && !isSel)
              btn.appendChild(
                el("span", {
                  style:
                    "position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)",
                })
              );
            grid.appendChild(btn);
          }
          wrap.appendChild(grid);
        };
        draw();
        body.appendChild(
          el("div.modal-actions", {}, [
            el("button.btn", {
              text: "Jump to Today",
              onclick: () => {
                currentKey = keyOf(new Date());
                closeAll();
                renderDate();
                renderDay();
              },
            }),
          ])
        );
      });
    }

    function dayHasData(k) {
      const d = state.days[k];
      if (!d) return false;
      return (
        (d.readings && d.readings.length) ||
        (Array.isArray(d.activities) && d.activities.length) ||
        (Array.isArray(d.meds) && d.meds.length) ||
        (Array.isArray(d.symptoms) && d.symptoms.length) ||
        (d.sleep && (d.sleep.bed || d.sleep.wake)) ||
        (d.food && (+d.food.water > 0 || +d.food.calories > 0 || Object.values(d.food.triggers || {}).some((c) => c > 0))) ||
        (d.digestion && Array.isArray(d.digestion.movements) && d.digestion.movements.length)
      );
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: `autonomic-journal-${keyOf(new Date())}.json` });
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Exported");
    }

    function importData() {
      const input = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!parsed || typeof parsed !== "object" || !("days" in parsed))
              throw new Error("Not an Autonomic Journal file");
            confirmImport(parsed, file.name);
          } catch (e) {
            toast("Import failed: " + e.message);
          }
        };
        reader.readAsText(file);
      });
      document.body.appendChild(input);
      input.click();
      input.remove();
    }

    function confirmImport(parsed, fileName) {
      openModal((body) => {
        body.appendChild(el("h2", { text: "Replace all data?" }));
        const days = Object.keys(parsed.days || {}).length;
        body.appendChild(
          el("p", {
            style: "color:var(--text-dim);font-size:14px",
            text: `This will replace everything currently on this device with the imported file (${days} day${days === 1 ? "" : "s"}). This cannot be undone.`,
          })
        );
        body.appendChild(
          el("div.modal-actions", {}, [
            el("button.btn", { text: "Cancel", onclick: closeModal }),
            el("button.btn.btn-danger", {
              text: "Replace",
              onclick: () => {
                state = migrate(parsed);
                state.meta.lastImport = { name: fileName || "(file)", at: new Date().toISOString() };
                currentKey = keyOf(new Date());
                save();
                applyTheme();
                renderDate();
                renderDay();
                renderAnalysis();
                closeAll();
                toast("Imported");
              },
            }),
          ])
        );
      });
    }

    /* ================= Analytics view ================= *
     * Animated Day/Week/Month/Year pill over a scrollable stack of analytics
     * containers. Each container is built from real logged data only and
     * returns null (renders nothing) when it has no data in range — there are
     * no "needs more data" placeholders. Week/Month/Year bucket the days and
     * average within each bucket. Every builder is wrapped in safe() so a
     * single failure can't blank the whole view.
     * ================================================== */

    // ----- time buckets -----
    function acRangeLabel() {
      return analysisMode === "day" ? "Last 15 days · daily"
        : analysisMode === "week" ? "Last 12 weeks · weekly average"
        : analysisMode === "month" ? "Last 12 months · monthly average"
        : "All time · yearly average";
    }

    // Ordered buckets for the active mode. Each: { start, end, label, days[] }.
    function acBuckets() {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const mk = (s, e, label) => ({ start: keyOf(s), end: keyOf(e), label, days: [] });
      let buckets = [];
      if (analysisMode === "day") {
        for (let i = 14; i >= 0; i--) { const dt = new Date(today); dt.setDate(today.getDate() - i); buckets.push(mk(dt, dt, `${dt.getMonth() + 1}/${dt.getDate()}`)); }
      } else if (analysisMode === "week") {
        const dow = (today.getDay() + 6) % 7; // Monday = 0
        const thisMon = new Date(today); thisMon.setDate(today.getDate() - dow);
        for (let i = 11; i >= 0; i--) { const s = new Date(thisMon); s.setDate(thisMon.getDate() - i * 7); const e = new Date(s); e.setDate(s.getDate() + 6); buckets.push(mk(s, e, `${s.getMonth() + 1}/${s.getDate()}`)); }
      } else if (analysisMode === "month") {
        for (let i = 11; i >= 0; i--) { const s = new Date(today.getFullYear(), today.getMonth() - i, 1); const e = new Date(today.getFullYear(), today.getMonth() - i + 1, 0); buckets.push(mk(s, e, s.toLocaleDateString(undefined, { month: "short" }))); }
      } else {
        const keys = Object.keys(state.days); let minY = today.getFullYear();
        keys.forEach((k) => { const y = +k.slice(0, 4); if (y < minY) minY = y; });
        for (let y = minY; y <= today.getFullYear(); y++) buckets.push(mk(new Date(y, 0, 1), new Date(y, 11, 31), String(y)));
      }
      const allKeys = Object.keys(state.days).sort();
      buckets.forEach((b) => { b.days = allKeys.filter((k) => k >= b.start && k <= b.end); });
      return buckets;
    }

    // ----- value extraction / aggregation -----
    const acMinOf = (t) => { const m = /^(\d{1,2}):(\d{2})/.exec(t || ""); return m ? (+m[1] * 60 + +m[2]) : null; };
    const acToDec = (t) => { const mo = acMinOf(t); return mo == null ? null : mo / 60; };
    const isMorning = (r) => { const mo = acMinOf(r.time); if (mo != null) return mo < 720; return (r.period || "") === "Morning"; };
    const isEvening = (r) => { const mo = acMinOf(r.time); if (mo != null) return mo >= 1080; return (r.period || "") === "Evening"; };

    function acReadVals(d, type, key, filt) {
      const out = [];
      (d.readings || []).forEach((r) => { if (r.type !== type) return; if (filt && !filt(r)) return; const v = parseFloat(r[key]); if (!isNaN(v)) out.push(v); });
      return out;
    }
    function acTotalPower(d, filt) {
      return (d.readings || []).filter((r) => r.type === "breathHrv" && (!filt || filt(r))).map((r) => {
        const p = ["vlowPower", "lowPower", "highPower"].map((k) => parseFloat(r[k]));
        return p.every((x) => !isNaN(x)) ? p[0] + p[1] + p[2] : null;
      }).filter((v) => v != null);
    }
    const acDayScore = (d, dk) => scoreSet(d.readings || [], d, dk).score;

    // Per-bucket mean of every value produced by valFn across that bucket's days.
    function acAgg(buckets, valFn) {
      return buckets.map((b) => {
        let s = 0, n = 0;
        b.days.forEach((dk) => { const v = valFn(state.days[dk], dk); if (v == null) return; (Array.isArray(v) ? v : [v]).forEach((x) => { if (x != null && !isNaN(x)) { s += x; n++; } }); });
        return n ? s / n : null;
      });
    }
    // Per-bucket sum of one number per day (e.g. total minutes, counts).
    function acAggSum(buckets, dayFn) {
      return buckets.map((b) => {
        let s = 0, any = false;
        b.days.forEach((dk) => { const v = dayFn(state.days[dk], dk); if (v != null && !isNaN(v)) { s += v; any = true; } });
        return any ? s : null;
      });
    }
    const acSeries = (buckets, type, key, color, label, filt, band) => ({ values: acAgg(buckets, (d) => acReadVals(d, type, key, filt)), color, label, pointBands: band || null });
    const acPresent = (vals) => vals.filter((v) => v != null && !isNaN(v));
    const acMean = (vals) => { const p = acPresent(vals); return p.length ? p.reduce((s, x) => s + x, 0) / p.length : null; };

    // ----- grade zones -----
    function acBandZones(bandName) {
      const b = BANDS[bandName]; if (!b) return null;
      const out = []; let prev = -1e9;
      b.forEach((seg) => { const to = seg.max === Infinity ? 1e9 : seg.max; out.push({ from: prev, to, color: SCORE_COLORS[seg.cat] || "#888" }); prev = seg.max; });
      return out;
    }
    function acScoreZones() {
      const cats = [...SCORE_CATS].sort((a, b) => a.min - b.min);
      return cats.map((c, i) => ({ from: c.min, to: i < cats.length - 1 ? cats[i + 1].min : 100, color: c.color }));
    }

    // ----- SVG line chart over buckets -----
    // Mirrors the summary-drawer sparklines (buildSpark): no zone-fill
    // backgrounds — single-metric lines take a vertical grade gradient, a
    // "Show zones" link toggles dashed boundary lines, axis labels share one
    // style, and you can drag/hover to read each bucket's value.
    function acChart(buckets, series, opts) {
      opts = opts || {};
      const ns = "http://www.w3.org/2000/svg";
      const mk = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
      const all = []; series.forEach((s) => s.values.forEach((v) => { if (v != null && !isNaN(v)) all.push(v); }));
      if (!all.length) return null;
      let min = Math.min(...all), max = Math.max(...all);
      if (opts.target) { min = Math.min(min, opts.target.from); max = Math.max(max, opts.target.to); }
      if (min === max) { const e = (Math.abs(min) || 1) * 0.1 + 0.5; min -= e; max += e; }
      const padv = (max - min) * 0.12; min -= padv; max += padv;
      const W = 320, H = opts.height || 132, padL = 34, padR = 10, padT = 10, padB = 22;
      const innerW = W - padL - padR, n = buckets.length;
      const xAt = (i) => padL + (n <= 1 ? innerW / 2 : (i / (n - 1)) * innerW);
      const yAt = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);
      const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none", class: "ac-svg" });
      const zones = (opts.zones && opts.zones.length) ? opts.zones : null;
      const zoneColorAt = (v) => { if (!zones) return null; for (const z of zones) if (v >= z.from && v < z.to) return z.color; return zones[zones.length - 1].color; };

      // y grid + labels
      [min, (min + max) / 2, max].forEach((val) => {
        const y = yAt(val);
        svg.appendChild(mk("line", { x1: padL, x2: W - padR, y1: y, y2: y, stroke: "var(--border)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0.6 }));
        const tx = mk("text", { x: padL - 4, y: y + 3, "text-anchor": "end", class: "chart-axis" }); tx.textContent = fmtNum(opts.integer ? Math.round(val) : val); svg.appendChild(tx);
      });
      // x labels
      const step = Math.max(1, Math.ceil(n / 6));
      buckets.forEach((b, i) => { if (i % step !== 0 && i !== n - 1) return; const tx = mk("text", { x: xAt(i), y: H - 6, "text-anchor": "middle", class: "chart-axis" }); tx.textContent = b.label; svg.appendChild(tx); });

      // Optional zone-boundary dashed lines (toggled by "Show zones"), plus any
      // target band shown as a pair of dashed lines in its color.
      const guides = [];
      if (zones) for (let i = 0; i < zones.length - 1; i++) { const bv = zones[i].to; if (bv > min && bv < max) guides.push({ v: bv, color: zones[i].color }); }
      if (opts.target) [opts.target.from, opts.target.to].forEach((bv) => { if (bv > min && bv < max) guides.push({ v: bv, color: opts.target.color || "#3b82f6" }); });
      let guideG = null;
      if (guides.length) {
        guideG = mk("g", {}); guideG.style.display = "none";
        guides.forEach((g) => guideG.appendChild(mk("line", { x1: padL, x2: padL + innerW, y1: yAt(g.v), y2: yAt(g.v), stroke: g.color, "stroke-width": 1.5, "stroke-dasharray": "4 3", "vector-effect": "non-scaling-stroke", opacity: 0.95 })));
        svg.appendChild(guideG);
      }

      // Single-metric charts get the grade gradient on the line (like the
      // summary sparklines); multi-series comparisons keep distinct colors so
      // the legend stays meaningful.
      const mainSeries = series.filter((s) => !s.dashed);
      const gradientSeries = (zones && mainSeries.length === 1) ? mainSeries[0] : null;
      const dotColor = (s, v) => {
        if (s.pointColorFn) return s.pointColorFn(v);
        if (s.pointBands) { const c = catFromBands(v, s.pointBands); if (c && SCORE_COLORS[c]) return SCORE_COLORS[c]; }
        if (s === gradientSeries) return zoneColorAt(v) || s.color;
        return s.color;
      };

      series.forEach((s) => {
        const pts = []; s.values.forEach((v, i) => { if (v != null && !isNaN(v)) pts.push([xAt(i), yAt(v), v]); });
        if (!pts.length) return;
        let stroke = s.color;
        if (s === gradientSeries) {
          const gid = "acg" + (acChart._n = (acChart._n || 0) + 1);
          const grad = mk("linearGradient", { id: gid, gradientUnits: "userSpaceOnUse", x1: 0, y1: padT, x2: 0, y2: H - padB });
          const offAt = (v) => Math.max(0, Math.min(1, 1 - (v - min) / (max - min)));
          const addStop = (o, c) => grad.appendChild(mk("stop", { offset: o, "stop-color": c }));
          addStop(0, zoneColorAt(max - 1e-9));
          zones.map((z) => z.to).filter((m) => m > min && m < max).sort((a, b) => b - a).forEach((bv) => { addStop(offAt(bv), zoneColorAt(bv + 1e-9)); addStop(offAt(bv), zoneColorAt(bv - 1e-9)); });
          addStop(1, zoneColorAt(min + 1e-9));
          const defs = mk("defs", {}); defs.appendChild(grad); svg.appendChild(defs);
          stroke = `url(#${gid})`;
        }
        if (pts.length >= 2) { const path = mk("path", { d: smoothPath(pts.map((p) => [p[0], p[1]])), fill: "none", stroke, "stroke-width": 2.4, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round", "stroke-linecap": "round" }); if (s.dashed) path.setAttribute("stroke-dasharray", "5 4"); svg.appendChild(path); }
        pts.forEach((p) => svg.appendChild(mk("circle", { cx: p[0], cy: p[1], r: pts.length > 20 ? 1.8 : 2.6, fill: dotColor(s, p[2]) })));
      });

      // Drag / hover readout: a marker line + a dot per series + a value line.
      const marker = mk("line", { y1: padT, y2: H - padB, stroke: "var(--text)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0 });
      svg.appendChild(marker);
      const hdots = series.map(() => { const c = mk("circle", { r: 3.4, opacity: 0 }); svg.appendChild(c); return c; });

      const wrap = el("div.ac-chart-wrap");
      const readout = el("div.spark-readout");
      const top = el("div.spark-top", {}, [readout]);
      if (guideG) {
        const btn = el("button.spark-zones-btn", { type: "button", text: "Show zones" });
        btn.addEventListener("click", () => { const on = guideG.style.display === "none"; guideG.style.display = on ? "" : "none"; btn.textContent = on ? "Hide zones" : "Show zones"; });
        top.appendChild(btn);
      }
      wrap.appendChild(top); wrap.appendChild(svg);

      const multi = series.filter((s) => s.label).length > 1;
      const show = (i) => {
        i = Math.max(0, Math.min(n - 1, i));
        const x = xAt(i);
        marker.setAttribute("x1", x); marker.setAttribute("x2", x); marker.setAttribute("opacity", 0.35);
        const vals = [];
        series.forEach((s, si) => {
          const v = s.values[i];
          if (v == null || isNaN(v)) { hdots[si].setAttribute("opacity", 0); return; }
          const col = dotColor(s, v);
          hdots[si].setAttribute("cx", x); hdots[si].setAttribute("cy", yAt(v)); hdots[si].setAttribute("fill", col); hdots[si].setAttribute("opacity", 1);
          vals.push((multi && s.label ? s.label + " " : "") + fmtNum(opts.integer ? Math.round(v) : v));
        });
        readout.textContent = vals.length ? `${buckets[i].label}: ${vals.join(" · ")}` : buckets[i].label;
      };
      const idxFromEvent = (e) => { const rc = svg.getBoundingClientRect(); const px = ((e.clientX - rc.left) / (rc.width || 1)) * W; return Math.round(((px - padL) / innerW) * (n - 1)); };
      let active = false;
      svg.addEventListener("pointerdown", (e) => { active = true; try { svg.setPointerCapture(e.pointerId); } catch (_) {} show(idxFromEvent(e)); });
      svg.addEventListener("pointermove", (e) => { if (active) show(idxFromEvent(e)); });
      const end = () => { active = false; };
      svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
      // Default the readout/marker to the latest bucket that has data.
      let lastIdx = -1; for (let i = n - 1; i >= 0; i--) { if (series.some((s) => s.values[i] != null && !isNaN(s.values[i]))) { lastIdx = i; break; } }
      if (lastIdx >= 0) show(lastIdx);
      return wrap;
    }

    function acLegend(series) {
      const s = series.filter((x) => x.label); if (s.length < 2) return null;
      return el("div.ac-legend", {}, s.map((x) => el("span.ac-leg", {}, [el("span.ac-dot", { style: `background:${x.color}` }), x.label])));
    }
    function acBlock(label, buckets, series, opts) {
      const chart = acChart(buckets, series, opts); if (!chart) return null;
      const kids = [label ? el("div.ac-block-label", { text: label }) : null, chart];
      const lg = acLegend(series); if (lg) kids.push(lg);
      return el("div.ac-block", {}, kids.filter(Boolean));
    }
    function acCard(title, sub, children) {
      const kids = (children || []).filter(Boolean); if (!kids.length) return null;
      const head = [el("h3", { text: title })]; if (sub) head.push(el("div.ac-sub", { text: sub }));
      return el("div.chart-card.ac-card", {}, [...head, ...kids]);
    }
    function acStats(items) {
      const f = items.filter(Boolean); if (!f.length) return null;
      return el("div.stat-grid", {}, f.map((it) => el("div.stat", {}, [
        el("div.stat-label", { text: it.label }),
        el("div.stat-value", { style: it.color ? `color:${it.color}` : "" }, [it.value == null ? "-" : String(it.value), it.sub ? el("small", { text: " " + it.sub }) : null]),
      ])));
    }
    function acInsight(text, strength) { return el("div.ac-insight" + (strength ? ".s-" + strength : ""), {}, [el("span.ac-insight-bar"), el("div", { text })]); }
    function acBars(rows, opts) {
      opts = opts || {}; if (!rows.length) return null;
      const max = Math.max(...rows.map((r) => r.count)) || 1;
      return el("div.ac-bars", {}, rows.map((r) => el("div.freq-row", {}, [
        el("div.freq-name", { text: r.name }),
        el("div.freq-bar-wrap", {}, [el("div.freq-bar", { style: `width:${(r.count / max) * 100}%${r.color ? `;background:${r.color}` : ""}` })]),
        el("div.freq-count", { text: opts.fmt ? opts.fmt(r.count) : String(r.count) }),
      ])));
    }
    function acTrendChip(delta, opts) {
      opts = opts || {}; if (delta == null) return null;
      const flat = Math.abs(delta) < (opts.eps || 0.5), up = delta > 0;
      const sym = flat ? "→" : up ? "↑" : "↓";
      let cls = flat ? "flat" : (up === (opts.goodUp !== false) ? "good" : "bad");
      return el("span.ac-trend." + cls, { text: `${sym} ${fmtNum(Math.abs(Math.round(delta * 10) / 10))}${opts.unit || ""}` });
    }
    // first vs last present bucket value
    function acDelta(vals) { const idx = vals.map((v, i) => (v != null && !isNaN(v) ? i : -1)).filter((i) => i >= 0); if (idx.length < 2) return null; return vals[idx[idx.length - 1]] - vals[idx[0]]; }

    // ===== Containers =====

    function acAutonomicOutlook(buckets) {
      const vals = acAgg(buckets, (d, dk) => acDayScore(d, dk));
      if (!acPresent(vals).length) return null;
      const win = analysisMode === "day" ? 7 : 3;
      const roll = vals.map((_, i) => { const seg = vals.slice(Math.max(0, i - win + 1), i + 1).filter((v) => v != null && !isNaN(v)); return seg.length ? seg.reduce((s, x) => s + x, 0) / seg.length : null; });

      const daily = [];
      buckets.forEach((b) => b.days.forEach((dk) => { const sc = acDayScore(state.days[dk], dk); if (sc != null) daily.push({ dk, sc }); }));
      const best = daily.reduce((a, b) => (b.sc > a.sc ? b : a), daily[0]);
      const worst = daily.reduce((a, b) => (b.sc < a.sc ? b : a), daily[0]);
      const counts = {}; daily.forEach((x) => { const c = scoreCat(x.sc).short; counts[c] = (counts[c] || 0) + 1; });
      const order = SCORE_CATS.map((c) => c.short);
      const gMax = Math.max(1, ...order.filter((s) => counts[s]).map((s) => counts[s]));
      const grades = el("div.ac-grade-bars", {}, order.filter((s) => counts[s]).map((s) => {
        const cat = SCORE_CATS.find((c) => c.short === s), n = counts[s];
        return el("div.ac-grade-bar-row", {}, [
          el("div.ac-grade-bar-track", {}, [el("i", { style: `width:${Math.round(n / gMax * 100)}%;background:${cat.color}` })]),
          el("div.ac-grade-bar-lbl", {}, [el("b", { text: String(n) }), ` ${s.toLowerCase()} day${n === 1 ? "" : "s"}`]),
        ]);
      }));
      const delta = acDelta(roll.some((v) => v != null) ? roll : vals);

      return acCard("Autonomic Outlook", acRangeLabel(), [
        acBlock(null, buckets, [
          { values: vals, color: "var(--accent)", pointColorFn: (v) => scoreCat(v).color, label: "Score" },
          { values: roll, color: "var(--text-dim)", dashed: true, label: win + "-pt avg" },
        ], { zones: acScoreZones(), height: 152, integer: true }),
        acStats([
          { label: "Average", value: Math.round(acMean(vals)), color: scoreCat(acMean(vals)).color },
          { label: "Trend", value: null, sub: null },
          { label: "Best day", value: best.sc, sub: fmtShort(best.dk), color: scoreCat(best.sc).color },
          { label: "Worst day", value: worst.sc, sub: fmtShort(worst.dk), color: scoreCat(worst.sc).color },
        ]),
        el("div.stat.ac-direction", {}, [el("div.stat-label", { text: "Direction" }), acTrendChip(delta, { goodUp: true }) || el("span.stat-value", { text: "—" })]),
        daily.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Days in each grade" }), grades]) : null,
      ]);
    }

    function acComparison(buckets) {
      const present = buckets.filter((b) => b.days.length);
      if (present.length < 2) return null;
      const unit = analysisMode === "day" ? "day" : analysisMode === "week" ? "week" : analysisMode === "month" ? "month" : "year";
      const rows = [
        { name: "Autonomic score", v: acAgg(buckets, (d, dk) => acDayScore(d, dk)), goodUp: true },
        { name: "Structured RMSSD", v: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "rmssd")), goodUp: true },
        { name: "Resting HR (laying)", v: acAgg(buckets, (d) => acReadVals(d, "restingHr", "hr", (r) => (r.position || "") === "Laying")), goodUp: false },
        { name: "Sleep hours", v: acAgg(buckets, (d, dk) => sleepHours(dk)), goodUp: true },
      ];
      const built = rows.map((r) => {
        const idx = r.v.map((v, i) => (v != null && !isNaN(v) ? i : -1)).filter((i) => i >= 0);
        if (idx.length < 2) return null;
        const cur = r.v[idx[idx.length - 1]], prev = r.v[idx[idx.length - 2]];
        const best = r.goodUp ? Math.max(...idx.map((i) => r.v[i])) : Math.min(...idx.map((i) => r.v[i]));
        return el("div.ac-cmp-row", {}, [
          el("div.ac-cmp-name", { text: r.name }),
          el("div.ac-cmp-vals", {}, [el("span.prev", { text: fmtNum(Math.round(prev * 10) / 10) + " → " }), fmtNum(Math.round(cur * 10) / 10) + ` (best ${fmtNum(Math.round(best * 10) / 10)})`]),
          acTrendChip(cur - prev, { goodUp: r.goodUp }) || el("span"),
        ]);
      }).filter(Boolean);
      if (!built.length) return null;
      return acCard("Comparison", `This ${unit} vs last ${unit}`, [el("div.ac-cmp", {}, built)]);
    }

    function acHeatMapCard() {
      const nDays = analysisMode === "day" ? 42 : analysisMode === "week" ? 84 : analysisMode === "month" ? 183 : 371;
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const start = new Date(today); start.setDate(today.getDate() - (nDays - 1)); start.setDate(start.getDate() - start.getDay());
      const grid = el("div.ac-heat"); let any = false;
      // Tapping a day shows its date + score (and grade) in a readout pinned to
      // the bottom-right of the grid.
      const readout = el("div.ac-heat-readout", { html: '<span class="muted">Tap a day for its score</span>' });
      let selCell = null;
      for (let dt = new Date(start); dt <= today; dt.setDate(dt.getDate() + 1)) {
        const dk = keyOf(dt), d = state.days[dk], cell = el("div.ac-heat-cell", { title: dk });
        let sc = null, cat = null;
        if (d) { sc = acDayScore(d, dk); if (sc != null) { cat = scoreCat(sc); cell.style.background = cat.color; cell.title = `${dk}: ${sc} (${cat.short})`; any = true; } const cl = dayCleanliness(dk); if (cl && cl.clean) cell.classList.add("clean"); }
        cell.addEventListener("click", () => {
          if (selCell) selCell.classList.remove("sel");
          selCell = cell; cell.classList.add("sel");
          readout.innerHTML = sc == null
            ? `${fmtShort(dk)} · <span class="muted">no score</span>`
            : `${fmtShort(dk)} · <span style="color:${cat.color}">${sc} ${cat.short}</span>`;
        });
        grid.appendChild(cell);
      }
      if (!any) return null;
      const swatches = [...SCORE_CATS].sort((a, b) => a.min - b.min).map((c) => el("span", { style: `width:11px;height:11px;border-radius:3px;display:inline-block;background:${c.color}`, title: c.short }));
      return acCard("Calendar Heat Map", `Last ${nDays} days · colored by autonomic score`, [
        grid,
        readout,
        el("div.ac-heat-legend", {}, ["Crash", ...swatches, "Excellent"]),
        el("div.ac-heat-legend", {}, [el("span.ac-heat-cell.clean", { style: "background:var(--surface-2)" }), "ring = clean day"]),
      ]);
    }

    function acWeekPattern() {
      const dows = [[], [], [], [], [], [], []];
      Object.keys(state.days).forEach((dk) => { const sc = acDayScore(state.days[dk], dk); if (sc != null) dows[dateFromKey(dk).getDay()].push(sc); });
      const total = dows.reduce((s, a) => s + a.length, 0); if (total < 7) return null;
      const names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const avgs = dows.map((a) => (a.length ? a.reduce((s, x) => s + x, 0) / a.length : null));
      const rows = names.map((nm, i) => avgs[i] == null ? null : { name: nm, count: Math.round(avgs[i]), color: scoreCat(avgs[i]).color }).filter(Boolean);
      const wk = [1, 2, 3, 4, 5].flatMap((i) => dows[i]), we = [0, 6].flatMap((i) => dows[i]);
      const wkA = wk.length ? Math.round(wk.reduce((s, x) => s + x, 0) / wk.length) : null;
      const weA = we.length ? Math.round(we.reduce((s, x) => s + x, 0) / we.length) : null;
      const bestI = avgs.reduce((bi, v, i) => (v != null && (bi < 0 || v > avgs[bi]) ? i : bi), -1);
      const worstI = avgs.reduce((wi, v, i) => (v != null && (wi < 0 || v < avgs[wi]) ? i : wi), -1);
      return acCard("Week Pattern", "Average autonomic score by day of week", [
        acBars(rows, {}),
        acStats([
          { label: "Weekday avg", value: wkA, color: wkA != null ? scoreCat(wkA).color : "" },
          { label: "Weekend avg", value: weA, color: weA != null ? scoreCat(weA).color : "" },
        ]),
        bestI >= 0 && worstI >= 0 && bestI !== worstI ? acInsight(`${names[bestI]} is your strongest day (avg ${Math.round(avgs[bestI])}); ${names[worstI]} the weakest (avg ${Math.round(avgs[worstI])}).`) : null,
      ]);
    }

    function acAllHrv(buckets) {
      const lfTargetDays = Object.keys(state.days).reduce((s, dk) => s + acReadVals(state.days[dk], "breathHrv", "lfPeak").filter((v) => v >= 0.08 && v <= 0.10).length, 0);
      const rmssdS = acAgg(buckets, (d) => acReadVals(d, "breathHrv", "rmssd"));
      const tp = acAgg(buckets, (d) => acTotalPower(d));
      const blocks = [
        acBlock("RMSSD (structured vs unstructured)", buckets, [
          { values: rmssdS, color: "#4ade80", label: "Structured" },
          { values: acAgg(buckets, (d) => acReadVals(d, "hrv", "rmssd")), color: "#38bdf8", label: "Unstructured" },
        ], { zones: acBandZones("rmssdS") }),
        acBlock("pNN50", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "pnn50")), color: "#4ade80" }], { zones: acBandZones("pnn50") }),
        acBlock("Total power", buckets, [{ values: tp, color: "#a78bfa" }], { zones: acBandZones("totalPower"), integer: true }),
        acBlock("LF peak frequency", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "lfPeak")), color: "#38bdf8" }], { zones: acBandZones("lfPeak"), target: { from: 0.08, to: 0.10, color: "#16a34a" } }),
        acBlock("HF power", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "highPower")), color: "#4ade80" }], { integer: true }),
        acBlock("VLF power", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "vlowPower")), color: "#a78bfa" }], { zones: acBandZones("vlf"), integer: true }),
      ];
      const stats = acStats([
        { label: "Avg RMSSD", value: acMean(rmssdS) != null ? Math.round(acMean(rmssdS)) : null },
        { label: "Avg total power", value: acMean(tp) != null ? Math.round(acMean(tp)) : null },
        { label: "LF peak in target", value: lfTargetDays || null, sub: "readings 0.08–0.10 Hz" },
      ]);
      return acCard("All HRV Readings", acRangeLabel(), [...blocks, stats]);
    }

    function acStructuredHrv(buckets) {
      const colors = { vlf: "#a78bfa", lf: "#38bdf8", hf: "#4ade80" };
      const segFn = (i) => {
        const b = buckets[i];
        const m = (k) => { const vs = []; b.days.forEach((dk) => acReadVals(state.days[dk], "breathHrv", k).forEach((v) => vs.push(v))); return vs.length ? vs.reduce((s, x) => s + x, 0) / vs.length : null; };
        const vlf = m("vlowPower"), lf = m("lowPower"), hf = m("highPower");
        return (vlf == null && lf == null && hf == null) ? null : { vlf: vlf || 0, lf: lf || 0, hf: hf || 0 };
      };
      const stack = acStackBars(buckets, segFn, colors);
      return acCard("Structured HRV (4/5 breathing)", "Your most reliable readings", [
        acBlock("Coherence", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "coherence")), color: "#38bdf8" }], { zones: acBandZones("coherence") }),
        acBlock("LF peak progression", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "lfPeak")), color: "#4ade80" }], { zones: acBandZones("lfPeak"), target: { from: 0.08, to: 0.10, color: "#16a34a" } }),
        stack ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Power distribution (VLF / LF / HF)" }), stack, el("div.ac-legend", {}, [["VLF", colors.vlf], ["LF", colors.lf], ["HF", colors.hf]].map(([l, c]) => el("span.ac-leg", {}, [el("span.ac-dot", { style: `background:${c}` }), l])))]) : null,
      ]);
    }

    function acUnstructuredHrv(buckets) {
      let blueDays = 0; Object.keys(state.days).forEach((dk) => { if (blueZone(state.days[dk].readings || [])) blueDays++; });
      return acCard("Unstructured HRV", "Reality check vs structured readings", [
        acBlock("Readiness", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "hrv", "readiness")), color: "#38bdf8", pointBands: BANDS.readiness }], { zones: acBandZones("readiness") }),
        acBlock("RMSSD overlay (unstructured vs structured)", buckets, [
          { values: acAgg(buckets, (d) => acReadVals(d, "hrv", "rmssd")), color: "#38bdf8", label: "Unstructured" },
          { values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "rmssd")), color: "#4ade80", label: "Structured" },
        ], { zones: acBandZones("rmssdU") }),
        blueDays ? acInsight(`${blueDays} blue-zone day${blueDays === 1 ? "" : "s"}: high unstructured readiness (≥90%) masking a fragile structured RMSSD.`, "mod") : null,
      ]);
    }

    function acFilteredReadings(buckets, title, filt, sub) {
      const blocks = [
        acBlock("RMSSD (structured)", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "rmssd", filt)), color: "#4ade80" }], { zones: acBandZones("rmssdS") }),
        acBlock("Total power", buckets, [{ values: acAgg(buckets, (d) => acTotalPower(d, filt)), color: "#a78bfa" }], { integer: true }),
        acBlock("LF peak", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "breathHrv", "lfPeak", filt)), color: "#38bdf8" }], { zones: acBandZones("lfPeak"), target: { from: 0.08, to: 0.10, color: "#16a34a" } }),
        acBlock("Blood pressure", buckets, [
          { values: acAgg(buckets, (d) => acReadVals(d, "bp", "sys", filt)), color: "var(--accent)", label: "Sys" },
          { values: acAgg(buckets, (d) => acReadVals(d, "bp", "dia", filt)), color: "#3b82f6", label: "Dia" },
        ], {}),
        acBlock("Resting HR", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "restingHr", "hr", filt)), color: "var(--accent)" }], {}),
      ];
      return acCard(title, sub, blocks);
    }
    const acMorning = (b) => acFilteredReadings(b, "Morning Readings", isMorning, "Readings before 12pm");
    function acEvening(buckets) {
      const card = acFilteredReadings(buckets, "Evening Readings", isEvening, "Readings after 6pm");
      if (!card) return null;
      // day-cost: morning→evening structured RMSSD drop
      const costs = acAgg(buckets, (d) => {
        const m = acReadVals(d, "breathHrv", "rmssd", isMorning), e = acReadVals(d, "breathHrv", "rmssd", isEvening);
        if (!m.length || !e.length) return null;
        return (m.reduce((s, x) => s + x, 0) / m.length) - (e.reduce((s, x) => s + x, 0) / e.length);
      });
      const block = acBlock("Day cost (morning → evening RMSSD drop)", buckets, [{ values: costs, color: "#f97316" }], { integer: true });
      const avgCost = acMean(costs);
      if (block) { card.appendChild(block); if (avgCost != null) card.appendChild(acInsight(`Average day cost: structured RMSSD drops ${fmtNum(Math.round(avgCost * 10) / 10)} points from morning to evening.`)); }
      return card;
    }

    function acBloodPressure(buckets) {
      const sys = acAgg(buckets, (d) => acReadVals(d, "bp", "sys"));
      if (!acPresent(sys).length) return null;
      const dia = acAgg(buckets, (d) => acReadVals(d, "bp", "dia"));
      const pp = acAgg(buckets, (d) => (d.readings || []).filter((r) => r.type === "bp").map((r) => { const s = parseFloat(r.sys), di = parseFloat(r.dia); return (!isNaN(s) && !isNaN(di)) ? s - di : null; }).filter((v) => v != null));
      let high = 0, low = 0, allSys = [];
      Object.keys(state.days).forEach((dk) => (state.days[dk].readings || []).forEach((r) => { if (r.type !== "bp") return; const s = parseFloat(r.sys), di = parseFloat(r.dia); if (!isNaN(s)) { allSys.push(s); if (s >= 136 || di >= 88) high++; if (s < 100) low++; } }));
      const mean = allSys.reduce((s, x) => s + x, 0) / (allSys.length || 1);
      const variance = allSys.length ? Math.sqrt(allSys.reduce((s, x) => s + (x - mean) * (x - mean), 0) / allSys.length) : null;
      return acCard("Blood Pressure", acRangeLabel(), [
        acBlock("Systolic / diastolic", buckets, [{ values: sys, color: "var(--accent)", label: "Systolic" }, { values: dia, color: "#3b82f6", label: "Diastolic" }], {}),
        acBlock("Pulse pressure (sys − dia)", buckets, [{ values: pp, color: "#a78bfa", pointBands: BANDS.pp }], { zones: acBandZones("pp") }),
        acStats([
          { label: "Avg morning", value: avgRound(acAgg(buckets, (d) => acReadVals(d, "bp", "sys", isMorning))), sub: "sys" },
          { label: "Avg evening", value: avgRound(acAgg(buckets, (d) => acReadVals(d, "bp", "sys", isEvening))), sub: "sys" },
          { label: "High BP days", value: high || null, sub: "≥136/88" },
          { label: "Variability", value: variance != null ? Math.round(variance) : null, sub: "σ sys" },
        ]),
      ]);
    }

    function acRestingHr(buckets) {
      const laying = acAgg(buckets, (d) => acReadVals(d, "restingHr", "hr", (r) => (r.position || "") === "Laying"));
      const sitting = acAgg(buckets, (d) => acReadVals(d, "restingHr", "hr", (r) => (r.position || "") === "Sitting"));
      const lowHr = acAgg(buckets, (d) => (d.sleep && d.sleep.hrLow != null ? parseFloat(d.sleep.hrLow) : null));
      const highHr = acAgg(buckets, (d) => (d.sleep && d.sleep.hrHigh != null ? parseFloat(d.sleep.hrHigh) : null));
      const ortho = acAgg(buckets, (d) => (d.readings || []).filter((r) => r.type === "orthostatic").map((r) => { const a = parseFloat(r.afterHr), bb = parseFloat(r.beforeHr); return (!isNaN(a) && !isNaN(bb)) ? a - bb : null; }).filter((v) => v != null));
      const blocks = [
        acBlock("Laying vs sitting HR", buckets, [{ values: laying, color: "var(--accent)", label: "Laying" }, { values: sitting, color: "#f97316", label: "Sitting" }], {}),
        acBlock("Sleep low vs high HR", buckets, [{ values: lowHr, color: "#38bdf8", label: "Low" }, { values: highHr, color: "var(--accent)", label: "High" }], {}),
        acBlock("Orthostatic delta (standing − resting)", buckets, [{ values: ortho, color: "#a78bfa" }], {}),
      ];
      const layAvg = acMean(laying);
      if (!blocks.some(Boolean)) return null;
      return acCard("Resting Heart Rate", acRangeLabel(), [
        ...blocks,
        layAvg != null ? acInsight(`Morning lying HR averages ${Math.round(layAvg)} — pre-illness baseline was trending toward 60–65.`, layAvg <= 67 ? "strong" : null) : null,
      ]);
    }

    function acBloodOxygen(buckets) {
      const spo2 = acAgg(buckets, (d) => acReadVals(d, "bloodO2", "value"));
      if (!acPresent(spo2).length) return null;
      let lowN = 0; Object.keys(state.days).forEach((dk) => acReadVals(state.days[dk], "bloodO2", "value").forEach((v) => { if (v < 94) lowN++; }));
      return acCard("Blood Oxygen", acRangeLabel(), [
        acBlock("SpO₂", buckets, [{ values: spo2, color: "#16a34a", pointBands: BANDS.spo2 }], { zones: acBandZones("spo2") }),
        acBlock("Perfusion index", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "bloodO2", "perfusion")), color: "#38bdf8" }], {}),
        lowN ? acInsight(`${lowN} reading${lowN === 1 ? "" : "s"} dropped below 94% SpO₂.`, "mod") : null,
      ]);
    }

    function acEcg(buckets) {
      const qtc = acAgg(buckets, (d) => acReadVals(d, "ecg", "qtc"));
      if (!acPresent(qtc).length && !Object.keys(state.days).some((dk) => (state.days[dk].readings || []).some((r) => r.type === "ecg"))) return null;
      let sinus = 0, svt = 0, other = 0, abnDays = 0;
      Object.keys(state.days).forEach((dk) => { let abn = false; (state.days[dk].readings || []).forEach((r) => { if (r.type !== "ecg") return; if (r.sinus) sinus++; if (r.svt) { svt++; abn = true; } if (r.otherArrhythmia) { other++; abn = true; } }); if (abn) abnDays++; });
      const rhythmRows = [sinus ? { name: "Sinus", count: sinus, color: SCORE_COLORS.great } : null, svt ? { name: "SVT", count: svt, color: SCORE_COLORS.concerning } : null, other ? { name: "Other arrhythmia", count: other, color: SCORE_COLORS.bad } : null].filter(Boolean);
      return acCard("ECG", acRangeLabel(), [
        acBlock("QTc", buckets, [{ values: qtc, color: "var(--accent)", pointBands: BANDS.qtc }], { zones: acBandZones("qtc"), integer: true }),
        acBlock("QRS duration", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "ecg", "qrs")), color: "#38bdf8", pointBands: BANDS.qrs }], { zones: acBandZones("qrs"), integer: true }),
        acBlock("PR interval", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "ecg", "pr")), color: "#a78bfa", pointBands: BANDS.pr }], { zones: acBandZones("pr"), integer: true }),
        acBlock("Ectopic beats", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "ecg", "ectopic")), color: "#f97316", pointBands: BANDS.ectopic }], { zones: acBandZones("ectopic"), integer: true }),
        rhythmRows.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Rhythm classification" }), acBars(rhythmRows, {})]) : null,
        abnDays ? acInsight(`${abnDays} day${abnDays === 1 ? "" : "s"} recorded a rhythm abnormality (SVT or other).`, "mod") : null,
      ]);
    }

    function acOrthostatic(buckets) {
      const has = Object.keys(state.days).some((dk) => (state.days[dk].readings || []).some((r) => r.type === "orthostatic"));
      if (!has) return null;
      const incOf = (r) => { const a = parseFloat(r.afterHr), b = parseFloat(r.beforeHr); return (!isNaN(a) && !isNaN(b)) ? a - b : null; };
      const dropOf = (r) => { const a = parseFloat(r.afterHr), m = parseFloat(r.hr1min); return (!isNaN(a) && !isNaN(m)) ? a - m : null; };
      const transitions = {};
      let potsN = 0;
      Object.keys(state.days).forEach((dk) => (state.days[dk].readings || []).forEach((r) => {
        if (r.type !== "orthostatic") return;
        if (r.transition) transitions[r.transition] = (transitions[r.transition] || 0) + 1;
        const inc = incOf(r); if (inc != null && inc >= 30) potsN++;
      }));
      const incVals = acAgg(buckets, (d) => (d.readings || []).filter((r) => r.type === "orthostatic").map(incOf).filter((v) => v != null));
      const dropVals = acAgg(buckets, (d) => (d.readings || []).filter((r) => r.type === "orthostatic").map(dropOf).filter((v) => v != null));
      return acCard("Orthostatic Events", acRangeLabel(), [

        acBlock("HR increase on standing (after − before)", buckets, [{ values: incVals, color: "#f97316", pointBands: BANDS.orthoIncrease }], { zones: acBandZones("orthoIncrease"), integer: true }),
        acBlock("HR drop by 1 min (peak − 1 min)", buckets, [{ values: dropVals, color: "#38bdf8", pointBands: BANDS.orthoRecovery }], { zones: acBandZones("orthoRecovery"), integer: true }),
        acBlock("HR after 1 min", buckets, [{ values: acAgg(buckets, (d) => acReadVals(d, "orthostatic", "hr1min")), color: "#a78bfa" }], { integer: true }),
        Object.keys(transitions).length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Transition types" }), acBars(Object.entries(transitions).map(([k, c]) => ({ name: k, count: c })).sort((a, b) => b.count - a.count), {})]) : null,
        potsN ? acInsight(`${potsN} event${potsN === 1 ? "" : "s"} reached a ≥30 bpm standing rise (the adult POTS-range threshold).`, "mod") : null,
      ]);
    }

    function acExtremeEvents() {
      const ev = [];
      Object.keys(state.days).forEach((dk) => {
        const d = state.days[dk];
        (d.symptoms || []).forEach((s) => {
          if (s.type === "highBp" && (parseFloat(s.sys) >= 140 || parseFloat(s.dia) >= 90)) ev.push({ dk, tag: "BP spike", color: SCORE_COLORS.concerning, body: `${s.sys || "?"}/${s.dia || "?"}${s.time ? " at " + fmtTime12(s.time) : ""}` });
          if (s.type === "labileHr" && parseFloat(s.hr) >= 120) ev.push({ dk, tag: "HR surge", color: "#f97316", body: `${s.hr} bpm${s.position ? " (" + s.position + ")" : ""}` });
          if (s.type === "sick") ev.push({ dk, tag: "Sick", color: "#a78bfa", body: "Illness logged" });
        });
        (d.readings || []).forEach((r) => {
          if (r.type === "ecg" && (r.svt || r.otherArrhythmia)) ev.push({ dk, tag: r.svt ? "SVT" : "Arrhythmia", color: SCORE_COLORS.concerning, body: "ECG rhythm abnormality" });
          if (r.type === "bp" && parseFloat(r.sys) >= 150) ev.push({ dk, tag: "High BP", color: SCORE_COLORS.bad, body: `${r.sys}/${r.dia || "?"}` });
        });
      });
      if (!ev.length) return null;
      ev.sort((a, b) => b.dk.localeCompare(a.dk));
      return acCard("Extreme Event Log", `${ev.length} notable event${ev.length === 1 ? "" : "s"}`, [

        ]))),
      ]);
    }

    function acSleep(buckets) {
      const dur = acAgg(buckets, (d, dk) => sleepHours(dk));
      if (!acPresent(dur).length) return null;
      const bed = acAgg(buckets, (d) => { const t = acToDec(d.sleep && d.sleep.bed); return t == null ? null : (t < 12 ? t + 24 : t); });
      const wake = acAgg(buckets, (d) => acToDec(d.sleep && d.sleep.wake));
      const interruptions = acAggSum(buckets, (d) => (d.sleep && d.sleep.quality === "interrupted") ? 1 : null);
      // scatter: sleep hours vs morning structured RMSSD
      const pts = [];
      Object.keys(state.days).forEach((dk) => { const h = sleepHours(dk); const rm = acReadVals(state.days[dk], "breathHrv", "rmssd", isMorning); if (h != null && rm.length) pts.push({ x: h, y: rm.reduce((s, v) => s + v, 0) / rm.length }); });
      return acCard("Sleep", acRangeLabel(), [
        acBlock("Duration (hours)", buckets, [{ values: dur, color: "#38bdf8" }], { target: { from: 7, to: 9, color: "#16a34a" } }),
        acBlock("Bedtime vs wake (24h clock)", buckets, [{ values: bed, color: "#a78bfa", label: "Bed" }, { values: wake, color: "#f97316", label: "Wake" }], {}),
        acBlock("Sleep low vs high HR", buckets, [
          { values: acAgg(buckets, (d) => (d.sleep && d.sleep.hrLow != null ? parseFloat(d.sleep.hrLow) : null)), color: "#38bdf8", label: "Low" },

        ], {}),

        acStats([
          { label: "Avg sleep", value: avgRound(dur, 1), sub: "h" },

        ]),

    function acActivity(buckets) {
      const mins = acAggSum(buckets, (d) => (d.activities || []).reduce((s, a) => s + (parseFloat(a.duration) || 0), 0) || null);
      const typeCounts = {}; let activeDays = 0, restDays = 0;
      buckets.forEach((b) => b.days.forEach((dk) => { const acts = state.days[dk].activities || []; if (acts.length) { activeDays++; acts.forEach((a) => { typeCounts[a.type] = (typeCounts[a.type] || 0) + 1; }); } else restDays++; }));
      const rows = Object.entries(typeCounts).map(([t, c]) => ({ name: ACTIVITY_TYPES[t] ? ACTIVITY_TYPES[t].label : t, count: c })).sort((a, b) => b.count - a.count);
      if (!rows.length) return null;

      // activity vs score
      let actScores = [], restScores = [];
      Object.keys(state.days).forEach((dk) => { const d = state.days[dk]; const sc = acDayScore(d, dk); if (sc == null) return; ((d.activities || []).length ? actScores : restScores).push(sc); });
      const am = actScores.length ? Math.round(actScores.reduce((s, x) => s + x, 0) / actScores.length) : null;
      const rm = restScores.length ? Math.round(restScores.reduce((s, x) => s + x, 0) / restScores.length) : null;
      return acCard("Activity", acRangeLabel(), [
        acBlock("Total exercise minutes", buckets, [{ values: mins, color: "var(--accent)" }], { integer: true }),
        el("div.ac-block", {}, [el("div.ac-block-label", { text: "Activity types" }), acBars(rows, {})]),

    function acExerciseProgression(buckets) {
      const blocks = [
        acBlock("Walking HR", buckets, [{ values: acAgg(buckets, (d) => (d.activities || []).filter((a) => a.type === "walk").map((a) => parseFloat(a.avgHr)).filter((v) => !isNaN(v))), color: "#16a34a" }], {}),
        acBlock("Cycling HR", buckets, [{ values: acAgg(buckets, (d) => (d.activities || []).filter((a) => a.type === "indoorBike").map((a) => parseFloat(a.avgHr)).filter((v) => !isNaN(v))), color: "var(--accent)" }], {}),
        acBlock("Recovery HR (60s rest)", buckets, [{ values: acAgg(buckets, (d) => (d.activities || []).map((a) => parseFloat(a.hr60)).filter((v) => !isNaN(v))), color: "#38bdf8" }], {}),
        acBlock("Peak interval HR", buckets, [{ values: acAgg(buckets, (d) => (d.activities || []).filter((a) => a.type === "indoorBike").flatMap((a) => (a.intervals || []).map((iv) => parseFloat(iv.maxHr)).concat([parseFloat(a.maxHr)])).filter((v) => !isNaN(v))), color: "#f97316" }], {}),
      ].filter(Boolean);
      if (!blocks.length) return null;
      return acCard("Exercise Progression", "Real-world cardiovascular function", blocks);
    }

    function acHydration(buckets) {
      const water = acAgg(buckets, (d) => (d.food && +d.food.water > 0 ? +d.food.water : null));
      if (!acPresent(water).length && !Object.keys(state.days).some((dk) => (state.days[dk].meds || []).some((m) => m.type === "liquidIv" || m.type === "lmnt"))) return null;
      const elec = acAggSum(buckets, (d) => (d.meds || []).filter((m) => m.type === "liquidIv" || m.type === "lmnt").length || null);
      return acCard("Hydration", acRangeLabel(), [
        acBlock("Water (L/day)", buckets, [{ values: water, color: "#38bdf8" }], { target: { from: 2.5, to: 3.5, color: "#16a34a" } }),
        acBlock("Electrolyte packets (Liquid IV / LMNT)", buckets, [{ values: elec, color: "#a78bfa" }], { integer: true }),
        acStats([{ label: "Avg water", value: avgRound(water, 1), sub: "L" }]),
      ]);
    }

    function acNutrition(buckets) {
      const cal = acAgg(buckets, (d) => { const t = (d.food && d.food.meals || []).reduce((s, m) => s + (parseInt(m.calories, 10) || 0), 0); return t > 0 ? t : null; });
      const lastMeal = acAgg(buckets, (d) => { const times = (d.food && d.food.meals || []).map((m) => acMinOf(m.time)).filter((v) => v != null); return times.length ? Math.max(...times) / 60 : null; });
      const trig = {}; let dinnerBy5 = 0;
      buckets.forEach((b) => b.days.forEach((dk) => { const f = state.days[dk].food; if (!f) return; Object.keys(f.triggers || {}).forEach((k) => { if (f.triggers[k] > 0 && TRIGGER_TYPES[k]) trig[k] = (trig[k] || 0) + f.triggers[k]; }); if ((f.meals || []).some((m) => m.type === "dinner" && m.time && m.time <= "17:00")) dinnerBy5++; }));
      const trigRows = Object.entries(trig).map(([k, c]) => ({ name: TRIGGER_TYPES[k].label, count: c })).sort((a, b) => b.count - a.count);
      if (!acPresent(cal).length && !trigRows.length) return null;
      return acCard("Calories & Nutrition", acRangeLabel(), [
        acBlock("Calories", buckets, [{ values: cal, color: "var(--accent)" }], { integer: true }),
        acBlock("Last meal time (24h)", buckets, [{ values: lastMeal, color: "#f97316" }], {}),
        trigRows.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Trigger foods" }), acBars(trigRows, {})]) : null,
        acStats([{ label: "Dinner by 5pm", value: dinnerBy5 || null, sub: "days" }]),
      ]);
    }

    function acBowel(buckets) {
      const has = Object.keys(state.days).some((dk) => (state.days[dk].digestion && (state.days[dk].digestion.movements || []).length));
      if (!has) return null;
      const freq = acAgg(buckets, (d) => (d.digestion && d.digestion.movements ? d.digestion.movements.length : null));
      let without = 0; buckets.forEach((b) => b.days.forEach((dk) => { const dg = state.days[dk].digestion; if (dg && (dg.movements || []).length === 0) without++; }));
      return acCard("Bowel Movements", acRangeLabel(), [
        acBlock("Movements per day", buckets, [{ values: freq, color: "#a78bfa" }], {}),
        acStats([{ label: "Days without", value: without || null }, { label: "Avg / day", value: avgRound(freq, 1) }]),
      ]);
    }

    function acMeds(buckets) {
      const counts = {}; let proto = 0; let anyMeds = false;
      buckets.forEach((b) => b.days.forEach((dk) => {
        const meds = state.days[dk].meds || []; if (meds.length) anyMeds = true;
        const taken = new Set(meds.map((m) => m.type)); taken.forEach((t) => { counts[t] = (counts[t] || 0) + 1; });
        if (taken.has("allegra") && taken.has("pepsidAc") && taken.has("magGlycinate")) proto++;
      }));
      if (!anyMeds) return null;
      const rows = Object.entries(counts).map(([t, c]) => ({ name: MED_TYPES[t] ? MED_TYPES[t].label : t, count: c })).sort((a, b) => b.count - a.count);
      return acCard("Medications & Supplements", "Days taken in range", [
        acBars(rows, { fmt: (c) => c + " d" }),
        acStats([{ label: "Core protocol days", value: proto || null, sub: "Allegra+Pepcid+Mag" }]),
      ]);
    }

    // Trigger-food counts over the last `days` days, as acBars rows.
    function triggerRows(days = 30) {
      const trig = {}; const end = new Date();
      for (let i = 0; i < days; i++) { const dk = keyOf(new Date(end.getFullYear(), end.getMonth(), end.getDate() - i)); const f = state.days[dk] && state.days[dk].food; if (f) Object.keys(f.triggers || {}).forEach((k) => { if (f.triggers[k] > 0 && TRIGGER_TYPES[k]) trig[k] = (trig[k] || 0) + f.triggers[k]; }); }
      return Object.entries(trig).map(([k, c]) => ({ name: TRIGGER_TYPES[k].label, count: c })).sort((a, b) => b.count - a.count);
    }

    function acCleanDays() {
      const today = keyOf(new Date());
      const info = streakInfo(today);
      const tier = streakTier(info.current);
      // Trigger foods moved to Streak Analytics; Clean Days is streak-only now.
      return acCard("Clean Days", "Protocol streak tracking", [
        el("div.ac-streak-big", {}, [el("div.ac-streak-num", { text: String(info.current) }), el("div.ac-streak-cap", { text: info.current === 1 ? "day clean" : "days clean" }), el("div.ac-streak-tier", { text: tier.tier })]),
        acStats([{ label: "Longest streak", value: info.longest, sub: "days" }, { label: "30-day clean rate", value: info.rate, sub: info.rate != null ? "%" : "" }]),
      ]);
    }

    function acStreakAnalytics() {
      const keys = Object.keys(state.days).sort(); if (keys.length < 3) return null;
      const runs = []; let run = 0; const breaks = {}; const breakDow = [0, 0, 0, 0, 0, 0, 0]; let anyBreak = false;
      const start = dateFromKey(keys[0]), end = dateFromKey(keys[keys.length - 1]);
      for (let cd = new Date(start); cd <= end; cd.setDate(cd.getDate() + 1)) {
        const dk = keyOf(cd), c = dayCleanliness(dk);
        if (c && c.clean) { run++; }
        else { if (run > 0) runs.push(run); run = 0; if (c) { anyBreak = true; breakDow[cd.getDay()]++; c.criteria.filter((cr) => !cr.pending && !cr.pass).forEach((cr) => { breaks[cr.label] = (breaks[cr.label] || 0) + 1; }); } }
      }
      if (run > 0) runs.push(run);
      const trigRows = triggerRows(30);
      if (!runs.length && !anyBreak && !trigRows.length) return null;
      const buckets = { "1–2": 0, "3–6": 0, "7–13": 0, "14+": 0 };
      runs.forEach((r) => { buckets[r <= 2 ? "1–2" : r <= 6 ? "3–6" : r <= 13 ? "7–13" : "14+"]++; });
      const histRows = Object.entries(buckets).filter(([, c]) => c).map(([k, c]) => ({ name: k + " days", count: c }));
      const breakRows = Object.entries(breaks).map(([k, c]) => ({ name: k, count: c })).sort((a, b) => b.count - a.count);
      const names = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      const dowRows = names.map((nm, i) => breakDow[i] ? { name: nm, count: breakDow[i] } : null).filter(Boolean);
      return acCard("Streak Analytics", "What sustains and breaks streaks", [
        histRows.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Streak length distribution" }), acBars(histRows, {})]) : null,
        breakRows.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Most common reasons streaks break" }), acBars(breakRows, {})]) : null,
        dowRows.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Day-of-week streaks break" }), acBars(dowRows, {})]) : null,
        trigRows.length ? el("div.ac-block", {}, [el("div.ac-block-label", { text: "Trigger foods" }), acBars(trigRows, {})]) : null,
      ]);
    }

    function acAdherence(buckets) {
      const keyLabels = { triggers: "No triggers", water: "Water", dinner: "Dinner by 5pm", meds: "Meds", sleep: "Sleep 7h+" };
      const combined = buckets.map((b) => {
        let sum = 0, n = 0;
        b.days.forEach((dk) => { const c = dayCleanliness(dk); if (!c) return; const crit = c.criteria.filter((x) => !x.pending); if (!crit.length) return; sum += crit.filter((x) => x.pass).length / crit.length * 100; n++; });
        return n ? sum / n : null;
      });
      if (!acPresent(combined).length) return null;
      const per = {}; const tot = {};
      buckets.forEach((b) => b.days.forEach((dk) => { const c = dayCleanliness(dk); if (!c) return; c.criteria.forEach((cr) => { if (cr.pending) return; tot[cr.key] = (tot[cr.key] || 0) + 1; if (cr.pass) per[cr.key] = (per[cr.key] || 0) + 1; }); }));
      const stats = Object.keys(keyLabels).filter((k) => tot[k]).map((k) => ({ label: keyLabels[k], value: Math.round((per[k] || 0) / tot[k] * 100), sub: "%" }));
      return acCard("Protocol Adherence", acRangeLabel(), [
        acBlock("Combined adherence (%)", buckets, [{ values: combined, color: "#16a34a" }], { integer: true, target: { from: 80, to: 100, color: "#16a34a" } }),
        acStats(stats),
      ]);
    }

    function acTriggerImpact() {
      // baseline structured RMSSD across all days
      const rmByDay = {}; const all = [];
      Object.keys(state.days).forEach((dk) => { const v = acReadVals(state.days[dk], "breathHrv", "rmssd"); if (v.length) { rmByDay[dk] = v.reduce((s, x) => s + x, 0) / v.length; all.push(rmByDay[dk]); } });
      if (all.length < 5) return null;
      const baseline = all.reduce((s, x) => s + x, 0) / all.length;
      const rows = [];
      Object.keys(TRIGGER_TYPES).forEach((t) => {
        const days = Object.keys(state.days).filter((dk) => { const f = state.days[dk].food; return f && f.triggers && f.triggers[t] > 0; });
        if (!days.length) return;
        // HRV cost: mean RMSSD on trigger day + next day vs baseline
        const costs = []; let recoverySum = 0, recoveryN = 0;
        days.forEach((dk) => {
          const d0 = dateFromKey(dk);
          const samples = [];
          for (let k = 0; k <= 1; k++) { const ndk = keyOf(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + k)); if (rmByDay[ndk] != null) samples.push(rmByDay[ndk]); }
          if (samples.length) costs.push(samples.reduce((s, x) => s + x, 0) / samples.length - baseline);
          // recovery: days until RMSSD >= baseline again
          for (let k = 1; k <= 5; k++) { const ndk = keyOf(new Date(d0.getFullYear(), d0.getMonth(), d0.getDate() + k)); if (rmByDay[ndk] != null) { if (rmByDay[ndk] >= baseline) { recoverySum += k; recoveryN++; break; } if (k === 5) { recoverySum += 5; recoveryN++; } } }
        });
        const cost = costs.length ? costs.reduce((s, x) => s + x, 0) / costs.length : null;
        rows.push({ name: TRIGGER_TYPES[t].label, freq: days.length, cost, recovery: recoveryN ? recoverySum / recoveryN : null });
      });
      if (!rows.length) return null;
      rows.sort((a, b) => (a.cost == null ? 1 : b.cost == null ? -1 : a.cost - b.cost));
      const table = el("table.ac-table", {}, [
        el("thead", {}, [el("tr", {}, [el("th", { text: "Trigger" }), el("th", { text: "Times" }), el("th", { text: "RMSSD cost" }), el("th", { text: "Recovery" })])]),
        el("tbody", {}, rows.map((r) => el("tr", {}, [
          el("td", { text: r.name }),
          el("td", { text: String(r.freq) }),
          el("td", { text: r.cost == null ? "–" : (r.cost <= 0 ? "" : "+") + fmtNum(Math.round(r.cost * 10) / 10), style: r.cost != null && r.cost < 0 ? `color:${SCORE_COLORS.bad}` : "" }),
          el("td", { text: r.recovery == null ? "–" : `${fmtNum(Math.round(r.recovery * 10) / 10)} d` }),
        ]))),

    function acCorrelations() {

    // per-day metric table for correlations
    function acDailyMetrics() {

        const d = state.days[dk];

          coherence: avg("breathHrv", "coherence"),
          lfPeak: avg("breathHrv", "lfPeak"),
          readiness: avg("hrv", "readiness"),
          restHr: avg("restingHr", "hr", (r) => (r.position || "") === "Laying"),
          sys: avg("bp", "sys"),
          sleepH: sleepHours(dk),
          water: d.food && +d.food.water > 0 ? +d.food.water : null,
          calories: meals.reduce((s, m) => s + (parseInt(m.calories, 10) || 0), 0) || null,
          triggers: d.food && d.food.triggers ? Object.values(d.food.triggers).reduce((s, c) => s + (c > 0 ? c : 0), 0) : 0,

    function acPearson(pairs) {

    // ----- small shared widgets -----
    const avgRound = (vals, dp) => { const m = acMean(vals); if (m == null) return null; const f = Math.pow(10, dp || 0); return Math.round(m * f) / f; };

    function acScatter(points, opts) {

      points.forEach((p) => svg.appendChild(mk("circle", { cx: xAt(p.x), cy: yAt(p.y), r: 3, fill: "var(--accent)", opacity: 0.7 })));

    // ===== Recovery / interventions / subjective / milestones =====

    // Illness episodes from the "sick" symptom: first sick day = start, runs while

    const MOOD_LEVELS = { "Feeling amazing": 4, "Feeling normal": 3, "Feeling bad": 2, "Feeling like a crash": 1 };

    const msFirst = (md, fn) => { for (const dk of md.keys) if (fn(md.map[dk])) return dk; return null; };

      return null;
    }
    function msRollAvg(md, valFn, window, thr, dir) {
      for (const dk of md.keys) { const end = dateFromKey(dk), vals = []; for (let i = 0; i < window; i++) { const d = new Date(end); d.setDate(end.getDate() - i); const day = md.map[keyOf(d)]; if (day) { const v = valFn(day); if (v != null && !isNaN(v)) vals.push(v); } } if (vals.length >= Math.ceil(window * 0.5)) { const a = vals.reduce((s, x) => s + x, 0) / vals.length; if (dir === "down" ? a <= thr : a >= thr) return dk; } }
      return null;
    }
    function msNoneIn(md, window, badFn, minPts) {
      for (const dk of md.keys) { const end = dateFromKey(dk); let pts = 0, bad = false; for (let i = 0; i < window; i++) { const d = new Date(end); d.setDate(end.getDate() - i); const day = md.map[keyOf(d)]; if (day) { pts++; if (badFn(day)) { bad = true; break; } } } if (!bad && pts >= (minPts || Math.ceil(window * 0.6))) return dk; }
      return null;
    }
    function msWindowCount(md, window, fn, thr) {
      for (const dk of md.keys) { const end = dateFromKey(dk); let c = 0; for (let i = 0; i < window; i++) { const d = new Date(end); d.setDate(end.getDate() - i); const day = md.map[keyOf(d)]; if (day) c += fn(day) || 0; } if (c >= thr) return dk; }
      return null;
    }
    function msCleanRate(md, pct) {
      for (const dk of md.keys) { const end = dateFromKey(dk); let c = 0, t = 0; for (let i = 0; i < 30; i++) { const d = new Date(end); d.setDate(end.getDate() - i); const day = md.map[keyOf(d)]; if (day) { t++; if (day.clean) c++; } } if (t >= 15 && c / t * 100 >= pct) return dk; }
      return null;
    }
    function msFullRecovery(md) {
      for (const dk of md.keys) { const end = dateFromKey(dk); const rs = []; let crash = false, cleanN = 0, tot = 0; for (let i = 0; i < 30; i++) { const d = new Date(end); d.setDate(end.getDate() - i); const day = md.map[keyOf(d)]; if (day) { tot++; if (day.clean) cleanN++; if (day.rmssd != null) rs.push(day.rmssd); if (day.score != null && day.score < 25) crash = true; } } if (tot >= 20 && rs.length >= 10) { const avg = rs.reduce((s, x) => s + x, 0) / rs.length; if (avg >= 30 && !crash && cleanN / tot * 100 >= 80) return dk; } }
      return null;
    }

    function buildMilestoneGroups(md) {
      const first = (p) => () => msFirst(md, p), consec = (p, n) => () => msConsec(md, p, n);
      // Like `first`, but also surfaces the metric value on the achievement day.

      const defs = [

          ["7 consecutive days RMSSD 30+", consec((d) => d.rmssd != null && d.rmssd >= 30, 7)],

          ["7 consecutive days pNN50 7%+", consec((d) => d.pnn50 != null && d.pnn50 >= 7, 7)],

        ]],

          ["First Total Power 3500+", firstV("totalPower", (d) => d.totalPower != null && d.totalPower >= 3500)],
          ["First Total Power 5000+", firstV("totalPower", (d) => d.totalPower != null && d.totalPower >= 5000)],
          ["7 consecutive days Total Power 3000+", consec((d) => d.totalPower != null && d.totalPower >= 3000, 7)],
          ["First VLF under 300 (low stress)", firstV("vlf", (d) => d.vlf != null && d.vlf < 300)],
          ["First VLF under 200 (excellent)", firstV("vlf", (d) => d.vlf != null && d.vlf < 200)],

          ["First LF peak at 0.090 Hz (target entry)", firstV("lfPeak", (d) => d.lfPeak != null && d.lfPeak >= 0.090)],

          ["7 consecutive days BP under 130/85", consec((d) => d.bpGood === true, 7)],
          ["No high-BP events in 30 days", () => msNoneIn(md, 30, (d) => d.highBpEvent)],
          ["30-day average BP 110–120 / 70–80", () => { for (const dk of md.keys) { const end = dateFromKey(dk), vs = [], vd = []; for (let i = 0; i < 30; i++) { const dd = new Date(end); dd.setDate(end.getDate() - i); const day = md.map[keyOf(dd)]; if (day) { if (day.sys != null) vs.push(day.sys); if (day.dia != null) vd.push(day.dia); } } if (vs.length >= 10) { const as = vs.reduce((s, x) => s + x, 0) / vs.length, ad = vd.length ? vd.reduce((s, x) => s + x, 0) / vd.length : null; if (as >= 110 && as <= 120 && (ad == null || (ad >= 70 && ad <= 80))) return dk; } } return null; }],
        ]],
