    // Colored "hero" header tinted by the rating, with a solid rating chip.
    function heroCard(o) {
      const color = SCORE_COLORS[o.cat] || "#9aa0a6";
      const hero = el("div.sum-hero");
      hero.style.background = hexA(color, 0.15);
      hero.style.borderColor = hexA(color, 0.45);
      if (o.cat) { const rt = el("span.sum-hero-rating", { text: GRADE_LABEL[o.cat] || "" }); rt.style.background = color; hero.appendChild(rt); }
      if (o.label) hero.appendChild(el("div.sum-hero-label", { text: o.label }));
      hero.appendChild(el("div.sum-hero-score", {}, [
        el("span.sum-hero-num", { text: o.big != null && o.big !== "" ? String(o.big) : "-" }),
        o.den ? el("span.sum-hero-den", { text: o.den }) : null,
      ]));
      if (o.sub) hero.appendChild(el("div.sum-hero-sub", { text: o.sub }));
      if (o.tip) hero.appendChild(el("div.sum-hero-tip", { text: o.tip }));
      return hero;
    }

    function openReadingSummary(r) {
      const def = READING_TYPES[r.type];
      openModal((body) => {
        body.appendChild(el("h2", { text: def.label }));
        body.appendChild(el("div.sum-meta", { text: r.time ? fmtTime12(r.time) : "" }));
        if (r.type === "breathHrv") breathingSummary(r, body);
        else if (r.type === "bp") bpSummary(r, body);
        else if (r.type === "ecg") ecgSummary(r, body);
        else if (r.type === "restingHr") restingHrSummary(r, body);
        else if (r.type === "bloodO2") bloodO2Summary(r, body);
        else if (r.type === "hrv") unstructuredHrvSummary(r, body);
        else genericReadingSummary(r, body);
      }, { action: { icon: ICONS.edit, label: "Edit", onclick: () => readingForm(r.type, r) } });
    }

    function genericReadingSummary(r, body) {
      const def = READING_TYPES[r.type];
      const s = computeScores(r);
      const rv = readingRowValue(r);
      body.appendChild(heroCard({ cat: rowScoreCategory(r), big: typeof rv === "string" ? rv : "", label: "Result" }));
      const card = sumCard("Details");
      entryFields(def).forEach((f) => {
        if (isDivider(f) || f.type === "time") return;
        if (f.type === "check") { card.appendChild(metricRow(f.label, r[f.key] ? "Yes" : "No", r[f.key] ? (f.key === "sinus" ? "great" : "bad") : null)); return; }
        if (f.type === "textarea") {
          if (r[f.key]) card.appendChild(el("div.metric-card", {}, [el("div.metric-name", { text: f.label }), el("div.sum-text", { text: r[f.key] })]));
          return;
        }
        const v = r[f.key];
        if (v == null || v === "") return;
        const spark = buildSpark(metricHistory(r.type, numEx(f.key)), bandsFor(r.type, f.key));
        card.appendChild(metricRow(f.label, v + (f.unit ? ` ${f.unit}` : ""), s[f.key], null, spark));
      });
      body.appendChild(card);
    }

    const HRV_EXPLAIN = {
      rmssd: "Beat-to-beat parasympathetic activity - your most reliable vagal-tone indicator.",
      pnn50: "Percent of successive beats differing by 50ms+. Sensitive parasympathetic depth.",
      sdnn: "Overall heart-rate variability. Reflects total autonomic activity.",
      hr: "Beats per minute during the reading. Lower usually means more vagal dominance.",
      meanRr: "Average milliseconds between beats (inverse of HR).",
      mxdmn: "Longest minus shortest RR interval - the range of variability.",
      mode: "Most common RR interval - a stability indicator.",
      amo50: "Stress-index marker. Higher suggests sympathetic dominance.",
      cv: "Relative variability. Higher is generally better.",
      coherence: "Synchronization of heart rhythm with breathing - reflects vagal training.",
    };
    const CAT_POINTS = { great: 90, good: 75, ok: 55, bad: 38, crash: 18, concerning: 18, warning: 72 };

    function breathingSummary(r, body) {
      const s = computeScores(r);
      const n = (k) => { const x = parseFloat(r[k]); return isNaN(x) ? null : x; };
      const vlf = n("vlowPower"), lf = n("lowPower"), hf = n("highPower");
      const total = [vlf, lf, hf].some((v) => v != null) ? [vlf, lf, hf].reduce((a, b) => a + (b || 0), 0) : null;
      const lfhf = lf != null && hf ? lf / hf : null;
      const sp = (ex, bands) => buildSpark(metricHistory("breathHrv", ex, 15), bands);
      const lfhfEx = (rr) => { const a = parseFloat(rr.lowPower), b = parseFloat(rr.highPower); return (!isNaN(a) && !isNaN(b) && b !== 0) ? a / b : null; };

      // Hero: autonomic composite colored by overall rating
      const overall = worstCat([s.rmssd, s.pnn50, s.totalPower].filter(Boolean));
      const verdict = {
        great: "Strong parasympathetic reserves today. Fine for your normal protocol or intervals.",
        good: "Solid recovery state. Easy to normal activity is reasonable.",
        ok: "Moderate reserves. Keep it easy and avoid pushing.",
        bad: "Low reserves. Favor rest and gentle activity today.",
        crash: "Very low reserves. Prioritize rest and recovery.",
      };
      const weights = { rmssd: 25, pnn50: 15, totalPower: 15, lfPeak: 20, hfPeak: 15, lfhf: 10 };
      let sum = 0, wsum = 0;
      Object.keys(weights).forEach((k) => { const c = s[k]; if (c && CAT_POINTS[c] != null) { sum += CAT_POINTS[c] * weights[k]; wsum += weights[k]; } });
      body.appendChild(heroCard({
        cat: overall,
        label: "Autonomic score",
        big: wsum ? Math.round(sum / wsum) : "-",
        den: wsum ? "/100" : "",
        sub: "Composite of vagal tone, power, and baroreflex position.",
        tip: verdict[overall] || "",
      }));

      // Details
      const bq = sumCard("Details");
      bq.appendChild(metricRow("Coherence", r.coherence, false, HRV_EXPLAIN.coherence));
      if (r.style) bq.appendChild(metricRow("Breathing style", r.style, false, "Intended pace for this reading."));
      if (r.period) bq.appendChild(metricRow("Reading type", r.period, false));
      bq.appendChild(metricRow("Swallowing", r.swallowing ? "Yes" : "No", false));
      body.appendChild(bq);

      // Power (frequency peaks folded in, below HF power)
      const pc = sumCard("Power");
      if (total) {
        const pct = (x) => Math.round(((x || 0) / total) * 100);
        const bar = el("div.powerbar");
        const seg = (v, color, lab) => { if (v == null) return; const p = pct(v); const d = el("div", { style: `width:${p}%;background:${color}` }); if (p >= 12) d.textContent = `${lab} ${p}%`; bar.appendChild(d); };
        seg(vlf, "#f59e0b", "VLF"); seg(lf, "#6366f1", "LF"); seg(hf, "#22c55e", "HF");
        pc.appendChild(el("div.metric-card", {}, [bar, el("div.sum-legend", { text: `VLF ${pct(vlf)}% · LF ${pct(lf)}% · HF ${pct(hf)}%` })]));
      }
      pc.appendChild(metricRow("Total power", total != null ? Math.round(total) : "", s.totalPower, "Total autonomic engagement across all frequencies.", sp((rr) => totalPower(rr), BANDS.totalPower)));
      pc.appendChild(metricRow("LF/HF ratio", lfhf != null ? lfhf.toFixed(2) : "", s.lfhf, "Sympathetic vs vagal balance. Balanced or low favors flexibility.", sp(lfhfEx, BANDS.lfhf)));
      pc.appendChild(metricRow("VLF power", r.vlowPower, s.vlf, "Slow regulatory processes and stress load. Elevated means system stress.", sp(numEx("vlowPower"), BANDS.vlf)));
      pc.appendChild(metricRow("LF power", r.lowPower, null, "Baroreflex band, your training target.", sp(numEx("lowPower"), null)));
      pc.appendChild(metricRow("HF power", r.highPower, null, "Vagal activity tied to breathing. Higher means better recovery state.", sp(numEx("highPower"), null)));
      pc.appendChild(metricRow("LF peak", r.lfPeak ? r.lfPeak + " Hz" : "", s.lfPeak,
        "Baroreflex frequency. Target 0.08 to 0.10 Hz; shifting toward it is progress.", sp(numEx("lfPeak"), BANDS.lfPeak)));
      const e = expectedHf(r.style);
      pc.appendChild(metricRow("HF peak", r.hfPeak ? r.hfPeak + " Hz" : "", s.hfPeak,
        e ? `Expected about ${e[0]} to ${e[1]} Hz for ${r.style} breathing; large deviation means the pace drifted.` : "Respiratory peak position.", sp(numEx("hfPeak"), null)));
      body.appendChild(pc);

      // Metrics
      const mc = sumCard("Metrics");
      mc.appendChild(metricRow("RMSSD", r.rmssd, s.rmssd, HRV_EXPLAIN.rmssd, sp(numEx("rmssd"), BANDS.rmssdS)));
      mc.appendChild(metricRow("pNN50", r.pnn50 ? r.pnn50 + "%" : "", s.pnn50, HRV_EXPLAIN.pnn50, sp(numEx("pnn50"), BANDS.pnn50)));
      mc.appendChild(metricRow("SDNN", r.sdnn, s.sdnn, HRV_EXPLAIN.sdnn, sp(numEx("sdnn"), BANDS.sdnn)));
      mc.appendChild(metricRow("HR", r.hr, s.hr, HRV_EXPLAIN.hr, sp(numEx("hr"), BANDS.hrBreath)));
      mc.appendChild(metricRow("Mean RR", r.meanRr, s.meanRr, HRV_EXPLAIN.meanRr, sp(numEx("meanRr"), BANDS.rrMode)));
      mc.appendChild(metricRow("MxDMn", r.mxdmn, s.mxdmn, HRV_EXPLAIN.mxdmn, sp(numEx("mxdmn"), BANDS.mxdmn)));
      mc.appendChild(metricRow("Mode", r.mode, s.mode, HRV_EXPLAIN.mode, sp(numEx("mode"), BANDS.rrMode)));
      mc.appendChild(metricRow("AMo50", r.amo50, s.amo50, HRV_EXPLAIN.amo50, sp(numEx("amo50"), BANDS.amo50)));
      mc.appendChild(metricRow("CV", r.cv, s.cv, HRV_EXPLAIN.cv, sp(numEx("cv"), BANDS.cv)));
      body.appendChild(mc);

      if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); body.appendChild(nc); }
    }

    // Derived blood-pressure metrics (from systolic, diastolic, pulse).
    const bpMap = (rr) => { const s = +rr.sys, d = +rr.dia; return (!isNaN(s) && !isNaN(d)) ? (s + 2 * d) / 3 : null; };
    const bpPP = (rr) => { const s = +rr.sys, d = +rr.dia; return (!isNaN(s) && !isNaN(d)) ? s - d : null; };
    const bpKerdo = (rr) => { const d = +rr.dia, p = +rr.pulse; return (!isNaN(d) && !isNaN(p) && p) ? (1 - d / p) * 100 : null; };
    const bpRobinson = (rr) => { const s = +rr.sys, p = +rr.pulse; return (!isNaN(s) && !isNaN(p)) ? (s * p) / 100 : null; };
    const bpKvas = (rr) => { const s = +rr.sys, d = +rr.dia, p = +rr.pulse; const pp = s - d; return (!isNaN(p) && pp > 0) ? (10 * p) / pp : null; };
    const bpBce = (rr) => { const s = +rr.sys, d = +rr.dia, p = +rr.pulse; return (!isNaN(s) && !isNaN(d) && !isNaN(p)) ? (s - d) * p : null; };

    function bpSummary(r, body) {
      const s = computeScores(r);
      const cat = rowScoreCategory(r);
      const verdict = {
        great: "Pressure is in a healthy range.",
        good: "Pressure is reasonable today.",
        ok: "Slightly outside your ideal range; keep an eye on it.",
        bad: "Out of range; note context like salt, fluids, meds, or stress.",
        concerning: "Well outside range; consider rechecking and noting context.",
      };
      body.appendChild(heroCard({
        cat, label: "Blood pressure",
        big: r.sys || r.dia ? `${r.sys || "-"}/${r.dia || "-"}` : "",
        sub: "Systolic / diastolic", tip: verdict[cat] || "",
      }));

      // value + grade + spark for a derived metric
      const stat = (label, ex, bands, explain) => {
        const v = ex(r);
        const c = (v != null && bands) ? catFromBands(v, bands) : null;
        return metricRow(label, v != null ? fmtNum(v) : "", c, explain, buildSpark(metricHistory("bp", ex), bands));
      };

      const det = sumCard("Details");
      det.appendChild(metricRow("Systolic", r.sys, s.sys, "Peak arterial pressure during a heartbeat.", buildSpark(metricHistory("bp", numEx("sys")), BANDS.sys)));
      det.appendChild(metricRow("Diastolic", r.dia, s.dia, "Arterial pressure between beats.", buildSpark(metricHistory("bp", numEx("dia")), BANDS.dia)));
      det.appendChild(metricRow("Pulse", r.pulse, false, "Heart rate at the time of the reading.", buildSpark(metricHistory("bp", numEx("pulse")), null)));
      if (r.period) det.appendChild(metricRow("Reading type", r.period, false));
      body.appendChild(det);

      const ps = sumCard("Pressure statistics");
      ps.appendChild(stat("Mean arterial pressure", bpMap, BANDS.map, "Average pressure perfusing your organs and brain. Low MAP drives lightheadedness and poor cerebral perfusion in dysautonomia; very high strains the system."));
      ps.appendChild(stat("Pulse pressure", bpPP, BANDS.pp, "Gap between systolic and diastolic. Low (under 30) suggests low stroke volume or dehydration; high (over 60) suggests arterial stiffness."));
      body.appendChild(ps);

      const ix = sumCard("Indexes");
      ix.appendChild(stat("Kerdo index", bpKerdo, BANDS.kerdo, "Autonomic balance from pulse and diastolic. Positive means sympathetic dominance, negative means parasympathetic; near zero is balanced."));
      ix.appendChild(stat("Robinson index", bpRobinson, BANDS.robinson, "Double product (systolic x pulse / 100): myocardial oxygen demand and cardiac workload at rest. Lower is more efficient."));
      ix.appendChild(stat("BCE index", bpBce, BANDS.bce, "Blood-circulation economy (pulse pressure x pulse). Higher values mean a less economical, more strained circulation."));
      ix.appendChild(stat("Kvas coefficient", bpKvas, BANDS.kvas, "Coefficient of endurance (10 x pulse / pulse pressure). Around 16 is typical; higher suggests cardiovascular fatigue, lower suggests stronger conditioning."));
      body.appendChild(ix);

      if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); body.appendChild(nc); }
    }

    function ecgSummary(r, body) {
      const s = computeScores(r);
      const verdict = {
        great: "Clean reading - normal intervals and rhythm.",
        good: "Largely normal intervals and rhythm.",
        ok: "Minor findings worth monitoring.",
        bad: "Abnormal findings; review context.",
        concerning: "Significant findings; consider clinical follow-up.",
      };
      body.appendChild(heroCard({ cat: s.overall, label: "ECG", big: ecgPattern(r), sub: "Rhythm", tip: verdict[s.overall] || "" }));

      const spk = (key, bands) => buildSpark(metricHistory("ecg", numEx(key)), bands);

      // Rhythm (its own container)
      const rhy = sumCard("Rhythm");
      rhy.appendChild(metricRow("Pattern", ecgPattern(r), s.rhythm, "Recorded rhythm. Sinus is normal; SVT or any other pattern is flagged."));
      rhy.appendChild(metricRow("Ectopic beats", r.ectopic, s.ectopic, "Extra beats in the reading. A few are common; many, or runs, are concerning.", spk("ectopic", BANDS.ectopic)));
      body.appendChild(rhy);

      // Intervals (its own container)
      const iv = sumCard("Intervals");
      iv.appendChild(metricRow("QRS", r.qrs, s.qrs, "Ventricular depolarization time. A wide QRS can indicate a conduction delay.", spk("qrs", BANDS.qrs)));
      iv.appendChild(metricRow("QTc", r.qtc, s.qtc, "Heart-rate-corrected QT. Prolongation raises arrhythmia risk; very short is also abnormal.", spk("qtc", qtcBands(state.profile && state.profile.sex))));
      iv.appendChild(metricRow("PR", r.pr, s.pr, "AV conduction time from atria to ventricles.", spk("pr", BANDS.pr)));
      body.appendChild(iv);

      // Rate & variability
      const rate = sumCard("Rate & variability");
      const hrCat = r.hr !== "" && r.hr != null ? catFromBands(+r.hr, BANDS.hrBreath) : null;
      rate.appendChild(metricRow("HR", r.hr, hrCat, "Heart rate during the ECG.", spk("hr", BANDS.hrBreath)));
      rate.appendChild(metricRow("HRV", r.hrv, s.hrv, "Heart-rate variability captured by the ECG (SDNN-style).", spk("hrv", BANDS.ecgHrv)));
      body.appendChild(rate);

      if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); body.appendChild(nc); }
      if (r.techReview) { const tc = sumCard("Technician review"); tc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.techReview })])); body.appendChild(tc); }
    }

    const notesCard = (r, b) => { if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); b.appendChild(nc); } };

    function restingHrSummary(r, body) {
      const cat = rowScoreCategory(r);
      const verdict = {
        great: "Resting heart rate is in a strong range.", good: "Resting heart rate is healthy.",
        ok: "Slightly elevated for rest.", bad: "Elevated resting heart rate; note context.",
        concerning: "High resting heart rate; consider rechecking and context.",
      };
      body.appendChild(heroCard({ cat, label: "Resting heart rate", big: r.hr || "", den: "bpm", sub: r.position || "", tip: verdict[cat] || "" }));
      const band = restingHrBands(r.position);
      const c = sumCard("Heart rate");
      const hrCat = (r.hr !== "" && r.hr != null) ? catFromBands(+r.hr, band) : null;
      c.appendChild(metricRow("HR", r.hr, hrCat, `Resting heart rate (${(r.position || "laying").toLowerCase()}). Lower generally reflects stronger parasympathetic tone.`, buildSpark(metricHistory("restingHr", numEx("hr")), band)));
      c.appendChild(metricRow("Position", r.position, false, "Body position during the reading; thresholds differ for laying vs sitting."));
      body.appendChild(c);
      notesCard(r, body);
    }

    function bloodO2Summary(r, body) {
      const s = computeScores(r);
      const cat = rowScoreCategory(r);
      const verdict = {
        great: "Oxygen saturation is excellent.", good: "Oxygen saturation is good.",
        ok: "Oxygen saturation is borderline.", bad: "Low oxygen saturation; recheck.",
        concerning: "Low oxygen saturation; recheck and note context.",
      };
      body.appendChild(heroCard({ cat, label: "Blood oxygen", big: r.value ? r.value + "%" : "", sub: "SpO2", tip: verdict[cat] || "" }));
      const ox = sumCard("Oxygenation");
      ox.appendChild(metricRow("Blood oxygen", r.value ? r.value + "%" : "", s.value, "Percent of hemoglobin carrying oxygen. Use the left hand; the right can read low from peripheral vasoconstriction.", buildSpark(metricHistory("bloodO2", numEx("value")), BANDS.spo2)));
      body.appendChild(ox);
      const sq = sumCard("Signal quality");
      const piCat = (r.perfusion !== "" && r.perfusion != null) ? catFromBands(+r.perfusion, BANDS.perfusion) : null;
      sq.appendChild(metricRow("Perfusion index", r.perfusion, piCat, "Signal strength of the reading. 5+ trust it, 2-4 moderate confidence, under 2 is unreliable (try another finger or hand).", buildSpark(metricHistory("bloodO2", numEx("perfusion")), BANDS.perfusion)));
      sq.appendChild(metricRow("Pulse", r.pulse, false, "Heart rate at the time of the reading.", buildSpark(metricHistory("bloodO2", numEx("pulse")), null)));
      body.appendChild(sq);
      notesCard(r, body);
    }

    function unstructuredHrvSummary(r, body) {
      const s = computeScores(r);
      const cat = rowScoreCategory(r);
      const verdict = {
        great: "Strong readiness today.", good: "Good readiness.", ok: "Moderate readiness; keep it easy.",
        bad: "Low readiness; favor rest.", crash: "Very low readiness; prioritize rest.",
        warning: "Readiness is unusually high (blue zone), which can signal fragility. Do less, not more.",
      };
      body.appendChild(heroCard({ cat, label: "Readiness", big: r.readiness ? r.readiness + "%" : "", sub: "Recovery readiness", tip: verdict[cat] || "" }));
      const sp = (k, bands) => buildSpark(metricHistory("hrv", numEx(k)), bands);

      const rc = sumCard("Readiness");
      rc.appendChild(metricRow("Readiness", r.readiness ? r.readiness + "%" : "", s.readiness, "Device recovery readiness. 70-85% is ideal; 86%+ can paradoxically signal fragility.", sp("readiness", BANDS.readiness)));
      body.appendChild(rc);

      const ab = sumCard("Autonomic balance");
      ab.appendChild(metricRow("PNS index", r.pns, s.pns, "Parasympathetic (rest and recovery) activity. Higher means more vagal dominance.", sp("pns", BANDS.pns)));
      ab.appendChild(metricRow("SNS index", r.sns, s.sns, "Sympathetic (activation and stress) activity. Lower is calmer.", sp("sns", BANDS.sns)));
      ab.appendChild(metricRow("Stress index", r.stressIndex, s.stressIndex, "Baevsky stress index. Higher means more sympathetic strain and rigidity.", sp("stressIndex", BANDS.stressIndex)));
      body.appendChild(ab);

      const va = sumCard("Variability");
      va.appendChild(metricRow("RMSSD", r.rmssd, s.rmssd, HRV_EXPLAIN.rmssd, sp("rmssd", BANDS.rmssdU)));
      va.appendChild(metricRow("SDNN", r.sdnn, s.sdnn, HRV_EXPLAIN.sdnn, sp("sdnn", BANDS.sdnn)));
      va.appendChild(metricRow("Avg HR", r.avgHr, s.avgHr, "Average heart rate during the reading. Lower usually reflects more vagal tone.", sp("avgHr", BANDS.hrBreath)));
      body.appendChild(va);

      const pw = sumCard("Power");
      pw.appendChild(metricRow("Low power", r.lowPower, false, "Low-frequency power (baroreflex and sympathovagal activity).", sp("lowPower", null)));
      pw.appendChild(metricRow("High power", r.highPower, false, "High-frequency power (vagal, tied to breathing).", sp("highPower", null)));
      const lfhfEx = (rr) => { const a = +rr.lowPower, b = +rr.highPower; return (!isNaN(a) && !isNaN(b) && b) ? a / b : null; };
      const lfhfV = lfhfEx(r);
      pw.appendChild(metricRow("LF/HF ratio", lfhfV != null ? fmtNum(lfhfV) : "", s.lfhf, "Sympathetic vs vagal balance. Balanced or low favors flexibility.", buildSpark(metricHistory("hrv", lfhfEx), BANDS.lfhf)));
      body.appendChild(pw);

      const det = sumCard("Details");
      det.appendChild(metricRow("Physiological age", r.age, false, "Device-estimated physiological age (not your actual age)."));
      det.appendChild(metricRow("Swallowing", r.swallowing ? "Yes" : "No", false));
      body.appendChild(det);
      notesCard(r, body);
    }

    function renderReadings() {
      const d = day();
      const sec = el("div.section");
      sec.appendChild(
        sectionHead(
          "Readings",
          false,
          el("button.add-link", { text: "+ Add", onclick: () => readingMenu() })
        )
      );
      const bodyEl = el("div.section-body");
      const list = [...d.readings].sort((a, b) => (a.time || "").localeCompare(b.time || ""));
      if (!list.length) {
        bodyEl.appendChild(el("div.muted", { text: "No readings yet." }));
      } else {
        list.forEach((r) => {
          const def = READING_TYPES[r.type];
          const val = readingRowValue(r);
          const cat = rowScoreCategory(r);
          const valEl = el("div.row-val");
          if (typeof val === "string") {
            if (val && cat && SCORE_COLORS[cat]) {
              const dot = el("span.score-dot");
              dot.style.background = SCORE_COLORS[cat];
              valEl.appendChild(dot);
            }
            valEl.appendChild(document.createTextNode(val));
          } else {
            valEl.appendChild(val); // ECG badge (already colored)
          }
          bodyEl.appendChild(
            el("div.row", { onclick: () => openReadingSummary(r) }, [
              el("span.row-ico", { html: def.icon }),
              el("div.row-main", {}, [el("div.row-title", { text: def.label })]),
              valEl,
              r.time ? el("span.pill", { text: fmtTime12(r.time) }) : null,
            ])
          );
        });
      }
      sec.appendChild(bodyEl);
      return sec;
    }

    function readingMenu() {
      openModal((body) => {
        body.appendChild(el("h2", { text: "Add reading" }));
        const filter = el("input", { type: "text", placeholder: "Filter readings…" });
        body.appendChild(el("div.field", {}, [filter]));
        const listWrap = el("div");
        body.appendChild(listWrap);
        const types = Object.keys(READING_TYPES);
        const draw = () => {
          const q = filter.value.trim().toLowerCase();
          listWrap.innerHTML = "";
          const matches = types.filter((t) => READING_TYPES[t].label.toLowerCase().includes(q));
          if (!matches.length) {
            listWrap.appendChild(el("div.muted", { text: "No matches." }));
            return;
          }
          matches.forEach((type) => {
            listWrap.appendChild(
              el("button.menu-item", {
                onclick: () => readingForm(type, null), // stacks on top of this drawer
              }, [
                el("span.mi-ico", { html: READING_TYPES[type].icon }),
                el("div", {}, [el("div", { text: READING_TYPES[type].label })]),
              ])
            );
          });
        };
        filter.addEventListener("input", draw);
        draw();
      });
    }

    // Render the ordered field schema into `body`, collecting controls into
    // `inputs` (keyed by field key). Consecutive number fields are grouped into
    // a 2-column grid; everything else (select/time/check/divider, and lone
    // numbers) is rendered full width.
    function buildFieldInputs(body, fields, r, inputs) {
      let run = [];
      const flushRun = () => {
        if (!run.length) return;
        if (run.length === 1) {
          const f = run[0];
          inputs[f.key] = numInput(r[f.key]);
          body.appendChild(field(fieldLabel(f), inputs[f.key]));
        } else {
          const grid = el("div.field-grid");
          run.forEach((f) => {
            inputs[f.key] = numInput(r[f.key]);
            grid.appendChild(field(fieldLabel(f), inputs[f.key]));
          });
          body.appendChild(grid);
        }
        run = [];
      };
      fields.forEach((f) => {
        if (isNumberField(f)) { run.push(f); return; }
        flushRun();
        if (isDivider(f)) {
          body.appendChild(el("div.field-divider"));
        } else if (f.type === "select") {
          const sel = el("select", {}, f.options.map((o) => el("option", { value: o, text: o })));
          sel.value = r[f.key] != null && r[f.key] !== "" ? r[f.key] : f.options[0];
          inputs[f.key] = sel;
          body.appendChild(field(fieldLabel(f), sel));
        } else if (f.type === "time") {
          const t = el("input", { type: "time", value: r[f.key] || nowTime() });
          inputs[f.key] = t;
          body.appendChild(field(f.label || "Time", t));
        } else if (f.type === "check") {
          const cb = el("input", { type: "checkbox" });
          cb.checked = !!r[f.key];
          inputs[f.key] = cb;
          body.appendChild(el("div.field.field-check", {}, [el("label", {}, [cb, el("span", { text: f.label })])]));
        } else if (f.type === "textarea") {
          const ta = el("textarea", { placeholder: f.placeholder || "" });
          ta.value = r[f.key] || "";
          inputs[f.key] = ta;
          body.appendChild(field(f.label, ta));
        } else if (f.type === "text") {
          const ti = el("input", { type: "text", value: r[f.key] || "", placeholder: f.placeholder || "" });
          inputs[f.key] = ti;
          body.appendChild(field(f.label, ti));
        }
      });
      flushRun();
    }

    // Generic add/edit form for a typed entry (reading or activity).
    function openEntryForm(typeMap, arrKey, type, existing) {
      const def = typeMap[type];
      const r = existing ? { ...existing } : { id: uid(), type, time: nowTime(), note: "" };
      const fields = entryFields(def);
      openModal((body) => {
        body.appendChild(el("h2", { text: (existing ? "Edit " : "") + def.label }));
        const inputs = {};
        buildFieldInputs(body, fields, r, inputs);

        body.appendChild(
          el("div.modal-actions", {}, [
            existing
              ? el("button.btn.btn-danger", {
                  text: "Delete",
                  onclick: () => {
                    const d = day(currentKey, true);
                    d[arrKey] = d[arrKey].filter((x) => x.id !== r.id);
                    save();
                    closeAll();
                    renderDay();
                  },
                })
              : null,
            el("button.btn.btn-primary", {
              text: "Save",
              onclick: () => {
                const numFields = fields.filter(isNumberField);
                const anyNum = numFields.some((f) => String(inputs[f.key].value).trim() !== "");
                const anyCheck = fields.filter((f) => f.type === "check").some((f) => inputs[f.key].checked);
                if (type === "bp") {
                  if (!inputs.sys.value.trim() && !inputs.dia.value.trim())
                    return toast("Enter a blood pressure");
                } else if (numFields.length && !anyNum && !anyCheck) {
                  return toast("Enter a value");
                }
                fields.forEach((f) => {
                  if (isDivider(f)) return;
                  if (f.type === "check") r[f.key] = inputs[f.key].checked;
                  else r[f.key] = String(inputs[f.key].value).trim();
                });
                r.scores = computeScores(r); // store category scores with the entry
                const d = day(currentKey, true);
                const i = d[arrKey].findIndex((x) => x.id === r.id);
                if (i >= 0) d[arrKey][i] = r;
                else d[arrKey].push(r);
                save();
                closeAll();
                renderDay();
              },
            }),
          ])
        );
      });
    }

    function readingForm(type, existing) { openEntryForm(READING_TYPES, "readings", type, existing); }
    function activityForm(type, existing) {
      if (ACTIVITY_TYPES[type] && ACTIVITY_TYPES[type].custom === "bike") return bikeForm(existing);
      openEntryForm(ACTIVITY_TYPES, "activities", type, existing);

    function field(label, input) {
      return el("div.field", {}, [el("label", { text: label }), input]);
    }
    function numInput(v) {
      return el("input", {
        type: "number",
        inputmode: "decimal",
        value: v ?? "",
        placeholder: "-",
      });
    }

    // Indoor bike - custom form: a conditional section that is either a single
    // Resistance field or a repeatable list of interval cards, depending on the
    // Interval-training checkbox.
    function bikeForm(existing) {
      const r = existing
        ? JSON.parse(JSON.stringify(existing))
        : { id: uid(), type: "indoorBike", time: nowTime(), note: "", interval: false, intervals: [] };
      if (!Array.isArray(r.intervals)) r.intervals = [];
      openModal((body) => {
        body.appendChild(el("h2", { text: (existing ? "Edit " : "") + "Indoor bike" }));

        const time = el("input", { type: "time", value: r.time || nowTime() });
        body.appendChild(field("Time", time));

        const num = {};
        const mk = (key, label, unit) => {
          num[key] = numInput(r[key]);
          return field(label + (unit ? ` (${unit})` : ""), num[key]);
        };
        body.appendChild(el("div.field-grid", {}, [
          mk("duration", "Duration", "min"),
          mk("distance", "Distance", "mi"),
          mk("avgHr", "Avg HR"),
          mk("maxHr", "Max HR"),
          mk("minHr", "Min HR"),
        ]));

        const intervalCb = el("input", { type: "checkbox" });
        intervalCb.checked = !!r.interval;
        body.appendChild(el("div.field.field-check", {}, [
          el("label", {}, [intervalCb, el("span", { text: "Interval training" })]),
        ]));

        body.appendChild(el("div.field-divider"));
        const dyn = el("div");
        body.appendChild(dyn);

        let resistanceInput = null;
        const rows = []; // { card, inp } for each interval
        const renderDyn = () => {
          dyn.innerHTML = "";
          rows.length = 0;
          if (!intervalCb.checked) {
            resistanceInput = numInput(r.resistance);
            dyn.appendChild(field("Resistance", resistanceInput));
            return;
          }
          resistanceInput = null;
          const list = el("div");
          dyn.appendChild(list);
          const renumber = () =>
            rows.forEach((e, i) => { e.card.querySelector(".interval-head span").textContent = "Interval " + (i + 1); });
          const addInterval = (data) => {
            const iv = data || {};
            const inp = {};
            const grid = el("div.field-grid", {}, [
              (() => { inp.length = numInput(iv.length); return field("Length (min)", inp.length); })(),
              (() => { inp.resistance = numInput(iv.resistance); return field("Resistance", inp.resistance); })(),
              (() => { inp.avgHr = numInput(iv.avgHr); return field("Avg HR", inp.avgHr); })(),
              (() => { inp.maxHr = numInput(iv.maxHr); return field("Max HR", inp.maxHr); })(),
            ]);
            const del = el("button.interval-del", { type: "button", html: ICONS.x, "aria-label": "Remove interval" });
            const card = el("div.interval-card", {}, [
              el("div.interval-head", {}, [el("span"), del]),
              grid,
            ]);
            const entry = { card, inp };
            del.onclick = () => {
              const idx = rows.indexOf(entry);
              if (idx >= 0) rows.splice(idx, 1);
              card.remove();
              renumber();
            };
            rows.push(entry);
            list.appendChild(card);
            renumber();
          };
          (r.intervals || []).forEach(addInterval);
          dyn.appendChild(el("button.add-interval", { type: "button", text: "+ Add interval", onclick: () => addInterval() }));
        };
        intervalCb.addEventListener("change", renderDyn);
        renderDyn();

        body.appendChild(el("div.field-divider"));
        const hr60 = numInput(r.hr60);
        body.appendChild(field("HR after 60 seconds", hr60));

        const note = el("textarea", { placeholder: "Optional note" });
        note.value = r.note || "";
        body.appendChild(field("Notes", note));

        body.appendChild(el("div.modal-actions", {}, [
          existing
            ? el("button.btn.btn-danger", {
                text: "Delete",
                onclick: () => {
                  const d = day(currentKey, true);
                  d.activities = d.activities.filter((x) => x.id !== r.id);
                  save();
                  closeAll();
                  renderDay();
                },
              })
            : null,
          el("button.btn.btn-primary", {
            text: "Save",
            onclick: () => {
              r.time = time.value;
              ["duration", "distance", "avgHr", "maxHr", "minHr"].forEach((k) => { r[k] = num[k].value.trim(); });
              r.interval = intervalCb.checked;
              if (intervalCb.checked) {
                r.intervals = rows.map((e) => ({
                  length: e.inp.length.value.trim(),
                  resistance: e.inp.resistance.value.trim(),
                  avgHr: e.inp.avgHr.value.trim(),
                  maxHr: e.inp.maxHr.value.trim(),
                }));
                r.resistance = "";
              } else {
                r.resistance = resistanceInput ? resistanceInput.value.trim() : "";
                r.intervals = [];
              }
              r.hr60 = hr60.value.trim();
              r.note = note.value.trim();
              const d = day(currentKey, true);
              const i = d.activities.findIndex((x) => x.id === r.id);
              if (i >= 0) d.activities[i] = r;
              else d.activities.push(r);
              save();
              closeAll();
              renderDay();
            },
          }),
        ]));
      });
    }

    /* ---------------- Calendar ---------------- */
    function openCalendar() {
      let view = dateFromKey(currentKey);
      view.setDate(1);
      openModal((body) => {
        body.appendChild(el("h2", { text: "Select date" }));
        const wrap = el("div");
        body.appendChild(wrap);
        const draw = () => {
          wrap.innerHTML = "";
          const monthName = view.toLocaleDateString(undefined, { month: "long", year: "numeric" });
          wrap.appendChild(
            el("div", { style: "display:flex;align-items:center;justify-content:space-between;margin-bottom:12px" }, [
              el("button.icon-btn", { text: "‹", onclick: () => { view.setMonth(view.getMonth() - 1); draw(); } }),
              el("strong", { text: monthName, style: "font-size:16px" }),
              el("button.icon-btn", { text: "›", onclick: () => { view.setMonth(view.getMonth() + 1); draw(); } }),
            ])
          );
          const grid = el("div", { style: "display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center" });
          ["S", "M", "T", "W", "T", "F", "S"].forEach((d) =>
            grid.appendChild(el("div", { text: d, style: "font-size:11px;color:var(--text-dim);font-weight:700;padding:4px 0" }))
          );
          const first = new Date(view.getFullYear(), view.getMonth(), 1);
          const startPad = first.getDay();
          const daysInMonth = new Date(view.getFullYear(), view.getMonth() + 1, 0).getDate();
          for (let i = 0; i < startPad; i++) grid.appendChild(el("div"));
          const todayKey = keyOf(new Date());
          for (let dn = 1; dn <= daysInMonth; dn++) {
            const dk = keyOf(new Date(view.getFullYear(), view.getMonth(), dn));
            const isSel = dk === currentKey;
            const isToday = dk === todayKey;
            const hasData = dayHasData(dk);
            const btn = el("button", {
              style:
                "position:relative;aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;font-size:14px;font-family:inherit;" +
                (isSel
                  ? "background:var(--accent);color:#fff;font-weight:700;"
                  : "background:transparent;color:var(--text);") +
                (isToday && !isSel ? "outline:2px solid var(--accent);outline-offset:-2px;" : ""),
              text: String(dn),
              onclick: () => {
                currentKey = dk;
                closeAll();
                renderDate();
                renderDay();
              },
            });
            if (hasData && !isSel)
              btn.appendChild(
                el("span", {
                  style:
                    "position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--accent)",
                })
              );
            grid.appendChild(btn);
          }
          wrap.appendChild(grid);
        };
        draw();
        body.appendChild(
          el("div.modal-actions", {}, [
            el("button.btn", {
              text: "Jump to Today",
              onclick: () => {
                currentKey = keyOf(new Date());
                closeAll();
                renderDate();
                renderDay();
              },
            }),
          ])
        );
      });
    }

    function dayHasData(k) {
      const d = state.days[k];
      if (!d) return false;
      return (
        (d.readings && d.readings.length) ||
        (Array.isArray(d.activities) && d.activities.length) ||
        (Array.isArray(d.meds) && d.meds.length) ||
        (Array.isArray(d.symptoms) && d.symptoms.length) ||
        (d.sleep && (d.sleep.bed || d.sleep.wake)) ||
        (d.food && (+d.food.water > 0 || +d.food.calories > 0 || Object.values(d.food.triggers || {}).some((c) => c > 0))) ||
        (d.digestion && +d.digestion.bm > 0)
      );
    }

    function exportData() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = el("a", { href: url, download: `autonomic-journal-${keyOf(new Date())}.json` });
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      toast("Exported");
    }

    function importData() {
      const input = el("input", { type: "file", accept: "application/json,.json", style: "display:none" });
      input.addEventListener("change", () => {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(reader.result);
            if (!parsed || typeof parsed !== "object" || !("days" in parsed))
              throw new Error("Not an Autonomic Journal file");
            confirmImport(parsed, file.name);
          } catch (e) {
            toast("Import failed: " + e.message);
          }
        };
        reader.readAsText(file);
      });
      document.body.appendChild(input);
      input.click();
      input.remove();
    }

    function confirmImport(parsed, fileName) {
      openModal((body) => {
        body.appendChild(el("h2", { text: "Replace all data?" }));
        const days = Object.keys(parsed.days || {}).length;
        body.appendChild(
          el("p", {
            style: "color:var(--text-dim);font-size:14px",
            text: `This will replace everything currently on this device with the imported file (${days} day${days === 1 ? "" : "s"}). This cannot be undone.`,
          })
        );
        body.appendChild(
          el("div.modal-actions", {}, [
            el("button.btn", { text: "Cancel", onclick: closeModal }),
            el("button.btn.btn-danger", {
              text: "Replace",
              onclick: () => {
                state = migrate(parsed);
                state.meta.lastImport = { name: fileName || "(file)", at: new Date().toISOString() };
                currentKey = keyOf(new Date());
                save();
                applyTheme();
                renderDate();
                renderDay();
                renderAnalysis();
                closeAll();
                toast("Imported");
              },
            }),
          ])
        );
      });
    }

    /* ---------------- Analysis ---------------- */
    function daysInRange() {
      const keys = Object.keys(state.days).sort();
      if (analysisRange === 0) return keys;
      const cutoff = keyOf(new Date(Date.now() - (analysisRange - 1) * 86400000));
      return keys.filter((k) => k >= cutoff);
    }

    function renderAnalysis() {
      const root = $("#analysisContent");
      root.innerHTML = "";

      // range tabs
      const tabs = el("div.range-tabs");
      [[7, "7d"], [30, "30d"], [90, "90d"], [0, "All"]].forEach(([val, lbl]) => {
        tabs.appendChild(
          el("button.range-tab" + (analysisRange === val ? ".active" : ""), {
            text: lbl,
            onclick: () => { analysisRange = val; renderAnalysis(); },
          })
        );
      });
      root.appendChild(tabs);

      const keys = daysInRange();
      if (!keys.length) {
        root.appendChild(el("div.chart-empty", { text: "No data in this range yet." }));
        return;
      }

      // collect series. Unstructured HRV is charted by SDNN (the time-domain
      // HRV metric); Breathing HRV and Blood Oxygen by their single value.
      const hrv = [], breath = [], sys = [], dia = [], spo2 = [];
      const push = (arr, k, raw) => { const n = parseFloat(raw); if (!isNaN(n)) arr.push({ k, v: n }); };
      keys.forEach((k) => {
        const d = state.days[k];
        (d.readings || []).forEach((r) => {
          if (r.type === "hrv") push(hrv, k, r.sdnn);
          if (r.type === "breathHrv") push(breath, k, r.coherence);
          if (r.type === "bloodO2") push(spo2, k, r.value);
          if (r.type === "bp") { push(sys, k, r.sys); push(dia, k, r.dia); }
        });
      });

      const avg = (a) => (a.length ? Math.round(a.reduce((s, x) => s + x.v, 0) / a.length) : null);
      const stat = (label, val, sub) =>
        el("div.stat", {}, [
          el("div.stat-label", { text: label }),
          el("div.stat-value", {}, [val == null ? "-" : String(val), sub ? el("small", { text: " " + sub }) : null]),
        ]);

      root.appendChild(
        el("div.stat-grid", {}, [
          stat("Avg SDNN", avg(hrv)),
          stat("Avg Coherence", avg(breath), avg(breath) != null ? "%" : ""),
          stat("Avg BP", avg(sys) != null ? `${avg(sys)}/${avg(dia)}` : null),
          stat("Avg Blood O₂", avg(spo2), avg(spo2) != null ? "%" : ""),
        ])
      );

      root.appendChild(lineChartCard("Unstructured HRV (SDNN)", [{ data: hrv, color: "var(--accent)" }]));
      root.appendChild(lineChartCard("Breathing Coherence", [{ data: breath, color: "#3b82f6" }]));
      root.appendChild(
        lineChartCard("Blood Pressure", [
          { data: sys, color: "var(--accent)", label: "Sys" },
          { data: dia, color: "#3b82f6", label: "Dia" },
        ])
      );
      root.appendChild(lineChartCard("Blood Oxygen", [{ data: spo2, color: "#16a34a" }]));

      root.appendChild(freqCardTyped("Symptoms", "symptoms", SYMPTOM_TYPES, keys));
      root.appendChild(freqCardTyped("Activities", "activities", ACTIVITY_TYPES, keys));
    }

    function lineChartCard(title, series) {
      const card = el("div.chart-card", {}, [el("h3", { text: title })]);
      const hasData = series.some((s) => s.data.length);
      if (!hasData) {
        card.appendChild(el("div.chart-empty", { text: "No readings in range." }));
        return card;
      }
      card.appendChild(buildLineChart(series));
      // legend
      if (series.length > 1) {
        card.appendChild(
          el("div", { style: "display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--text-dim)" },
            series.map((s) =>
              el("span", { style: "display:flex;align-items:center;gap:5px" }, [
                el("span", { style: `width:10px;height:10px;border-radius:50%;background:${s.color};display:inline-block` }),
                s.label || "",
              ])
            )
          )
        );
      }
      return card;
    }

    function buildLineChart(series) {
      const W = 320, H = 140, padL = 30, padR = 8, padT = 10, padB = 20;
      const allKeys = [...new Set(series.flatMap((s) => s.data.map((d) => d.k)))].sort();
      const xIndex = new Map(allKeys.map((k, i) => [k, i]));
      const n = allKeys.length;
      let min = Infinity, max = -Infinity;
      series.forEach((s) => s.data.forEach((d) => { min = Math.min(min, d.v); max = Math.max(max, d.v); }));
      if (min === max) { min -= 5; max += 5; }
      const pad = (max - min) * 0.12;
      min -= pad; max += pad;

      const xFor = (k) => padL + (n <= 1 ? (W - padL - padR) / 2 : (xIndex.get(k) / (n - 1)) * (W - padL - padR));
      const yFor = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);

      const ns = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(ns, "svg");
      svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
      svg.setAttribute("preserveAspectRatio", "none");

      // gridlines + y labels (min, mid, max)
      [min, (min + max) / 2, max].forEach((val) => {
        const y = yFor(val);
        const line = document.createElementNS(ns, "line");
        line.setAttribute("x1", padL); line.setAttribute("x2", W - padR);
        line.setAttribute("y1", y); line.setAttribute("y2", y);
        line.setAttribute("stroke", "var(--border)"); line.setAttribute("stroke-width", "1");
        svg.appendChild(line);
        const t = document.createElementNS(ns, "text");
        t.setAttribute("x", 2); t.setAttribute("y", y + 3);
        t.setAttribute("font-size", "9"); t.setAttribute("fill", "var(--text-dim)");
        t.textContent = Math.round(val);
        svg.appendChild(t);
      });

      series.forEach((s) => {
        if (!s.data.length) return;
        const pts = [...s.data].sort((a, b) => a.k.localeCompare(b.k));
        const dStr = pts.map((p, i) => `${i ? "L" : "M"}${xFor(p.k).toFixed(1)} ${yFor(p.v).toFixed(1)}`).join(" ");
        const path = document.createElementNS(ns, "path");
        path.setAttribute("d", dStr);
        path.setAttribute("fill", "none");
        path.setAttribute("stroke", s.color);
        path.setAttribute("stroke-width", "2");
        path.setAttribute("stroke-linejoin", "round");
        path.setAttribute("stroke-linecap", "round");
        svg.appendChild(path);
        pts.forEach((p) => {
          const c = document.createElementNS(ns, "circle");
          c.setAttribute("cx", xFor(p.k)); c.setAttribute("cy", yFor(p.v));
          c.setAttribute("r", "2.5"); c.setAttribute("fill", s.color);
          svg.appendChild(c);
        });
      });

      return el("div.chart", {}, [svg]);
    }

    // Frequency of logged entries (array), counted by type, labeled via typeMap.
    function freqCardTyped(title, arrKey, typeMap, keys) {
      const card = el("div.chart-card", {}, [el("h3", { text: title })]);
      const counts = new Map();
      keys.forEach((k) => {
        const d = state.days[k];
        (d && Array.isArray(d[arrKey]) ? d[arrKey] : []).forEach((e) =>
          counts.set(e.type, (counts.get(e.type) || 0) + 1)
        );
      });
      const rows = [...counts.entries()]
        .map(([type, c]) => [typeMap[type] ? typeMap[type].label : type, c])
        .sort((a, b) => b[1] - a[1]);
      if (!rows.length) {
        card.appendChild(el("div.chart-empty", { text: "None logged in range." }));
        return card;
      }
      renderFreqRows(card, rows);
      return card;
    }

    function renderFreqRows(card, rows) {
      const maxC = rows[0][1];
      rows.forEach(([name, c]) => {
        card.appendChild(
          el("div.freq-row", {}, [
            el("div.freq-name", { text: name }),
            el("div.freq-bar-wrap", {}, [el("div.freq-bar", { style: `width:${(c / maxC) * 100}%` })]),
            el("div.freq-count", { text: String(c) }),
          ])
        );
      });
    }

    /* ---------------- View switching ---------------- */
    // Move the glass highlight to sit behind the active tab. When animate is
    // false (initial layout / resize) it snaps without the bouncy transition.
    function positionIndicator(animate = true) {
      const bar = $(".tabbar");
      if (!bar) return;
      const ind = bar.querySelector(".tab-indicator");
      const active = bar.querySelector(".tab.active");
      if (!ind || !active) return;
      if (!animate) ind.style.transition = "none";
      ind.style.left = active.offsetLeft + "px";
      ind.style.width = active.offsetWidth + "px";
      if (!animate) { void ind.offsetWidth; ind.style.transition = ""; }
    }

    function switchView(name) {
      const journal = name === "journal";
      $("#journalView").classList.toggle("hidden", !journal);
      $("#analysisView").classList.toggle("hidden", journal);
      document.querySelectorAll(".tab").forEach((t) =>
        t.classList.toggle("active", t.dataset.view === name)
      );
      positionIndicator();
      if (!journal) renderAnalysis();
    }

    /* ---------------- Wire up ---------------- */
    function init() {
      applyTheme();
      renderDate();
      renderDay();

      $("#themeBtn").addEventListener("click", toggleTheme);
      $("#menuBtn").addEventListener("click", openMenu);
      $("#prevDay").addEventListener("click", () => shiftDay(-1));
      $("#nextDay").addEventListener("click", () => shiftDay(1));
      $("#dateLabel").addEventListener("click", openCalendar);
      document.querySelectorAll(".tab").forEach((t) =>
        t.addEventListener("click", () => switchView(t.dataset.view))
      );

      // Place the sliding tab highlight once layout is ready, and keep it
      // aligned on resize.
      requestAnimationFrame(() => positionIndicator(false));
      window.addEventListener("resize", () => positionIndicator(false));

      // keyboard: left/right arrows change day
      document.addEventListener("keydown", (e) => {
        if ($("#modalRoot").children.length) {
          if (e.key === "Escape") closeModal();
          return;
        }
        if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowLeft") shiftDay(-1);
        if (e.key === "ArrowRight") shiftDay(1);
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {})
        );
      }
    }

    init();
  })();
  </script>
</body>
