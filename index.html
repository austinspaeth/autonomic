    // Grade → 0-100 points (per the scoring framework).
    const GRADE_PTS = { great: 95, good: 80, ok: 60, warning: 60, bad: 35, crash: 10, concerning: 10 };
    // Final-score bands (high → low). `color` tints the hero + chip.
    const SCORE_CATS = [
      { min: 85, label: "Excellent Autonomic Day", short: "Excellent", color: "#16a34a" },
      { min: 70, label: "Good Autonomic Day", short: "Good", color: "#22c55e" },
      { min: 55, label: "Moderate Autonomic Day", short: "Moderate", color: "#eab308" },
      { min: 40, label: "Compromised Day", short: "Compromised", color: "#f97316" },
      { min: 25, label: "Bad Day", short: "Bad", color: "#ef4444" },
      { min: 0, label: "Crash Day", short: "Crash", color: "#b91c1c" },
    ];
    const scoreCat = (s) => SCORE_CATS.find((c) => s >= c.min) || SCORE_CATS[SCORE_CATS.length - 1];
    const OUTLOOK_GUIDE = {
      Excellent: "Strong autonomic baseline. Good for the full protocol, including intervals, core, and strength. Capitalize on the capacity; don't push past the plan.",
      Good: "Solid baseline. Easy cycling, strength, normal activities. Hold off on intervals unless you've trended up across several days.",
      Moderate: "Reduced reserves. Walking, gentle activity, light core only. Skip cycling and intervals, and lean on hydration and rest.",
      Compromised: "Significantly reduced reserves. Rest, gentle stretching, basic ADLs. Avoid structured exercise and late dinners. This is a recovery day.",
      Bad: "System is stressed. Complete rest and gentle breathing only. Look at what's driving it: sleep, food, illness, or accumulated load.",
      Crash: "System in a crash state. Full rest, Liquid IV, magnesium, all meds. Check for illness or stacked triggers; seek care if symptoms warrant.",
    };
    const TOMORROW = {
      Excellent: "Tomorrow likely Good to Excellent.",
      Good: "Tomorrow likely Good.",
      Moderate: "Tomorrow likely Moderate, so skip intervals.",
      Compromised: "Tomorrow likely Compromised to Moderate, so keep it light.",
      Bad: "Tomorrow likely Bad. Plan a rest day.",
      Crash: "Tomorrow Bad to Crash. Prepare for full rest.",
    };
    // (hexA — hex → rgba — is defined alongside the reading-summary hero card.)

    // Which part of the day a reading belongs to (explicit period wins over clock).
    function readingPeriod(r) {
      if (r.period === "Morning") return "morning";
      if (r.period === "Evening") return "evening";
      const m = /^(\d{1,2}):/.exec(r.time || "");
      if (!m) return "midday";
      const h = +m[1];
      return h < 12 ? "morning" : h >= 18 ? "evening" : "midday";
    }

    // Sleep recovery grade for the night before `dk` (duration via sleepHours).
    // Quality (good/interrupted) is read from this day's record. Returns null
    // when the duration can't be determined, so sleep just drops out of the
    // score rather than being treated as a default night.
    function sleepGrade(dk) {
      const dur = sleepHours(dk);
      if (dur == null) return null;
      const d = state.days[dk];
      const good = !(d && d.sleep && d.sleep.quality === "interrupted");
      if (dur >= 8 && good) return "great";
      if (dur >= 7) return good ? "good" : "ok";
      if (dur >= 6) return good ? "ok" : "bad";
      if (dur >= 5) return "bad";
      return "crash";
    }

    // Behaviour grade from logged activity load (lightly weighted).
    function activityGrade(acts) {
      if (!acts || !acts.length) return null;
      const heavy = acts.filter((a) => ["stressfulWork", "upperBody", "coreWorkout", "indoorBike", "carWash"].includes(a.type));
      if (acts.some((a) => a.type === "strenuousWork") || heavy.length >= 3) return "bad";
      if (heavy.length === 2) return "ok";
      return "good";
    }

    // Weighted Autonomic Score from a subset of readings + the day record.
    // Missing components drop out and the weight is redistributed (confidence).
    // The latest reading of each type is used (so an evening reading drives
    // reflectance); structured HRV outranks unstructured (70/30) when both exist.
    function scoreSet(readings, d, dk) {
      const last = (a) => a[a.length - 1];
      const pts = (cat) => (cat ? GRADE_PTS[cat] : null);
      const structured = readings.filter((r) => r.type === "breathHrv");
      const unstructured = readings.filter((r) => r.type === "hrv");
      const sStruct = structured.length ? computeScores(last(structured)) : null;
      const sUn = unstructured.length ? computeScores(last(unstructured)) : null;

      let hrvPts = null;
      if (sStruct && sStruct.rmssd && sUn && sUn.rmssd) hrvPts = 0.7 * pts(sStruct.rmssd) + 0.3 * pts(sUn.rmssd);
      else if (sStruct && sStruct.rmssd) hrvPts = pts(sStruct.rmssd);
      else if (sUn && sUn.rmssd) hrvPts = pts(sUn.rmssd);

      const bp = last(readings.filter((r) => r.type === "bp"));
      const bpPts = bp ? pts(computeScores(bp).bp) : null;

      const rhr = last(readings.filter((r) => r.type === "restingHr"));
      let rhrPts = rhr ? pts(computeScores(rhr).hr) : null;
      if (rhrPts == null && sStruct) rhrPts = pts(sStruct.hr);
      if (rhrPts == null && sUn) rhrPts = pts(sUn.avgHr);

      const ecg = last(readings.filter((r) => r.type === "ecg"));
      const ecgPts = ecg ? pts(computeScores(ecg).rhythm || computeScores(ecg).overall) : null;

      const comps = [
        { w: 25, p: hrvPts, label: "HRV (RMSSD)" },
        { w: 15, p: sStruct ? pts(sStruct.totalPower) : null, label: "Total power" },
        { w: 10, p: sStruct ? pts(sStruct.pnn50) : null, label: "pNN50" },
        { w: 10, p: sStruct ? pts(sStruct.vlf) : null, label: "VLF power" },
        { w: 10, p: sStruct ? pts(sStruct.lfPeak) : null, label: "LF peak" },
        { w: 8, p: bpPts, label: "Blood pressure" },
        { w: 7, p: rhrPts, label: "Resting HR" },
        { w: 8, p: pts(sleepGrade(dk)), label: "Sleep" },
        { w: 5, p: ecgPts, label: "ECG rhythm" },
        { w: 2, p: pts(activityGrade(d.activities)), label: "Activity" },
      ].filter((c) => c.p != null);
      if (!comps.length) return { score: null, confidence: 0, hasStruct: !!sStruct, hasUnstruct: !!unstructured.length, comps: [] };
      const avail = comps.reduce((s, c) => s + c.w, 0);
      const sum = comps.reduce((s, c) => s + c.p * c.w, 0);
      return { score: Math.round(sum / avail), confidence: Math.round(avail), hasStruct: !!sStruct, hasUnstruct: !!unstructured.length, comps };
    }

    // Blue-zone flag: high unstructured readiness masking a fragile structured RMSSD.
    function blueZone(readings) {
      const u = readings.find((r) => r.type === "hrv" && numOr(r.readiness) != null);
      const s = readings.find((r) => r.type === "breathHrv");
      if (!u || !s) return false;
      const rmssd = computeScores(s).rmssd;
      return numOr(u.readiness) >= 90 && ["ok", "bad", "crash"].includes(rmssd);
    }

    /* ----- Clean Day Streak ----- */
    // Hours slept the night *before* `dk`: the prior day's bedtime to this day's
    // wake time (bed/wake are each recorded on their own day). The wake time is
    // taken as the first clock occurrence at or after the bedtime, so a late
    // AM bedtime (e.g. 12:30am = "went to bed super late") yields a short night
    // rather than a full day. Returns null when either endpoint is missing — no
    // defaults — which reads as "did not sleep 7h or more".
    function sleepHours(dk) {
      const d = state.days[dk];
      const wake = d && d.sleep ? d.sleep.wake : "";
      const pd = dateFromKey(dk); pd.setDate(pd.getDate() - 1);
      const prev = state.days[keyOf(pd)];
      const bed = prev && prev.sleep ? prev.sleep.bed : "";
      if (!bed || !wake) return null;
      const [bh, bm] = bed.split(":").map(Number), [wh, wm] = wake.split(":").map(Number);
      let mins = (wh * 60 + wm) - (bh * 60 + bm); if (mins < 0) mins += 1440;
      return mins / 60;
    }
    // Returns null when the day has no record; else { clean, criteria }.
    // `hard` criteria can't be recovered once failed (used for the "too late
    // today" message); `pending` criteria aren't yet wired up so they neither
    // count toward nor break a clean day.
    function dayCleanliness(dk) {
      const d = state.days[dk];
      if (!d) return null;
      const meds = d.meds || [];
      const hasMed = (t) => meds.some((m) => m.type === t);
      const triggers = (d.food && d.food.triggers) || {};
      const trigCount = Object.keys(triggers).reduce((s, k) => s + (triggers[k] > 0 ? triggers[k] : 0), 0);
      const water = (d.food && d.food.water) || 0;
      const hrs = sleepHours(dk);
      const sleepLogged = hrs != null;
      // Required meds — only the still-missing ones feed the "still needed" hint
      // (`need`), while the full set stays the checklist label.
      const medReq = [["allegra", "Allegra"], ["pepsidAc", "Pepcid"], ["magGlycinate", "Mag glycinate"]];
      const missingMeds = medReq.filter(([t]) => !hasMed(t));
      // Dinner by 5pm, derived from logged meals: met if a dinner was eaten by
      // 5:00pm; broken if every logged dinner is later; pending until a dinner
      // is logged (so it neither counts nor breaks the day).
      const dinners = ((d.food && d.food.meals) || []).filter((m) => m.type === "dinner" && m.time);
      // `broken` marks a hard criterion that has concretely failed (and so can't
      // be recovered today) — distinct from one that just isn't logged yet.
      const criteria = [
        { key: "triggers", label: "No trigger foods", pass: trigCount === 0, hard: true, broken: trigCount > 0 },
        { key: "water", label: "Water (2.5 L)", pass: water >= 2.5 },
        { key: "dinner", label: "Dinner by 5pm", pass: dinners.some((m) => m.time <= "17:00"), pending: dinners.length === 0 },
        { key: "meds", label: "Allegra, Pepcid, Mag glycinate", pass: missingMeds.length === 0, need: missingMeds.map(([, n]) => n).join(", ") },
        { key: "sleep", label: "Sleep 7h or more", pass: sleepLogged && hrs >= 7, hard: true, broken: sleepLogged && hrs < 7 },
      ];
      const clean = criteria.filter((c) => !c.pending).every((c) => c.pass);
      return { clean, criteria };
    }
    const streakTier = (n) =>
      n <= 0 ? { tier: "Start fresh", msg: "Today is day 1. Start fresh." }
      : n <= 3 ? { tier: "Building", msg: "Building momentum." }
      : n <= 7 ? { tier: "Established", msg: "Strong week forming." }
      : n <= 14 ? { tier: "Excellent", msg: "Exceptional consistency." }
      : n <= 30 ? { tier: "Outstanding", msg: "Major recovery period." }
      : { tier: "Elite", msg: "Sustained protocol mastery." };
    function streakInfo(dk) {
      const today = keyOf(new Date());
      const cur = dayCleanliness(dk);
      // Current streak: walk back over consecutive calendar days. A clean day
      // increments; anything else (or a gap) stops. Today still in progress
      // doesn't break the streak, so start counting from yesterday.
      const cursor = dateFromKey(dk);
      if (dk === today && (!cur || !cur.clean)) cursor.setDate(cursor.getDate() - 1);
      let current = 0;
      for (;;) {
        const c = dayCleanliness(keyOf(cursor));
        if (!c || !c.clean) break;
        current++;
        cursor.setDate(cursor.getDate() - 1);
      }
      // Longest run + 30-day clean rate over recorded days up to dk.
      const keys = Object.keys(state.days).filter((k) => k <= dk).sort();
      let longest = current, run = 0;
      if (keys.length) {
        const end = dateFromKey(dk);
        for (let cd = dateFromKey(keys[0]); cd <= end; cd.setDate(cd.getDate() + 1)) {
          const c = dayCleanliness(keyOf(cd));
          if (c && c.clean) { run++; if (run > longest) longest = run; }
          else run = 0;
        }
      }
      let cleanN = 0, total = 0;
      const e = dateFromKey(dk);
      for (let i = 0; i < 30; i++) {
        const c = dayCleanliness(keyOf(new Date(e.getFullYear(), e.getMonth(), e.getDate() - i)));
        if (c) { total++; if (c.clean) cleanN++; }
      }
      return { current, longest, rate: total ? Math.round(cleanN / total * 100) : null, today: cur, isToday: dk === today };
    }

    function renderDaySummary() {
      const dk = currentKey;
      const d = day(dk);
      const today = keyOf(new Date());
      const readings = (d.readings || []).slice().sort((a, b) => (a.time || "").localeCompare(b.time || ""));
      const morning = readings.filter((r) => readingPeriod(r) === "morning");
      const evening = readings.filter((r) => readingPeriod(r) === "evening");
      const all = scoreSet(readings, d, dk);

      const card = el("div.daycard");
      const hero = el("div.daycard-hero");
      card.appendChild(hero);

      if (all.score == null || all.confidence < 40) {
        // Not enough to score yet (or no readings): awaiting / low confidence.
        hero.appendChild(el("div.daycard-mode", { text: "Autonomic Outlook" }));
        if (!readings.length) {
          hero.appendChild(el("div.daycard-await-title", { text: dk > today ? "Future day" : "Awaiting morning data" }));
          hero.appendChild(el("div.daycard-await-sub", { text: dk > today ? "Nothing logged yet for this day." : "Add a morning HRV reading to see today's autonomic profile." }));
        } else {
          hero.appendChild(el("div.daycard-await-title", { text: "Insufficient data" }));
          hero.appendChild(el("div.daycard-await-sub", {
            text: (all.score != null ? `Provisional ${all.score} / 100 at ${all.confidence}% confidence. ` : "") +
              (all.hasStruct ? "Add more readings to firm up the score." : all.hasUnstruct ? "Awaiting a structured (breathing) reading for higher confidence." : "Add a morning HRV reading for higher confidence."),
          }));
        }
      } else {
        const cat = scoreCat(all.score);
        const hasEvening = evening.length > 0;
        const mornScore = morning.length ? scoreSet(morning, d, dk).score : null;
        const delta = mornScore != null ? all.score - mornScore : null;

        // Forward-looking until an evening reading turns it retrospective. The
        // outlook label stays "Autonomic Outlook" (no "updated"); `updated`
        // just tunes the wording.
        const updated = readings.length >= 2 || readings.some((r) => readingPeriod(r) === "midday");
        let mode;
        if (hasEvening) mode = dk < today ? "Day Complete" : "Reflectance";
        else mode = "Autonomic Outlook";

        hero.style.background = hexA(cat.color, 0.1);
        const chip = el("span.daycard-chip", { text: cat.short });
        chip.style.background = cat.color;
        const info = el("button.daycard-info", {
          html: ICONS.info, type: "button", "aria-label": "How this score was calculated",
          onclick: (e) => { e.stopPropagation(); openScoreExplain(all, dk); },
        });
        hero.appendChild(el("div.daycard-chiprow", {}, [info, chip]));
        hero.appendChild(el("div.daycard-mode", { text: mode }));

        const scoreRow = el("div.daycard-score", {}, [
          el("span.daycard-num", { text: String(all.score) }),
          el("span.daycard-den", { text: "/ 100" }),
        ]);
        if (delta != null && Math.abs(delta) >= 3) {
          const up = delta > 0;
          const tr = el("span.daycard-trend", { text: up ? "▲" : "▼" });
          tr.style.color = up ? SCORE_COLORS.good : SCORE_COLORS.bad;
          scoreRow.appendChild(tr);
        }
        hero.appendChild(scoreRow);
        hero.appendChild(el("div.daycard-status", { text: `${cat.label} · Confidence ${all.confidence}%` }));

        // Guidance: forward-looking for outlook, retrospective for reflectance.
        let guide;
        if (hasEvening) {
          if (delta == null) guide = "Evening reading logged. " + (TOMORROW[cat.short] || "");
          else if (delta <= -20) guide = "Major setback versus this morning. Multiple triggers likely stacked. " + TOMORROW[cat.short];
          else if (delta <= -10) guide = "Day cost more than the morning predicted. Check food, exertion, or stress. " + TOMORROW[cat.short];
          else if (delta >= 10) guide = "Day went better than the morning predicted. Note what worked and repeat it. " + TOMORROW[cat.short];
          else guide = "Day held its morning baseline; activity matched capacity. " + TOMORROW[cat.short];
        } else {
          guide = OUTLOOK_GUIDE[cat.short];
          if (updated && delta != null && Math.abs(delta) >= 5)
            guide = (delta < 0 ? "Trending down from this morning. Watch food and activity through the afternoon. " : "Trending up from this morning. ") + guide;
        }
        hero.appendChild(el("div.daycard-guide", { text: guide }));

        // Special flags.
        if (blueZone(readings)) {
          const f = el("div.daycard-flag", { html: ICONS.alert + "<span>Blue-zone risk. High readiness may mask fragility, so do less today, not more.</span>" });
          f.style.background = hexA(SCORE_COLORS.warning, 0.16);
          f.style.color = "#7c5cd6";
          hero.appendChild(f);
        }
        const yest = dayCleanliness(keyOf(new Date(dateFromKey(dk).getFullYear(), dateFromKey(dk).getMonth(), dateFromKey(dk).getDate() - 1)));
        if (cat.short === "Crash" || (yest && !yest.clean && all.score < 55)) {
          const f = el("div.daycard-flag", { html: ICONS.alert + "<span>Mandatory recovery day. Full rest, hydration, and protocol.</span>" });
          f.style.background = hexA(SCORE_COLORS.crash, 0.14);
          f.style.color = SCORE_COLORS.crash;
          hero.appendChild(f);
        }
      }

      // ----- Clean Day Streak -----
      const si = streakInfo(dk);
      const tier = streakTier(si.current);
      const streak = el("div.daycard-streak");
      // Badge icon escalates with the streak: sparkles → flame (3) → rocket (7) → moon (14).
      const streakIcon = si.current >= 14 ? ICONS.moon : si.current >= 7 ? ICONS.rocket : si.current >= 3 ? ICONS.flame : ICONS.sparkles;
      const badge = el("span.streak-badge" + (si.current > 0 ? ".lit" : ""), { html: streakIcon });
      streak.appendChild(badge);
      const right = el("div.streak-right");
      const main = el("div.streak-main");
      main.appendChild(el("div.streak-count", {}, [
        el("b", { text: String(si.current) }),
        ` clean day${si.current === 1 ? "" : "s"} · `,
        el("span.streak-tier", { text: tier.tier }),
      ]));

      let sub = tier.msg;
      const c = si.today;
      if (c) {
        if (c.clean) {
          sub = "Clean day. Streak continues.";
        } else {
          // `broken` = a hard criterion that has concretely failed (can't be
          // recovered today). Everything else not yet passing is "still needed",
          // including dinner-not-logged and meds (which list only the missing
          // ones via `need`).
          const hardFail = c.criteria.some((x) => x.broken);
          const needLabel = (x) => (x.need != null ? x.need : x.label).toLowerCase();
          const needed = c.criteria.filter((x) => !x.pass && !x.broken).map(needLabel);
          if (si.isToday) {
            // Once a non-recoverable criterion is missed, the day can't be saved.
            sub = hardFail
              ? "Too late for today. Try again to start fresh tomorrow."
              : needed.length
                ? `Today is day ${si.current + 1}. Still needed: ${needed.join(", ")}.`
                : `Today is day ${si.current + 1}.`;
          } else {
            const reasons = c.criteria.filter((x) => !x.pass && !x.pending).map(needLabel).slice(0, 3).join(", ");
            sub = `Not a clean day. ${reasons}.`;
          }
        }
      } else {
        sub = "No data logged for this day.";
      }
      main.appendChild(el("div.streak-sub", { text: sub }));
      // Header row: initial view (count + sub) with the caret centered against it.
      right.appendChild(el("div.streak-header", {}, [main, el("span.streak-caret", { html: ICONS.chevron })]));

      // Collapsible detail (stats + criteria) — hidden until the row is expanded.
      const extra = el("div.streak-extra");
      const stats = [`Longest ${si.longest}`];
      if (si.rate != null) stats.push(`30-day clean ${si.rate}%`);
      extra.appendChild(el("div.streak-stats", { text: stats.join(" · ") }));

      // Clean-day criteria checklist (each goal listed below the stats).
      if (c) {
        const list = el("div.daycard-criteria");
        c.criteria.forEach((x) => {
          // "broken" = a missed criterion that can't be recovered (a past day,
          // or a hard one like trigger foods/sleep) → red dot with a dash.
          // "todo" = still achievable today. "pending" = not wired up yet.
          let st;
          if (x.pending) st = "pending";
          else if (x.pass) st = "met";
          else if (!si.isToday || x.broken) st = "broken";
          else st = "todo";
          list.appendChild(el("span.crit." + st, {}, [
            el("span.crit-dot", { text: st === "met" ? "✓" : "" }),
            x.label,
          ]));
        });
        extra.appendChild(list);
      }
      right.appendChild(extra);

      streak.appendChild(right);
      streak.addEventListener("click", () => streak.classList.toggle("expanded"));
      card.appendChild(streak);

      return card;
    }

    // Per-component coaching used by the score-explanation drawer.
    const SCORE_TIPS = {
      "HRV (RMSSD)": "Vagal tone responds to rest, hydration, slow breathing, and avoiding triggers or over-exertion the day before.",
      "Total power": "Low total power means little overall autonomic engagement — favor rest, fluids, and gentle movement over intensity.",
      "pNN50": "Parasympathetic depth builds on genuine recovery days and consistent, earlier sleep.",
      "VLF power": "Elevated VLF reflects stress load — cut late stimulation, manage stress, and wind down earlier.",
      "LF peak": "Aim slow-breathing sessions toward about 0.08–0.10 Hz to train the baroreflex back into range.",
      "Blood pressure": "Support pressure with fluids and electrolytes; note salt, meds, posture, and heat as context.",
      "Resting HR": "A lower resting HR follows from hydration, rest, and avoiding stimulants and late activity.",
      "Sleep": "Target 7h+ — an earlier, consistent bedtime is usually the single biggest lever here.",
      "ECG rhythm": "Rhythm irregularities are worth flagging for your clinician; reduce stimulants and stress in the meantime.",
      "Activity": "Match activity to today's capacity; pacing now prevents a post-exertional setback later.",
    };

    // Drawer explaining how the day's Autonomic Score was built: the method,
    // what helped, what hurt, and where to focus. `all` is a scoreSet() result.
    function openScoreExplain(all, dk) {
      const cat = scoreCat(all.score);
      const ptsToCat = (p) => (p >= 88 ? "great" : p >= 70 ? "good" : p >= 48 ? "ok" : p >= 23 ? "bad" : "crash");
      const comps = (all.comps || []).map((c) => ({ ...c, cat: ptsToCat(c.p) }));
      const byW = (a, b) => b.w - a.w;
      const helped = comps.filter((c) => c.cat === "great" || c.cat === "good").sort(byW);
      const hurt = comps.filter((c) => c.cat === "bad" || c.cat === "crash" || c.cat === "concerning").sort(byW);
      const neutral = comps.filter((c) => c.cat === "ok" || c.cat === "warning").sort(byW);
      const have = new Set(comps.map((c) => c.label));

      openModal((body) => {
        body.appendChild(el("h2", { text: "How this score was calculated" }));

        const hero = el("div.sum-hero");
        hero.style.background = hexA(cat.color, 0.15);
        hero.style.borderColor = hexA(cat.color, 0.45);
        const rt = el("span.sum-hero-rating", { text: cat.short }); rt.style.background = cat.color; hero.appendChild(rt);
        hero.appendChild(el("div.sum-hero-label", { text: cat.label }));
        hero.appendChild(el("div.sum-hero-score", {}, [el("span.sum-hero-num", { text: String(all.score) }), el("span.sum-hero-den", { text: "/ 100" })]));
        hero.appendChild(el("div.sum-hero-sub", { text: `Confidence ${all.confidence}% — the share of the full input set that was available to score today.` }));
        body.appendChild(hero);

        body.appendChild(el("p.score-method", { text: "The Autonomic Score is a weighted blend of the day's readings. Each input is graded, turned into points, and combined by weight. Missing inputs drop out and the remaining weights are rescaled — that rescaling is the confidence percentage. The most recent reading of each type is used, and structured (breathing) HRV outranks the unstructured reading when both are present." }));

        const compRow = (c) => metricRow(c.label, `${GRADE_LABEL[c.cat]} · weight ${c.w}%`, c.cat);
        if (helped.length) { const card = sumCard("What helped"); helped.forEach((c) => card.appendChild(compRow(c))); body.appendChild(card); }
        if (hurt.length) { const card = sumCard("What hurt"); hurt.forEach((c) => card.appendChild(compRow(c))); body.appendChild(card); }
        if (neutral.length) { const card = sumCard("Middle of the range"); neutral.forEach((c) => card.appendChild(compRow(c))); body.appendChild(card); }

        // How to improve: tips for whatever is dragging the score (or holding it back).
        const focus = (hurt.length ? hurt : neutral).slice(0, 4).filter((c) => SCORE_TIPS[c.label]);
        const improve = sumCard("How to improve");
        if (focus.length) {
          focus.forEach((c) => improve.appendChild(el("div.metric-card", {}, [
            el("div.metric-head", {}, [scoreDot(c.cat), el("span.metric-name", { text: c.label })]),
            el("div.metric-explain", { text: SCORE_TIPS[c.label] }),
          ])));
        } else {
          improve.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: "Nothing is dragging the score down today. Keep the inputs consistent — steady sleep, hydration, and pacing hold a strong baseline." })]));
        }
        if (OUTLOOK_GUIDE[cat.short]) improve.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: OUTLOOK_GUIDE[cat.short] })]));
        body.appendChild(improve);

        // Confidence: nudge toward the high-weight inputs that are missing today.
        const bigMissing = [];
        if (!all.hasStruct) bigMissing.push("a structured breathing HRV reading");
        if (!have.has("Blood pressure")) bigMissing.push("blood pressure");
        if (!have.has("Sleep")) bigMissing.push("last night's sleep");
        if (all.confidence < 100 && bigMissing.length) {
          const mc = sumCard("Firm up the score");
          mc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: `Confidence is ${all.confidence}%. Logging ${bigMissing.join(", ")} would raise it and steady the number.` })]));
          body.appendChild(mc);
        }
      });
    }

    function renderDay() {
      const root = $("#dayContent");
      root.innerHTML = "";
      root.appendChild(renderDaySummary());
      root.appendChild(renderSleep());
      root.appendChild(renderReadings());
      root.appendChild(renderActivities());
      root.appendChild(renderMeds());
      root.appendChild(renderSymptoms());
      root.appendChild(renderFoodDrink());
      root.appendChild(renderDigestion());
    }

    // Reusable +/- stepper. onChange receives the new (non-negative) value.
    function stepperEl(value, step, onChange, fmt) {
      const v = +value || 0;
      const round = (x) => Math.round(x * 100) / 100;
      return el("div.stepper", {}, [
        el("button.step-btn", { text: "−", "aria-label": "Decrease", onclick: () => onChange(Math.max(0, round(v - step))) }),
        el("span.step-val", { text: fmt ? fmt(v) : String(v) }),
        el("button.step-btn", { text: "+", "aria-label": "Increase", onclick: () => onChange(round(v + step)) }),
      ]);
    }
    const stepperRow = (title, value, step, onChange, fmt) =>
      el("div.row", {}, [el("div.row-main", {}, [el("div.row-title", { text: title })]), stepperEl(value, step, onChange, fmt)]);

    function renderFoodDrink() {
      const d = day();
      const f = d.food || { water: 0, calories: 0, triggers: {} };
      const sec = el("div.section");
      sec.appendChild(sectionHead("Food & Drink"));
      const b = el("div.section-body");

      // Water — display only; tap to open the cups drawer.
      b.appendChild(
        el("div.row", { onclick: () => waterDrawer() }, [
          el("span.row-ico", { html: ICONS.cup }),
          el("div.row-main", {}, [el("div.row-title", { text: "Water" })]),
          el("div.row-val", { text: `${+f.water || 0} L` }),
        ])
      );

      // Meals — display-only total calories; tap to open the meals drawer.
      const meals = f.meals || [];
      const totalCal = meals.reduce((s, m) => s + (parseInt(m.calories, 10) || 0), 0);
      b.appendChild(el("div.row", { onclick: () => mealsDrawer() }, [
        el("span.row-ico", { html: ICONS.utensils }),
        el("div.row-main", {}, [el("div.row-title", { text: "Meals" })]),
        el("div.row-val", { text: `${totalCal} cal` }),
      ]));

      // Triggers — nested card with its own add + per-item delete.
      const card = el("div.trig-card");
      card.appendChild(el("div.trig-card-head", {}, [
        el("span.row-ico", { html: ICONS.alert }),

        el("button.add-link", { text: "+ Add", onclick: () => triggerMenu() }),

      } else {
        keys.forEach((k) => card.appendChild(

            el("div.trig-item-label", { text: TRIGGER_TYPES[k].label }),

              html: ICONS.x, "aria-label": "Delete",
              onclick: () => { delete day(currentKey, true).food.triggers[k]; save(); renderDay(); },
            }),
          ])
        ));
      }
      b.appendChild(card);

      sec.appendChild(b);
      return sec;
    }

    // Water drawer: 5 cups (1 L each) two-way bound to a liters input.
    function waterDrawer() {
      let liters = +day().food.water || 0;
      openModal((body) => {
        body.appendChild(el("h2", { text: "Water" }));
        const cupsRow = el("div.water-cups");
        const input = el("input.num-inline", { type: "number", inputmode: "decimal", step: "0.25", min: "0", value: liters || 0 });
        const cups = [];
        const paint = () => { cups.forEach((c, i) => c.classList.toggle("is-full", liters >= i + 1)); };
        for (let i = 0; i < 5; i++) {
          const cup = el("button.water-cup", {
            type: "button", html: ICONS.cup, "aria-label": `${i + 1} liter${i ? "s" : ""}`,
            onclick: () => {
              // Tapping the topmost filled cup clears it (decrement); else fill up to here.
              liters = liters === i + 1 ? i : i + 1;
              input.value = liters;
              paint();
            },
          });
          cups.push(cup);
          cupsRow.appendChild(cup);
        }
        input.addEventListener("input", () => { liters = Math.max(0, +input.value || 0); paint(); });
        paint();
        body.appendChild(cupsRow);
        body.appendChild(field("Liters", input));
        body.appendChild(el("div.modal-actions", {}, [
          el("button.btn.btn-primary", {
            text: "Save",
            onclick: () => { day(currentKey, true).food.water = Math.max(0, +input.value || 0); save(); closeAll(); renderDay(); },
          }),
        ]));
      });
    }

    // Meals drawer: lists the day's meals (chronological) and an Add meal button
    // that stacks the add/edit form on top. Saving the form pops back here and
    // refreshes this list; the journal's Food row updates via renderDay().
    function mealsDrawer() {

          listWrap.innerHTML = "";

          meals.forEach((m) => {

            ]));

        }));

    // Segmented control with a sliding pill (tuned for 2 options, full width).
    function segmented(opts, value, onChange) {
      const n = opts.length;
      const wrap = el("div.segmented", { style: `grid-template-columns: repeat(${n}, 1fr)` });
      // Pill width = one option column exactly ((track area − padding) / n), so
      // translateX(idx*100%) lands it dead-center under each option for any n.
      // (The old `100/n% - 4px` only aligned at n=2.)
      const pill = el("span.seg-pill", { style: `width: calc((100% - 8px) / ${n})` });
      wrap.appendChild(pill);
      const buttons = [];
      const setActive = (val) => {
        const idx = Math.max(0, opts.findIndex((o) => o.val === val));
        pill.style.transform = `translateX(${idx * 100}%)`;
        buttons.forEach((b, i) => b.classList.toggle("active", i === idx));
      };
      opts.forEach((o) => {
        const b = el("button.seg-opt", {
          type: "button", text: o.label,
          onclick: () => { setActive(o.val); onChange(o.val); },
        });
        buttons.push(b);
        wrap.appendChild(b);
      });
      setActive(value);
      return wrap;
    }

    // ---- Generic entry schema (shared by readings & activities) ----
    // Each field has a `type`: "number" (default for legacy {key,label}),
    // "select", "time", "check", or a divider ({divider:true}). The ordered
    // list drives both the form and the row summaries.
    const isDivider = (f) => f.divider || f.type === "divider";
    const isNumberField = (f) => f.type === "number" || (!f.type && f.key && !f.divider);
    const fieldLabel = (f) => f.label + (f.unit ? ` (${f.unit})` : "");

    // The fields to render. Auto-adds a Time input (before any free-text
    // fields) and a trailing Notes textarea when the schema doesn't define them.
    function entryFields(def) {
      const fields = (def && def.fields ? def.fields : []).slice();
      if (!(def && def.noTime) && !fields.some((f) => f.type === "time")) {
        const firstText = fields.findIndex((f) => f.type === "textarea");
        const timeField = { type: "time", key: "time", label: "Time" };
        if (firstText >= 0) fields.splice(firstText, 0, timeField);
        else fields.push(timeField);
      }
      if (!fields.some((f) => f.key === "note")) {
        fields.push({ type: "textarea", key: "note", label: "Notes", placeholder: "Optional note" });
      }
      return fields;
    }

    // Headline value shown on the right of a row = first filled number field.
    function summarizeFields(def, r) {
      for (const f of entryFields(def)) {
        if (!isNumberField(f)) continue;
        const v = r[f.key];
        if (v != null && v !== "") return v + (f.unit || "");
      }
      return "";
    }
    // Secondary line = remaining filled fields (numbers/selects) + checked flags.
    function detailFields(def, r) {
      if (!def) return "";
      const parts = [];
      let headlineSkipped = false;
      for (const f of entryFields(def)) {
        if (isDivider(f) || f.type === "time" || f.type === "textarea") continue;
        if (f.type === "check") { if (r[f.key]) parts.push(f.label); continue; }
        const v = r[f.key];
        if (v == null || v === "") continue;
        if (isNumberField(f) && !headlineSkipped) { headlineSkipped = true; continue; }
        parts.push(`${f.label} ${v}${f.unit || ""}`);
      }
      return parts.join(" · ");
    }

    /* ---------------- Scoring ----------------
       Each metric is categorized great/good/ok/bad/crash|concerning (plus a
       "warning" blue zone for readiness). computeScores(r) stores r.scores on
       save; the summary value is tinted by its category. Thresholds come from
       the personalized framework in the project notes. */
    const SCORE_COLORS = {
      great: "#38bdf8", good: "#4ade80", ok: "#eab308",
      bad: "#f97316", crash: "#ef4444", concerning: "#ef4444", warning: "#a78bfa",
    };
    const SCORE_RANK = { great: 0, good: 1, ok: 2, warning: 2, bad: 3, crash: 4, concerning: 4 };
    const worstCat = (cats) => {
      let w = null, wr = -1;
      cats.forEach((c) => { const r = SCORE_RANK[c]; if (r != null && r > wr) { wr = r; w = c; } });
      return w;
    };
    const numOr = (v) => { const n = parseFloat(v); return isNaN(n) ? null : n; };

    // higher-is-better metrics (terminal category = crash)
    const sRMSSDu = (v) => { v = numOr(v); return v == null ? null : v >= 34 ? "great" : v >= 27 ? "good" : v >= 22 ? "ok" : v >= 17 ? "bad" : "crash"; };
    const sRMSSDs = (v) => { v = numOr(v); return v == null ? null : v >= 32 ? "great" : v >= 27 ? "good" : v >= 22 ? "ok" : v >= 17 ? "bad" : "crash"; };
    const sPNN50 = (v) => { v = numOr(v); return v == null ? null : v >= 10 ? "great" : v >= 7 ? "good" : v >= 4 ? "ok" : v >= 2 ? "bad" : "crash"; };
    const sSDNN = (v) => { v = numOr(v); return v == null ? null : v >= 60 ? "great" : v >= 50 ? "good" : v >= 40 ? "ok" : v >= 30 ? "bad" : "crash"; };
    const sTotalPower = (v) => { v = numOr(v); return v == null ? null : v >= 3500 ? "great" : v >= 2200 ? "good" : v >= 1500 ? "ok" : v >= 800 ? "bad" : "crash"; };
    const sVLF = (v) => { v = numOr(v); return v == null ? null : v < 200 ? "great" : v <= 450 ? "good" : v <= 700 ? "ok" : v <= 1000 ? "bad" : "crash"; }; // lower better
    const sReadiness = (v) => { v = numOr(v); if (v == null) return null; if (v >= 86) return "warning"; return v >= 70 ? "great" : v >= 60 ? "good" : v >= 50 ? "ok" : v >= 35 ? "bad" : "crash"; };
    const sSpo2 = (v) => { v = numOr(v); return v == null ? null : v >= 98 ? "great" : v >= 96 ? "good" : v >= 94 ? "ok" : v >= 92 ? "bad" : "concerning"; };
    const sRestingHr = (v, pos) => {
      v = numOr(v); if (v == null) return null;
      const lying = !pos || /lay/i.test(pos);
      return lying
        ? (v <= 62 ? "great" : v <= 68 ? "good" : v <= 75 ? "ok" : v <= 85 ? "bad" : "concerning")
        : (v <= 68 ? "great" : v <= 78 ? "good" : v <= 88 ? "ok" : v <= 98 ? "bad" : "concerning");
    };
    // QTc is scored via qtcBands(sex) (defined below) so the grade is sex-aware.
    const sQRS = (v) => { v = numOr(v); if (v == null) return null; if (v > 130) return "concerning"; if (v >= 121) return "bad"; if (v >= 111) return "ok"; if (v >= 91) return "good"; return "great"; };
    const sPR = (v) => { v = numOr(v); if (v == null) return null; if (v < 100 || v > 240) return "concerning"; if (v < 110 || v >= 221) return "bad"; if (v < 120 || v >= 201) return "ok"; if (v < 140 || v >= 181) return "good"; return "great"; };
    const sEctopic = (v) => { v = numOr(v); return v == null ? null : v === 0 ? "great" : v <= 2 ? "good" : v <= 5 ? "ok" : v <= 15 ? "bad" : "concerning"; };
    const sCoherence = (v) => { v = numOr(v); return v == null ? null : v >= 7 ? "great" : v >= 4 ? "good" : v >= 2 ? "ok" : v >= 1 ? "bad" : "crash"; };
    const sLfPeak = (v) => { v = numOr(v); if (v == null) return null; if (v < 0.045) return "concerning"; if (v < 0.060) return "bad"; if (v < 0.075) return "ok"; if (v < 0.090) return "good"; if (v <= 0.105) return "great"; return "good"; };
    const sLfHf = (v) => { v = numOr(v); if (v == null) return null; if (v < 1.5) return "great"; if (v <= 3) return "good"; if (v <= 5) return "ok"; if (v <= 10) return "bad"; return "concerning"; };
    const expectedHf = (style) => ({ "4/4": [0.18, 0.21], "4/5": [0.17, 0.20], "4/6": [0.15, 0.18], "5/5": [0.16, 0.18] })[style] || null;
    const sHfPeak = (v, style) => { v = numOr(v); const e = expectedHf(style); if (v == null || !e) return null; if (v >= e[0] && v <= e[1]) return "great"; const d = v < e[0] ? e[0] - v : v - e[1]; return d <= 0.02 ? "good" : d <= 0.04 ? "ok" : "bad"; };
    const sHR = (v) => { v = numOr(v); return v == null ? null : v <= 62 ? "great" : v <= 68 ? "good" : v <= 75 ? "ok" : v <= 85 ? "bad" : "concerning"; }; // lower better
    const sRrMode = (v) => { v = numOr(v); if (v == null) return null; if (v < 720 || v > 1090) return "concerning"; if (v >= 950) return "great"; if (v >= 870) return "good"; if (v >= 790) return "ok"; return "bad"; };
    const sMxDMn = (v) => { v = numOr(v); return v == null ? null : v >= 0.35 ? "great" : v >= 0.25 ? "good" : v >= 0.18 ? "ok" : v >= 0.12 ? "bad" : "crash"; }; // seconds
    const sAMo50 = (v) => { v = numOr(v); return v == null ? null : v < 30 ? "great" : v < 40 ? "good" : v < 50 ? "ok" : v < 60 ? "bad" : "concerning"; }; // lower better
    const sCV = (v) => { v = numOr(v); return v == null ? null : v >= 7 ? "great" : v >= 5.5 ? "good" : v >= 4.5 ? "ok" : v >= 3 ? "bad" : "crash"; };
    const sRhythm = (r) => ((r.svt || r.otherArrhythmia) ? "concerning" : r.sinus ? "great" : null);
    const sSys = (s) => { s = numOr(s); if (s == null) return null; if (s >= 150) return "concerning"; if (s >= 136) return "bad"; if (s >= 129) return "ok"; if (s >= 119) return "good"; if (s >= 108) return "great"; if (s >= 100) return "ok"; return "bad"; };
    const sDia = (d) => { d = numOr(d); if (d == null) return null; if (d >= 95) return "concerning"; if (d >= 88) return "bad"; if (d >= 83) return "ok"; if (d >= 79) return "good"; if (d >= 65) return "great"; if (d >= 60) return "ok"; return "bad"; };
    const sBP = (sys, dia) => { const a = sSys(sys), b = sDia(dia); return a || b ? worstCat([a, b].filter(Boolean)) : null; };
    const totalPower = (r) => {
      const a = ["vlowPower", "lowPower", "highPower"].map((k) => parseFloat(r[k])).filter((n) => !isNaN(n));
      return a.length ? a.reduce((x, y) => x + y, 0) : null;
    };

    // ----- BMI (weight reading grading) -----
    // BMI from a logged weight (lbs) + the profile height (inches). Returns
    // null when either is missing or invalid.
    function bmiFor(weightLbs) {
      const w = weightLbs == null || weightLbs === "" ? null : +weightLbs;
      const h = state.profile && state.profile.height ? +state.profile.height : null;

      return (703 * w) / (h * h);
    }
    // Standard adult BMI zones (sex-independent) → a grade category for tinting.
    const BMI_ZONES = [
      { max: 18.5, zone: "Underweight", cat: "warning" },
      { max: 25, zone: "Healthy", cat: "great" },
      { max: 30, zone: "Overweight", cat: "ok" },
      { max: Infinity, zone: "Obese", cat: "bad" },

    function bmiZone(bmi) { return BMI_ZONES.find((z) => bmi < z.max) || BMI_ZONES[BMI_ZONES.length - 1]; }

    function computeScores(r) {
      const s = {};
      const put = (k, c) => { if (c) s[k] = c; };
      switch (r.type) {
        case "hrv": {
          put("readiness", sReadiness(r.readiness));

          put("avgHr", sHR(r.avgHr));
          const band = (k, b) => { const v = numOr(r[k]); if (v != null) put(k, catFromBands(v, b)); };
          band("pns", BANDS.pns); band("sns", BANDS.sns); band("stressIndex", BANDS.stressIndex);
          const lf = parseFloat(r.lowPower), hf = parseFloat(r.highPower);

        case "breathHrv": {

        case "bp": put("sys", sSys(r.sys)); put("dia", sDia(r.dia)); put("bp", sBP(r.sys, r.dia)); break;
        case "bloodO2": put("value", sSpo2(r.value)); break;

        case "ecg":

    // Category used to tint the single value shown on a reading row.
    function rowScoreCategory(r) {
      const s = computeScores(r);

    /* ---------------- Reading summary (read-only overview + Edit) ---------------- */
    const GRADE_LABEL = { great: "Great", good: "Good", ok: "OK", bad: "Bad", crash: "Crash", concerning: "Concerning", warning: "Warning" };
    function scoreDot(cat) {

      kerdo: [{ max: -45, cat: "concerning" }, { max: -30, cat: "bad" }, { max: -20, cat: "ok" }, { max: -10, cat: "good" }, { max: 11, cat: "great" }, { max: 21, cat: "good" }, { max: 31, cat: "ok" }, { max: 46, cat: "bad" }, { max: Infinity, cat: "concerning" }],

      kvas: [{ max: 14, cat: "great" }, { max: 17, cat: "good" }, { max: 21, cat: "ok" }, { max: 26, cat: "bad" }, { max: Infinity, cat: "concerning" }],
      bce: [{ max: 2601, cat: "great" }, { max: 3001, cat: "good" }, { max: 3501, cat: "ok" }, { max: 4001, cat: "bad" }, { max: Infinity, cat: "concerning" }],
      perfusion: [{ max: 1, cat: "concerning" }, { max: 2, cat: "bad" }, { max: 4, cat: "ok" }, { max: 5, cat: "good" }, { max: Infinity, cat: "great" }],
      pns: [{ max: -1.5, cat: "crash" }, { max: -0.5, cat: "bad" }, { max: 0.3, cat: "ok" }, { max: 1.5, cat: "good" }, { max: Infinity, cat: "great" }],

    };
    // Resting-HR zones depend on body position.
    const restingHrBands = (pos) => (!pos || /lay/i.test(pos))
      ? [{ max: 63, cat: "great" }, { max: 69, cat: "good" }, { max: 76, cat: "ok" }, { max: 86, cat: "bad" }, { max: Infinity, cat: "concerning" }]
      : [{ max: 69, cat: "great" }, { max: 79, cat: "good" }, { max: 89, cat: "ok" }, { max: 99, cat: "bad" }, { max: Infinity, cat: "concerning" }];
    // QTc norms run a little longer for females; shift the high-side thresholds.
    const qtcBands = (sex) => sex === "Female"
      ? BANDS.qtc.map((b) => ({ max: (b.max > 350 && isFinite(b.max)) ? b.max + 10 : b.max, cat: b.cat }))
      : BANDS.qtc;
    function bandsFor(type, key) {
      const map = {
        hrv: { readiness: "readiness", rmssd: "rmssdU", sdnn: "sdnn", avgHr: "hrBreath" },
        breathHrv: { sdnn: "sdnn", rmssd: "rmssdS", pnn50: "pnn50", vlowPower: "vlf", lfPeak: "lfPeak", coherence: "coherence", hr: "hrBreath", meanRr: "rrMode", mode: "rrMode", mxdmn: "mxdmn", amo50: "amo50", cv: "cv" },
        bp: { sys: "sys", dia: "dia" },
        bloodO2: { value: "spo2" },
        ecg: { qtc: "qtc", qrs: "qrs", pr: "pr", ectopic: "ectopic" },

    }
    const numEx = (key) => (rr) => { const v = parseFloat(rr[key]); return isNaN(v) ? null : v; };
    const catFromBands = (v, bands) => { if (!bands) return null; for (const b of bands) if (v < b.max) return b.cat; return bands[bands.length - 1].cat; };
    const fmtShort = (dk) => dateFromKey(dk).toLocaleDateString(undefined, { month: "short", day: "numeric" });
    const fmtNum = (v) => { if (v == null) return "-"; if (Number.isInteger(v)) return String(v); return Math.abs(v) < 1 ? v.toFixed(3) : v.toFixed(1); };

    // Chronological history for one metric across all days (last `limit`):
    // returns [{ v, date }] oldest→newest.
    function metricHistory(type, extractor, limit = 15) {
      const out = [];
      Object.keys(state.days).sort().forEach((dk) => {
        const list = (state.days[dk].readings || []).filter((r) => r.type === type);
        list.sort((a, b) => (a.time || "").localeCompare(b.time || ""));
        list.forEach((r) => { const v = extractor(r); if (v != null && !isNaN(v)) out.push({ v, date: dk }); });
      });
      return out.slice(-limit);
    }

    // "Nice" axis numbers so the y-range extends out to round bounds with ticks.
    const niceNum = (x, round) => {
      if (x <= 0) return 1;
      const exp = Math.floor(Math.log10(x)), f = x / Math.pow(10, exp);
      const nf = round ? (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) : (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10);
      return nf * Math.pow(10, exp);
    };
    function niceScale(dataMin, dataMax, ticks) {
      let min = dataMin, max = dataMax;
      if (min === max) { const d = Math.abs(min) || 1; min -= d; max += d; }
      const pad = (max - min) * 0.5; min -= pad; max += pad; // extend the range out
      const step = niceNum(niceNum(max - min, false) / (ticks - 1), true);
      return { min: Math.floor(min / step) * step, max: Math.ceil(max / step) * step, step };
    }
    // Smooth (curved) path through points via Catmull-Rom → cubic béziers.
    function smoothPath(pts) {
      if (pts.length < 2) return "";
      let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
      const t = 0.16;
      for (let i = 0; i < pts.length - 1; i++) {
        const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
        const c1x = p1[0] + (p2[0] - p0[0]) * t, c1y = p1[1] + (p2[1] - p0[1]) * t;
        const c2x = p2[0] - (p3[0] - p1[0]) * t, c2y = p2[1] - (p3[1] - p1[1]) * t;
        d += ` C${c1x.toFixed(1)} ${c1y.toFixed(1)} ${c2x.toFixed(1)} ${c2y.toFixed(1)} ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
      }
      return d;
    }

    // Curved sparkline: fixed tick spacing (doesn't stretch full width), grade
    // bands + y ticks, color-coded points, and a draggable date·value readout.
    function buildSpark(points, bands) {
      if (!points || points.length < 2) return null;
      const ns = "http://www.w3.org/2000/svg";
      const mk = (t, a) => { const e = document.createElementNS(ns, t); for (const k in a) e.setAttribute(k, a[k]); return e; };
      const vals = points.map((p) => p.v);
      const sc = niceScale(Math.min(...vals), Math.max(...vals), 4);
      const min = sc.min, max = sc.max;
      // Fixed viewBox; the SVG scales to fill the card width (preserveAspectRatio none).
      const W = 320, H = 90, padL = 30, padR = 10, padT = 10, padB = 18;
      const innerW = W - padL - padR;
      const xAt = (i) => padL + (points.length === 1 ? innerW / 2 : (i / (points.length - 1)) * innerW);
      const yAt = (v) => padT + (1 - (v - min) / (max - min)) * (H - padT - padB);

      const svg = mk("svg", { viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: "none" });

      // Line is colored by a vertical gradient with hard stops at each zone
      // boundary, so the line takes on the grade color at its current height.
      let stroke = "currentColor";
      if (bands) {
        const gid = "spk" + (buildSpark._n = (buildSpark._n || 0) + 1);
        const grad = mk("linearGradient", { id: gid, gradientUnits: "userSpaceOnUse", x1: 0, y1: padT, x2: 0, y2: H - padB });
        const offAt = (v) => Math.max(0, Math.min(1, 1 - (v - min) / (max - min)));
        const colAt = (v) => SCORE_COLORS[catFromBands(v, bands)] || "#888";
        const addStop = (o, c) => grad.appendChild(mk("stop", { offset: o, "stop-color": c }));
        addStop(0, colAt(max - 1e-9)); // top (highest value)
        bands.map((b) => b.max).filter((m) => m > min && m < max).sort((a, b) => b - a).forEach((bv) => {
          addStop(offAt(bv), colAt(bv + 1e-9)); // color above the boundary
          addStop(offAt(bv), colAt(bv - 1e-9)); // color below the boundary

        addStop(1, colAt(min + 1e-9)); // bottom (lowest value)
        const defs = mk("defs", {}); defs.appendChild(grad); svg.appendChild(defs);
        stroke = `url(#${gid})`;
      }

      // y ticks + labels
      for (let t = min; t <= max + 1e-9; t += sc.step) {
        const yy = yAt(t);
        svg.appendChild(mk("line", { x1: padL, x2: padL + innerW, y1: yy, y2: yy, stroke: "var(--border)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0.5 }));
        const tx = mk("text", { x: padL - 4, y: yy + 3, "text-anchor": "end", class: "chart-axis" });
        tx.textContent = fmtNum(t); svg.appendChild(tx);
      }
      // x ticks
      points.forEach((p, i) => svg.appendChild(mk("line", { x1: xAt(i), x2: xAt(i), y1: H - padB, y2: H - padB + 4, stroke: "var(--text-dim)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0.6 })));

      // Optional zone-boundary dashed lines (toggled by "Show zones")
      let zonesG = null;
      if (bands) {
        zonesG = mk("g", {}); zonesG.style.display = "none";
        bands.forEach((b) => {
          if (b.max > min && b.max < max) {
            zonesG.appendChild(mk("line", { x1: padL, x2: padL + innerW, y1: yAt(b.max), y2: yAt(b.max), stroke: SCORE_COLORS[b.cat] || "#888", "stroke-width": 1.5, "stroke-dasharray": "4 3", "vector-effect": "non-scaling-stroke", opacity: 0.95 }));
          }
        });
        svg.appendChild(zonesG);
      }

      const xy = points.map((p, i) => [xAt(i), yAt(p.v)]);
      const path = mk("path", { d: smoothPath(xy), fill: "none", stroke, "stroke-width": 3.5, "vector-effect": "non-scaling-stroke", "stroke-linejoin": "round", "stroke-linecap": "round" });
      svg.appendChild(path);
      points.forEach((p, i) => { const cat = catFromBands(p.v, bands); svg.appendChild(mk("circle", { cx: xAt(i), cy: yAt(p.v), r: 2.6, fill: cat && SCORE_COLORS[cat] ? SCORE_COLORS[cat] : "currentColor" })); });
      const marker = mk("line", { y1: padT, y2: H - padB, stroke: "var(--text)", "stroke-width": 1, "vector-effect": "non-scaling-stroke", opacity: 0 });
      const adot = mk("circle", { r: 3.6, opacity: 0 });
      svg.appendChild(marker); svg.appendChild(adot);

      const wrap = el("div.spark");
      const readout = el("div.spark-readout");
      const headRow = el("div.spark-top", {}, [readout]);
      if (zonesG) {
        const btn = el("button.spark-zones-btn", { type: "button", text: "Show zones" });
        btn.addEventListener("click", () => { const on = zonesG.style.display === "none"; zonesG.style.display = on ? "" : "none"; btn.textContent = on ? "Hide zones" : "Show zones"; });
        headRow.appendChild(btn);
      }
      const dates = el("div.spark-dates", {}, [el("span", { text: fmtShort(points[0].date) }), el("span", { text: fmtShort(points[points.length - 1].date) })]);
      wrap.appendChild(headRow); wrap.appendChild(svg); wrap.appendChild(dates);

      const show = (i) => {
        i = Math.max(0, Math.min(points.length - 1, i));
        const p = points[i], cat = catFromBands(p.v, bands), color = cat && SCORE_COLORS[cat] ? SCORE_COLORS[cat] : "var(--text)";
        readout.textContent = `${fmtShort(p.date)}: ${fmtNum(p.v)}`;
        readout.style.color = color;
        const x = xAt(i);
        marker.setAttribute("x1", x); marker.setAttribute("x2", x); marker.setAttribute("opacity", 0.35);
        adot.setAttribute("cx", x); adot.setAttribute("cy", yAt(p.v)); adot.setAttribute("fill", color); adot.setAttribute("opacity", 1);
      };
      const idxFromEvent = (e) => { const rc = svg.getBoundingClientRect(); const px = ((e.clientX - rc.left) / (rc.width || 1)) * W; return Math.round(((px - padL) / innerW) * (points.length - 1)); };
      let active = false;
      svg.addEventListener("pointerdown", (e) => { active = true; try { svg.setPointerCapture(e.pointerId); } catch (_) {} show(idxFromEvent(e)); });
      svg.addEventListener("pointermove", (e) => { if (active) show(idxFromEvent(e)); });
      const end = () => { active = false; };
      svg.addEventListener("pointerup", end); svg.addEventListener("pointercancel", end);
      show(points.length - 1);
      return wrap;
    }

    const hexA = (hex, a) => { const m = /^#?([0-9a-f]{6})$/i.exec(hex); if (!m) return hex; const n = parseInt(m[1], 16); return `rgba(${(n >> 16) & 255},${(n >> 8) & 255},${n & 255},${a})`; };
    // Parent section card; metric cards are nested inside it.
    function sumCard(title) {
      const c = el("div.sum-card");
      if (title) c.appendChild(el("div.sum-card-title", { text: title }));
      return c;
    }
    // Colored "hero" header tinted by the rating, with a solid rating chip.
    function heroCard(o) {
      const color = SCORE_COLORS[o.cat] || "#9aa0a6";
      const hero = el("div.sum-hero");
      hero.style.background = hexA(color, 0.15);
      hero.style.borderColor = hexA(color, 0.45);
      if (o.cat) { const rt = el("span.sum-hero-rating", { text: GRADE_LABEL[o.cat] || "" }); rt.style.background = color; hero.appendChild(rt); }
      if (o.label) hero.appendChild(el("div.sum-hero-label", { text: o.label }));
      hero.appendChild(el("div.sum-hero-score", {}, [
        el("span.sum-hero-num", { text: o.big != null && o.big !== "" ? String(o.big) : "-" }),
        o.den ? el("span.sum-hero-den", { text: o.den }) : null,
      ]));
      if (o.sub) hero.appendChild(el("div.sum-hero-sub", { text: o.sub }));
      if (o.tip) hero.appendChild(el("div.sum-hero-tip", { text: o.tip }));
      return hero;
    }

    function openReadingSummary(r) {
      const def = READING_TYPES[r.type];
      openModal((body) => {
        body.appendChild(el("h2", { text: def.label }));
        body.appendChild(el("div.sum-meta", { text: r.time ? fmtTime12(r.time) : "" }));
        if (r.type === "breathHrv") breathingSummary(r, body);
        else if (r.type === "bp") bpSummary(r, body);
        else if (r.type === "ecg") ecgSummary(r, body);
        else if (r.type === "restingHr") restingHrSummary(r, body);
        else if (r.type === "bloodO2") bloodO2Summary(r, body);
        else if (r.type === "hrv") unstructuredHrvSummary(r, body);
        else if (r.type === "orthostatic") orthostaticSummary(r, body);
        else genericReadingSummary(r, body);
      }, { action: { icon: ICONS.edit, label: "Edit", onclick: () => readingForm(r.type, r) } });
    }

    function genericReadingSummary(r, body) {
      const def = READING_TYPES[r.type];
      const s = computeScores(r);
      const rv = readingRowValue(r);
      if (r.type === "weight") {
        const bmi = bmiFor(r.weight);
        const z = bmi != null ? bmiZone(bmi) : null;
        const verdict = {
          Underweight: "Below the healthy BMI range.",
          Healthy: "Weight is in the healthy BMI range.",
          Overweight: "Above the healthy BMI range.",
          Obese: "Well above the healthy BMI range.",
        };
        body.appendChild(heroCard({
          cat: rowScoreCategory(r),
          label: "Weight",
          big: (r.weight != null && r.weight !== "") ? r.weight : "",
          den: "lbs",
          sub: z ? `BMI ${bmi.toFixed(1)} · ${z.zone}` : "Set your height in Profile for BMI",
          tip: z ? (verdict[z.zone] || "") : "",
        }));
      } else {
        body.appendChild(heroCard({ cat: rowScoreCategory(r), big: typeof rv === "string" ? rv : "", label: "Result" }));
      }
      const card = sumCard("Details");
      entryFields(def).forEach((f) => {
        if (isDivider(f) || f.type === "time") return;
        if (f.type === "check") { card.appendChild(metricRow(f.label, r[f.key] ? "Yes" : "No", r[f.key] ? (f.key === "sinus" ? "great" : "bad") : null)); return; }
        if (f.type === "textarea") {
          if (r[f.key]) card.appendChild(el("div.metric-card", {}, [el("div.metric-name", { text: f.label }), el("div.sum-text", { text: r[f.key] })]));
          return;
        }
        const v = r[f.key];
        if (v == null || v === "") return;
        const spark = buildSpark(metricHistory(r.type, numEx(f.key)), bandsFor(r.type, f.key));
        card.appendChild(metricRow(f.label, v + (f.unit ? ` ${f.unit}` : ""), s[f.key], null, spark));
      });
      if (r.type === "weight") {
        const bmi = bmiFor(r.weight);
        if (bmi != null) {
          const z = bmiZone(bmi);
          card.appendChild(metricRow("BMI", bmi.toFixed(1) + " · " + z.zone, z.cat, "Body Mass Index from this weight and the height set in Profile. Zones: under 18.5 underweight, 18.5–24.9 healthy, 25–29.9 overweight, 30+ obese.", null));
        } else {
          card.appendChild(metricRow("BMI", "—", null, "Set your height in Profile to grade weight by BMI.", null));
        }
      }
      body.appendChild(card);
    }

    // Orthostatic event: rated on the standing HR rise (POTS-style zones), with
    // begin/peak values side by side, a sparked HR-increase card, the recorded
    // 1-minute HR, and a sparked recovery (peak − 1 min) card.
    function orthostaticSummary(r, body) {
      const before = numOr(r.beforeHr), after = numOr(r.afterHr), min1 = numOr(r.hr1min);
      const increase = (before != null && after != null) ? after - before : null;
      const drop = (after != null && min1 != null) ? after - min1 : null;
      const incCat = increase != null ? catFromBands(increase, BANDS.orthoIncrease) : null;
      const dropCat = drop != null ? catFromBands(drop, BANDS.orthoRecovery) : null;
      const signed = (v) => (v > 0 ? "+" + v : String(v));

      const verdict = {
        great: "Minimal heart-rate rise on standing — a healthy orthostatic response.",
        good: "Normal orthostatic rise, within the expected physiologic range.",
        ok: "Borderline rise at the upper end of normal. Worth keeping an eye on.",
        bad: "Large rise — at or above the adult ≥30 bpm POTS-range threshold. Note context like hydration, heat, deconditioning, or meds.",
        concerning: "Marked rise — at or above the ≥40 bpm threshold. Hydrate, sit or lie down, and log the surrounding context.",
      };
      body.appendChild(heroCard({
        cat: incCat,
        label: r.transition || "Orthostatic event",
        big: increase != null ? signed(increase) : "",
        den: "bpm rise",
        sub: "Rated on the heart-rate increase from baseline to standing.",
        tip: incCat ? verdict[incCat] : "Enter Before HR and After HR to rate this event.",
      }));

      // Begin / peak HR side by side — plain values, no spark.
      const hrCard = sumCard("Heart rate");
      hrCard.appendChild(el("div.ortho-duo", {}, [
        el("div.ortho-stat", {}, [
          el("div.ortho-stat-label", { text: "Before HR" }),
          el("div.ortho-stat-val", { text: before != null ? String(before) : "-" }),
          el("div.ortho-stat-unit", { text: "bpm · baseline" }),
        ]),
        el("div.ortho-stat", {}, [
          el("div.ortho-stat-label", { text: "After HR" }),
          el("div.ortho-stat-val", { text: after != null ? String(after) : "-" }),
          el("div.ortho-stat-unit", { text: "bpm · standing" }),
        ]),
      ]));
      body.appendChild(hrCard);

      // HR increase — sparkline with zones; this is what rates the event.
      const incEx = (rr) => { const b = numOr(rr.beforeHr), a = numOr(rr.afterHr); return (b != null && a != null) ? a - b : null; };
      const incCard = sumCard("HR increase");
      incCard.appendChild(metricRow("Standing HR increase", increase != null ? signed(increase) + " bpm" : "", incCat,
        "After HR minus Before HR. A sustained rise of 30+ bpm (40+ in teens) within 10 minutes of standing is the POTS threshold; a 10–20 bpm rise is a normal response.",
        buildSpark(metricHistory("orthostatic", incEx), BANDS.orthoIncrease)));
      body.appendChild(incCard);

      // Recovery: the recorded 1-minute HR (plain), then the drop from peak (spark + zones).
      const dropEx = (rr) => { const a = numOr(rr.afterHr), m = numOr(rr.hr1min); return (a != null && m != null) ? a - m : null; };
      const recCard = sumCard("Recovery after 1 minute");
      recCard.appendChild(metricRow("HR after 1 min", min1 != null ? min1 + " bpm" : "", false,
        "Heart rate one minute after standing, as recorded. As blood pressure rebounds a healthy response settles back toward baseline.", false));
      recCard.appendChild(metricRow("HR drop by 1 min", drop != null ? drop + " bpm" : "", dropCat,
        "How far HR fell from its standing peak after one minute (Peak − HR@1min). A larger settle-down means stronger baroreflex and vagal recovery; little or no drop — or a further climb — points to an attenuated, dysautonomic response.",
        buildSpark(metricHistory("orthostatic", dropEx), BANDS.orthoRecovery)));
      body.appendChild(recCard);

      notesCard(r, body);
    }

    const HRV_EXPLAIN = {
      rmssd: "Beat-to-beat parasympathetic activity - your most reliable vagal-tone indicator.",
      pnn50: "Percent of successive beats differing by 50ms+. Sensitive parasympathetic depth.",
      sdnn: "Overall heart-rate variability. Reflects total autonomic activity.",
      hr: "Beats per minute during the reading. Lower usually means more vagal dominance.",
      meanRr: "Average milliseconds between beats (inverse of HR).",
      mxdmn: "Longest minus shortest RR interval - the range of variability.",
      mode: "Most common RR interval - a stability indicator.",
      amo50: "Stress-index marker. Higher suggests sympathetic dominance.",
      cv: "Relative variability. Higher is generally better.",
      coherence: "Synchronization of heart rhythm with breathing - reflects vagal training.",
    };
    const CAT_POINTS = { great: 90, good: 75, ok: 55, bad: 38, crash: 18, concerning: 18, warning: 72 };

    function breathingSummary(r, body) {
      const s = computeScores(r);
      const n = (k) => { const x = parseFloat(r[k]); return isNaN(x) ? null : x; };
      const vlf = n("vlowPower"), lf = n("lowPower"), hf = n("highPower");
      const total = [vlf, lf, hf].some((v) => v != null) ? [vlf, lf, hf].reduce((a, b) => a + (b || 0), 0) : null;
      const lfhf = lf != null && hf ? lf / hf : null;
      const sp = (ex, bands) => buildSpark(metricHistory("breathHrv", ex, 15), bands);
      const lfhfEx = (rr) => { const a = parseFloat(rr.lowPower), b = parseFloat(rr.highPower); return (!isNaN(a) && !isNaN(b) && b !== 0) ? a / b : null; };

      // Hero: autonomic composite colored by overall rating
      const overall = worstCat([s.rmssd, s.pnn50, s.totalPower].filter(Boolean));
      const verdict = {
        great: "Strong parasympathetic reserves today. Fine for your normal protocol or intervals.",
        good: "Solid recovery state. Easy to normal activity is reasonable.",
        ok: "Moderate reserves. Keep it easy and avoid pushing.",
        bad: "Low reserves. Favor rest and gentle activity today.",
        crash: "Very low reserves. Prioritize rest and recovery.",
      };
      const weights = { rmssd: 25, pnn50: 15, totalPower: 15, lfPeak: 20, hfPeak: 15, lfhf: 10 };
      let sum = 0, wsum = 0;
      Object.keys(weights).forEach((k) => { const c = s[k]; if (c && CAT_POINTS[c] != null) { sum += CAT_POINTS[c] * weights[k]; wsum += weights[k]; } });
      body.appendChild(heroCard({
        cat: overall,
        label: "Autonomic score",
        big: wsum ? Math.round(sum / wsum) : "-",
        den: wsum ? "/100" : "",
        sub: "Composite of vagal tone, power, and baroreflex position.",
        tip: verdict[overall] || "",
      }));

      // Details
      const bq = sumCard("Details");
      bq.appendChild(metricRow("Coherence", r.coherence, false, HRV_EXPLAIN.coherence));
      if (r.style) bq.appendChild(metricRow("Breathing style", r.style, false, "Intended pace for this reading."));
      if (r.period) bq.appendChild(metricRow("Reading type", r.period, false));
      bq.appendChild(metricRow("Swallowing", r.swallowing ? "Yes" : "No", false));
      body.appendChild(bq);

      // Power (frequency peaks folded in, below HF power)
      const pc = sumCard("Power");
      if (total) {
        const pct = (x) => Math.round(((x || 0) / total) * 100);
        const bar = el("div.powerbar");
        const seg = (v, color, lab) => { if (v == null) return; const p = pct(v); const d = el("div", { style: `width:${p}%;background:${color}` }); if (p >= 12) d.textContent = `${lab} ${p}%`; bar.appendChild(d); };
        seg(vlf, "#f59e0b", "VLF"); seg(lf, "#6366f1", "LF"); seg(hf, "#22c55e", "HF");
        pc.appendChild(el("div.metric-card", {}, [bar, el("div.sum-legend", { text: `VLF ${pct(vlf)}% · LF ${pct(lf)}% · HF ${pct(hf)}%` })]));
      }
      pc.appendChild(metricRow("Total power", total != null ? Math.round(total) : "", s.totalPower, "Total autonomic engagement across all frequencies.", sp((rr) => totalPower(rr), BANDS.totalPower)));
      pc.appendChild(metricRow("LF/HF ratio", lfhf != null ? lfhf.toFixed(2) : "", s.lfhf, "Sympathetic vs vagal balance. Balanced or low favors flexibility.", sp(lfhfEx, BANDS.lfhf)));
      pc.appendChild(metricRow("VLF power", r.vlowPower, s.vlf, "Slow regulatory processes and stress load. Elevated means system stress.", sp(numEx("vlowPower"), BANDS.vlf)));
      pc.appendChild(metricRow("LF power", r.lowPower, null, "Baroreflex band, your training target.", sp(numEx("lowPower"), null)));
      pc.appendChild(metricRow("HF power", r.highPower, null, "Vagal activity tied to breathing. Higher means better recovery state.", sp(numEx("highPower"), null)));
      pc.appendChild(metricRow("LF peak", r.lfPeak ? r.lfPeak + " Hz" : "", s.lfPeak,
        "Baroreflex frequency. Target 0.08 to 0.10 Hz; shifting toward it is progress.", sp(numEx("lfPeak"), BANDS.lfPeak)));
      const e = expectedHf(r.style);
      pc.appendChild(metricRow("HF peak", r.hfPeak ? r.hfPeak + " Hz" : "", s.hfPeak,
        e ? `Expected about ${e[0]} to ${e[1]} Hz for ${r.style} breathing; large deviation means the pace drifted.` : "Respiratory peak position.", sp(numEx("hfPeak"), null)));
      body.appendChild(pc);

      // Metrics
      const mc = sumCard("Metrics");
      mc.appendChild(metricRow("RMSSD", r.rmssd, s.rmssd, HRV_EXPLAIN.rmssd, sp(numEx("rmssd"), BANDS.rmssdS)));
      mc.appendChild(metricRow("pNN50", r.pnn50 ? r.pnn50 + "%" : "", s.pnn50, HRV_EXPLAIN.pnn50, sp(numEx("pnn50"), BANDS.pnn50)));
      mc.appendChild(metricRow("SDNN", r.sdnn, s.sdnn, HRV_EXPLAIN.sdnn, sp(numEx("sdnn"), BANDS.sdnn)));
      mc.appendChild(metricRow("HR", r.hr, s.hr, HRV_EXPLAIN.hr, sp(numEx("hr"), BANDS.hrBreath)));
      mc.appendChild(metricRow("Mean RR", r.meanRr, s.meanRr, HRV_EXPLAIN.meanRr, sp(numEx("meanRr"), BANDS.rrMode)));
      mc.appendChild(metricRow("MxDMn", r.mxdmn, s.mxdmn, HRV_EXPLAIN.mxdmn, sp(numEx("mxdmn"), BANDS.mxdmn)));
      mc.appendChild(metricRow("Mode", r.mode, s.mode, HRV_EXPLAIN.mode, sp(numEx("mode"), BANDS.rrMode)));
      mc.appendChild(metricRow("AMo50", r.amo50, s.amo50, HRV_EXPLAIN.amo50, sp(numEx("amo50"), BANDS.amo50)));
      mc.appendChild(metricRow("CV", r.cv, s.cv, HRV_EXPLAIN.cv, sp(numEx("cv"), BANDS.cv)));
      body.appendChild(mc);

      if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); body.appendChild(nc); }
    }

    // Derived blood-pressure metrics (from systolic, diastolic, pulse).
    const bpMap = (rr) => { const s = +rr.sys, d = +rr.dia; return (!isNaN(s) && !isNaN(d)) ? (s + 2 * d) / 3 : null; };
    const bpPP = (rr) => { const s = +rr.sys, d = +rr.dia; return (!isNaN(s) && !isNaN(d)) ? s - d : null; };
    const bpKerdo = (rr) => { const d = +rr.dia, p = +rr.pulse; return (!isNaN(d) && !isNaN(p) && p) ? (1 - d / p) * 100 : null; };
    const bpRobinson = (rr) => { const s = +rr.sys, p = +rr.pulse; return (!isNaN(s) && !isNaN(p)) ? (s * p) / 100 : null; };
    const bpKvas = (rr) => { const s = +rr.sys, d = +rr.dia, p = +rr.pulse; const pp = s - d; return (!isNaN(p) && pp > 0) ? (10 * p) / pp : null; };
    const bpBce = (rr) => { const s = +rr.sys, d = +rr.dia, p = +rr.pulse; return (!isNaN(s) && !isNaN(d) && !isNaN(p)) ? (s - d) * p : null; };

    function bpSummary(r, body) {
      const s = computeScores(r);
      const cat = rowScoreCategory(r);
      const verdict = {
        great: "Pressure is in a healthy range.",
        good: "Pressure is reasonable today.",
        ok: "Slightly outside your ideal range; keep an eye on it.",
        bad: "Out of range; note context like salt, fluids, meds, or stress.",
        concerning: "Well outside range; consider rechecking and noting context.",
      };
      body.appendChild(heroCard({
        cat, label: "Blood pressure",
        big: r.sys || r.dia ? `${r.sys || "-"}/${r.dia || "-"}` : "",
        sub: "Systolic / diastolic", tip: verdict[cat] || "",
      }));

      // value + grade + spark for a derived metric
      const stat = (label, ex, bands, explain) => {
        const v = ex(r);
        const c = (v != null && bands) ? catFromBands(v, bands) : null;
        return metricRow(label, v != null ? fmtNum(v) : "", c, explain, buildSpark(metricHistory("bp", ex), bands));
      };

      const det = sumCard("Details");
      det.appendChild(metricRow("Systolic", r.sys, s.sys, "Peak arterial pressure during a heartbeat.", buildSpark(metricHistory("bp", numEx("sys")), BANDS.sys)));
      det.appendChild(metricRow("Diastolic", r.dia, s.dia, "Arterial pressure between beats.", buildSpark(metricHistory("bp", numEx("dia")), BANDS.dia)));
      det.appendChild(metricRow("Pulse", r.pulse, false, "Heart rate at the time of the reading.", buildSpark(metricHistory("bp", numEx("pulse")), null)));
      if (r.period) det.appendChild(metricRow("Reading type", r.period, false));
      body.appendChild(det);

      const ps = sumCard("Pressure statistics");
      ps.appendChild(stat("Mean arterial pressure", bpMap, BANDS.map, "Average pressure perfusing your organs and brain. Low MAP drives lightheadedness and poor cerebral perfusion in dysautonomia; very high strains the system."));
      ps.appendChild(stat("Pulse pressure", bpPP, BANDS.pp, "Gap between systolic and diastolic. Low (under 30) suggests low stroke volume or dehydration; high (over 60) suggests arterial stiffness."));
      body.appendChild(ps);

      const ix = sumCard("Indexes");
      ix.appendChild(stat("Kerdo index", bpKerdo, BANDS.kerdo, "Autonomic balance from pulse and diastolic. Positive means sympathetic dominance, negative means parasympathetic; near zero is balanced."));
      ix.appendChild(stat("Robinson index", bpRobinson, BANDS.robinson, "Double product (systolic x pulse / 100): myocardial oxygen demand and cardiac workload at rest. Lower is more efficient."));
      ix.appendChild(stat("BCE index", bpBce, BANDS.bce, "Blood-circulation economy (pulse pressure x pulse). Higher values mean a less economical, more strained circulation."));
      ix.appendChild(stat("Kvas coefficient", bpKvas, BANDS.kvas, "Coefficient of endurance (10 x pulse / pulse pressure). Around 16 is typical; higher suggests cardiovascular fatigue, lower suggests stronger conditioning."));
      body.appendChild(ix);

      if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); body.appendChild(nc); }
    }

    function ecgSummary(r, body) {
      const s = computeScores(r);
      const verdict = {
        great: "Clean reading - normal intervals and rhythm.",
        good: "Largely normal intervals and rhythm.",
        ok: "Minor findings worth monitoring.",
        bad: "Abnormal findings; review context.",
        concerning: "Significant findings; consider clinical follow-up.",
      };
      body.appendChild(heroCard({ cat: s.overall, label: "ECG", big: ecgPattern(r), sub: "Rhythm", tip: verdict[s.overall] || "" }));

      const spk = (key, bands) => buildSpark(metricHistory("ecg", numEx(key)), bands);

      // Rhythm (its own container)
      const rhy = sumCard("Rhythm");
      rhy.appendChild(metricRow("Pattern", ecgPattern(r), s.rhythm, "Recorded rhythm. Sinus is normal; SVT or any other pattern is flagged."));
      rhy.appendChild(metricRow("Ectopic beats", r.ectopic, s.ectopic, "Extra beats in the reading. A few are common; many, or runs, are concerning.", spk("ectopic", BANDS.ectopic)));
      body.appendChild(rhy);

      // Intervals (its own container)
      const iv = sumCard("Intervals");
      iv.appendChild(metricRow("QRS", r.qrs, s.qrs, "Ventricular depolarization time. A wide QRS can indicate a conduction delay.", spk("qrs", BANDS.qrs)));
      iv.appendChild(metricRow("QTc", r.qtc, s.qtc, "Heart-rate-corrected QT. Prolongation raises arrhythmia risk; very short is also abnormal.", spk("qtc", qtcBands(state.profile && state.profile.sex))));
      iv.appendChild(metricRow("PR", r.pr, s.pr, "AV conduction time from atria to ventricles.", spk("pr", BANDS.pr)));
      body.appendChild(iv);

      // Rate & variability
      const rate = sumCard("Rate & variability");
      const hrCat = r.hr !== "" && r.hr != null ? catFromBands(+r.hr, BANDS.hrBreath) : null;
      rate.appendChild(metricRow("HR", r.hr, hrCat, "Heart rate during the ECG.", spk("hr", BANDS.hrBreath)));
      rate.appendChild(metricRow("HRV", r.hrv, s.hrv, "Heart-rate variability captured by the ECG (SDNN-style).", spk("hrv", BANDS.ecgHrv)));
      body.appendChild(rate);

      if (r.note) { const nc = sumCard("Notes"); nc.appendChild(el("div.metric-card", {}, [el("div.sum-text", { text: r.note })])); body.appendChild(nc); }
