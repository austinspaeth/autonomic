          ["14 consecutive clean days", () => msConsec(md, (d) => d.clean, 14)],
          ["21 consecutive clean days", () => msConsec(md, (d) => d.clean, 21)],
          ["30 consecutive clean days", () => msConsec(md, (d) => d.clean, 30)],
          ["60 consecutive clean days", () => msConsec(md, (d) => d.clean, 60)],
          ["90 consecutive clean days", () => msConsec(md, (d) => d.clean, 90)],
          ["50% clean days in a month", () => msCleanRate(md, 50)],
          ["70% clean days in a month", () => msCleanRate(md, 70)],
          ["85% clean days in a month", () => msCleanRate(md, 85)],
          ["90%+ clean days in a month", () => msCleanRate(md, 90)],
        ]],
        ["Autonomic score", [
          ["First Autonomic Score 70+", firstV("score", (d) => d.score != null && d.score >= 70)],
          ["First Autonomic Score 80+", firstV("score", (d) => d.score != null && d.score >= 80)],
          ["First Autonomic Score 90+", firstV("score", (d) => d.score != null && d.score >= 90)],
          ["7-day average score 70+", () => msRollAvg(md, (d) => d.score, 7, 70, "up")],
          ["30-day average score 70+", () => msRollAvg(md, (d) => d.score, 30, 70, "up")],
          ["7 consecutive Good-or-Great days", consec((d) => d.score != null && d.score >= 70, 7)],
          ["Month without any Bad days", () => msNoneIn(md, 30, (d) => d.score != null && d.score < 40)],
          ["Month without any Crash days", () => msNoneIn(md, 30, (d) => d.score != null && d.score < 25)],
        ]],
        ["Gut & symptoms", [
          ["7 consecutive days with a bowel movement", consec((d) => d.bm >= 1, 7)],

          ["30 days never missing Allegra", consec((d) => d.medsSet.has("allegra"), 30)],
          ["30 days never missing Pepcid", consec((d) => d.medsSet.has("pepsidAc"), 30)],
          ["30 days never missing magnesium", consec((d) => d.medsSet.has("magGlycinate") || d.medsSet.has("magCitrate"), 30)],
          ["90 days full medication adherence", consec((d) => d.medsSet.has("allegra") && d.medsSet.has("pepsidAc") && d.medsSet.has("magGlycinate"), 90)],
          ["30 days dinner before 5pm every day", consec((d) => d.dinnerBy5, 30)],
          ["30 days hydration target hit daily", consec((d) => d.waterGood, 30)],
        ]],
        ["Composite recovery", [
          ["7 consecutive days: RMSSD 27+, lying HR <70, walk <85, no symptoms", consec((d) => d.rmssd != null && d.rmssd >= 27 && (d.restHrLay == null || d.restHrLay < 70) && (d.walkHr == null || d.walkHr < 85) && d.symptomFree, 7)],
          ["Full recovery: 30 days RMSSD 30+ avg, no crash, 80%+ clean", () => msFullRecovery(md)],
        ]],
      ];
      // Recovery-phase time milestones, only if illness logged
      const eps = acIllnessEpisodes();
      if (eps.length) {
        const ep = eps[eps.length - 1], sinceEnd = acDayDiff(ep.end, keyOf(new Date()));
        const dateAt = (n) => { const d = dateFromKey(ep.end); d.setDate(d.getDate() + n); return sinceEnd >= n ? keyOf(d) : null; };
        defs.unshift(["Recovery phase", [
          ["30 days post major illness", () => dateAt(30)],
          ["60 days post major illness", () => dateAt(60)],
          ["90 days post major illness", () => dateAt(90)],
        ]]);
      }
      return defs.map(([title, items]) => ({ title, items: items.map(([label, fn]) => { const res = fn(); const date = res && typeof res === "object" ? res.date : res; const value = res && typeof res === "object" ? res.value : null; return { label, done: !!date, date, value }; }) }));
    }

    function acRegressionWarnings(md) {
      const recent = md.keys.slice(-5).map((k) => md.map[k]); if (recent.length < 2) return [];
      const warns = [];
      const rs = recent.filter((d) => d.rmssd != null).slice(-3);
      if (rs.length === 3 && rs[0].rmssd > rs[1].rmssd && rs[1].rmssd > rs[2].rmssd) warns.push("RMSSD has declined three readings in a row.");
      const ss = recent.filter((d) => d.score != null).slice(-2);
      if (ss.length === 2 && ss.every((d) => d.score < 40)) warns.push("Two consecutive low-score days — load may be accumulating.");
      const sl = recent.filter((d) => d.sleepH != null).slice(-1)[0];
      if (sl && sl.sleepH < 6) warns.push(`Last logged night was ${fmtNum(roundTo(sl.sleepH, 1))}h — under 6 hours.`);
      const vl = recent.filter((d) => d.vlf != null).slice(-1)[0];
      if (vl && vl.vlf > 700) warns.push("VLF power is elevated (>700) — rising sympathetic load.");
      const lf = recent.filter((d) => d.lfPeak != null).slice(-2);
      if (lf.length === 2 && lf[1].lfPeak < lf[0].lfPeak - 0.005) warns.push("LF peak shifted to a lower frequency vs the prior reading.");
      return warns;
    }

    function acMilestones() {
      const md = acMilestoneDays(); if (!md.keys.length) return null;
      const groups = buildMilestoneGroups(md);
      let done = 0, total = 0; groups.forEach((g) => g.items.forEach((it) => { total++; if (it.done) done++; }));
      if (!total) return null;
      const wrap = el("div");
      // Header card: title + subtext, with a slim progress bar pinned to the
      // bottom edge of the card (the card clips it to its rounded corners).
      const pct = total ? Math.round((done / total) * 100) : 0;
      const header = acCard("Milestone Tracker", `${done} of ${total} achieved · progress beyond daily metrics`, [
        el("div.ms-progress", { style: "height:4px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:14px" }, [
          el("i", { style: `display:block;height:100%;background:var(--accent);width:${pct}%` }),
        ]),
      ]);
      wrap.appendChild(header);
      // Active watch flags now surface via the header caution icon + drawer
      // (renderHeaderFlags / openFlagsDrawer), not as a card here.
      groups.forEach((g) => {
        if (!g.items.length) return;
        const rows = g.items.slice().sort((a, b) => (b.done ? 1 : 0) - (a.done ? 1 : 0) || (a.date || "").localeCompare(b.date || ""));
        const list = el("div.ac-ms-list", {}, rows.map((it) => el("div.ac-ms-row" + (it.done ? ".done" : ""), {}, [
          el("span.ac-ms-ic", it.done ? { html: ICONS.check } : { text: "" }),
          el("div.ac-ms-label", { text: it.label }),
          el("div.ac-ms-meta", { text: it.done ? ((it.value != null ? (typeof it.value === "number" ? fmtNum(it.value) : it.value) + " · " : "") + fmtShort(it.date)) : "" }),
        ])));
        const gdone = g.items.filter((it) => it.done).length;
        wrap.appendChild(acCard(g.title, `${gdone} of ${g.items.length} achieved`, [list]));
      });
      return wrap;
    }

    // Active watch flags surface in the header (gold caution icon) rather than
    // in the milestones view. The icon only appears when flags are active and
    // opens a drawer listing them.
    function activeFlags() {
      const md = acMilestoneDays();
      if (!md || !md.keys.length) return [];
      return acRegressionWarnings(md);
    }

    function renderMilestones() {

    function renderAnalysis() {
      const root = $("#analysisContent");
      root.innerHTML = "";
      const content = el("div");
      // Reuse the shared segmented control (same one Insights uses); its pill
      // tweens from the current option because only the thumb is transformed and
      // the content re-renders on the next frame rather than rebuilding the pill.
      root.appendChild(segmented(
        [{ val: "day", label: "Day" }, { val: "week", label: "Week" }, { val: "month", label: "Month" }, { val: "year", label: "Year" }],
        analysisMode,

      // Categories: each is a card in the grid; tapping one slides its sections

            () => acSubjective(buckets), () => acCleanDays(), () => acStreakAnalytics(), () => acAdherence(buckets), () => acInterventionImpact(), () => acCorrelations()] },

      const grid = el("div.ac-cat-grid", {}, CATS.map((c) =>

      root.appendChild(el("div.ac-nav", {}, [track]));
      analysisEls = { track, detail, cats: CATS, safe };

      function buildDetail(catId, animate) {
        const cat = CATS.find((c) => c.id === catId); if (!cat) return;
        detail.innerHTML = "";
        detail.appendChild(el("div.ac-detail-head", {}, [
          el("button.icon-btn.ac-back-btn", { type: "button", html: ICONS.arrowLeft, "aria-label": "Back to categories", onclick: goBack }),
          el("div.ac-detail-title", { text: cat.title }),
        ]));
        const built = cat.sections.map(safe).filter(Boolean);
        if (built.length) built.forEach((c) => detail.appendChild(c));

        analysisCat = catId;
        if (animate) {
          requestAnimationFrame(() => track.classList.add("show-detail"));

          track.classList.add("no-anim", "show-detail");
          requestAnimationFrame(() => { void track.offsetWidth; track.classList.remove("no-anim"); });
        }
      }
      function openCat(catId) { buildDetail(catId, true); }
      function goBack() {
        analysisCat = null;
        track.classList.remove("show-detail");
        setTimeout(() => { if (!analysisCat) detail.innerHTML = ""; }, 340);
      }

      // Re-entering the same category after a range/view change keeps you in place.
      if (analysisCat && CATS.some((c) => c.id === analysisCat)) buildDetail(analysisCat, false);
      else analysisCat = null;

    /* ---------------- AI Insights (Reports) ----------------
       Builds a customized analysis prompt from the user's data over a chosen
       time range that they can paste into Claude or ChatGPT. Pure text
       generation — no network, no AI runs here. */

    // Which MED_TYPES count as "medications" vs "supplements" for prompt grouping.
    const MED_KEYS = new Set(["allegra", "pepsidAc", "gaviscon", "melatonin"]);

    // Value getter: returns null for missing/empty so we can render "-".
    const rv = (o, k) => {
      if (!o) return null;
      const x = o[k];
      return x === undefined || x === null || x === "" ? null : x;
    };
    const stamp = (k, t) => `[${k}${t ? " " + fmtTime12(t) : ""}]`;
    const noteSuffix = (r) => (r && r.note ? ` | Note: ${r.note}` : "");

    // Resolve the selected range into the list of day-keys and a human label.
    function reportDateRange(range) {
      const todayKey = keyOf(new Date());
      const longFmt = (k) =>
        dateFromKey(k).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });

      const span = range === "week" ? 7 : range === "month" ? 30 : 365;
      const start = new Date();

    // Count loggable entries across the days (used for empty/sparse detection).
    function entryCount(keys) {
      let n = 0;

        n += ((d.food && d.food.meals) || []).length;
        if (d.food && d.food.triggers) n += Object.values(d.food.triggers).filter((v) => v > 0).length;
        n += ((d.digestion && d.digestion.movements) || []).length;
        if (d.sleep && (d.sleep.bed || d.sleep.wake)) n += 1;
      });

    const hasAnyData = (keys) => entryCount(keys) > 0;

    // Walk every present day, collecting lines via pick(day, key) -> string[].
    function eachEntry(keys, pick) {
      const out = [];
      keys.forEach((k) => {

    function secHRV(keys) {

    // Build a prompt covering one or more report cards. A single card produces
    // a focused prompt; multiple cards are stitched into one combined report —
    // a shared data block (the union of every selected card's sections, each
    // rendered once) followed by a per-area focus section, so the user gets
    // exactly the analyses they picked without duplicated data dumps.
    function buildPrompt(cards) {
      const { keys: allKeys, rangeText } = reportDateRange(reportRange);
      const keys = allKeys.filter((k) => state.days[k]).sort();
      const header = universalHeader(rangeText);
      const sparse = hasAnyData(keys) && entryCount(keys) < 4
        ? "\n\nNOTE: Limited data available for this period — analysis may be less comprehensive.\n"
        : "";

      if (cards.length === 1) {
        const card = cards[0];
        let body = `FOCUS: ${card.focus}`;
        if (card.context) body += `\n\n${card.context}`;
        body += `\n\nDATA FOR PERIOD:\n\n${renderSections(keys, card.sections)}`;
        if (card.instructions) body += `\n\n${card.instructions}`;
        return `${header}${sparse}\n\n${body}`;
      }

      // Union of all sections, each rendered once (preserves first-seen order).
      const sectionKeys = [];
      cards.forEach((c) => c.sections.forEach((s) => { if (!sectionKeys.includes(s)) sectionKeys.push(s); }));
      const titles = cards.map((c) => c.title);
      const intro = `This is a CUSTOM, MULTI-PART report the user assembled, covering ${cards.length} focus areas:
${titles.map((t, i) => `${i + 1}. ${t}`).join("\n")}

Address each focus area as its own clearly-labeled top-level section in your response, in the order listed, using the titles above as headings. Within each section, follow the response structure described above (Analysis, Trends Identified, Recovery Position, Projections, Recommendations, Citations) where relevant to that area. The shared data below covers all areas — the same data point may inform more than one. Don't repeat identical analysis across sections; cross-reference instead. End with a brief integrated summary that ties the focus areas together.`;
      const data = `SHARED DATA FOR PERIOD (covers every focus area below):\n\n${renderSections(keys, sectionKeys)}`;
      const focusBlocks = cards.map((c, i) => {
        let b = `=== ${i + 1}. ${c.title.toUpperCase()} ===\nFOCUS: ${c.focus}`;
        if (c.context) b += `\n\n${c.context}`;
        if (c.instructions) b += `\n\nANALYSIS REQUESTED:\n${c.instructions}`;
        return b;
      }).join("\n\n");
      return `${header}${sparse}\n\n${intro}\n\n${data}\n\nFOCUS AREAS:\n\n${focusBlocks}`;
    }

    /* ----- Reports view rendering & interaction ----- */
    function renderReports() {
      const root = $("#reportsContent");
      root.innerHTML = "";
      root.appendChild(segmented(
        [{ val: "day", label: "Day" }, { val: "week", label: "Week" }, { val: "month", label: "Month" }, { val: "year", label: "Year" }],
        reportRange,
        (v) => { reportRange = v; }
      ));
      const grid = el("div.report-grid");
      REPORT_CARDS.forEach((card) => {
        const sel = reportSelected.has(card.id);
        grid.appendChild(el("button.report-card" + (sel ? ".selected" : ""), {
          type: "button",
          "aria-pressed": sel ? "true" : "false",
          "aria-label": card.title,
          "data-id": card.id,
          onclick: () => toggleReport(card.id),
        }, [
          el("span.report-card-check", { html: ICONS.check, "aria-hidden": "true" }),
          el("span.report-card-ico", { html: card.icon, "aria-hidden": "true" }),
          el("div.report-card-title", { text: card.title }),
          el("div.report-card-desc", { text: card.desc }),
        ]));
      });
      root.appendChild(grid);
      updateGenbar();
    }

    function toggleReport(id) {
      if (reportSelected.has(id)) reportSelected.delete(id);
      else reportSelected.add(id);
      const node = document.querySelector(`.report-card[data-id="${id}"]`);
      if (node) {
        const sel = reportSelected.has(id);
        node.classList.toggle("selected", sel);
        node.setAttribute("aria-pressed", sel ? "true" : "false");
      }
      updateGenbar();
    }

    // Show/hide the sliding Generate bar and keep its label in sync.
    function updateGenbar() {
      const bar = $("#reportGenbar");
      const btn = $("#reportGenBtn");
      if (!bar || !btn) return;
      const n = reportSelected.size;
      bar.classList.toggle("show", n > 0);
      btn.textContent = n > 1 ? `Generate Report Prompt (${n})` : "Generate Report Prompt";
    }

    function generateReport() {
      const cards = REPORT_CARDS.filter((c) => reportSelected.has(c.id));
      if (!cards.length) return;
      const { keys: allKeys, rangeText } = reportDateRange(reportRange);
      const keys = allKeys.filter((k) => state.days[k]);
      if (!hasAnyData(keys)) { toast("No data available for this period"); return; }
      const title = cards.length === 1 ? cards[0].title : `Custom Report · ${cards.length} areas`;
      openPromptDrawer(title, rangeText, buildPrompt(cards));
    }

    function openPromptDrawer(title, rangeText, prompt) {
      openModal((body) => {
        body.appendChild(el("h2", { text: title }));
        body.appendChild(el("div.prompt-sub", { text: "Copy this prompt and paste it into Claude or ChatGPT." }));
        body.appendChild(el("div.prompt-meta", { text: `${rangeText} · ${prompt.length.toLocaleString()} characters` }));
        body.appendChild(el("pre.prompt-box", { text: prompt }));
        body.appendChild(el("div.modal-actions", {}, [
          el("button.btn.btn-ghost", { text: "Close", onclick: closeModal }),
          el("button.btn.btn-primary", { text: "Copy prompt", onclick: () => copyText(prompt) }),
        ]));
      });
    }

    function copyText(text) {
      const done = () => toast("Prompt copied to clipboard");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(() => fallbackCopy(text, done));
      } else {
        fallbackCopy(text, done);
      }
    }
    function fallbackCopy(text, done) {
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.top = "0";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        done();
      } catch (e) {
        toast("Copy failed — select the text and copy manually");
      }
    }

    /* ---------------- View switching ---------------- */
    // Move the glass highlight to sit behind the active tab. When animate is
    // false (initial layout / resize) it snaps without the bouncy transition.
    function positionIndicator(animate = true) {
      const bar = $(".tabbar");
      if (!bar) return;
      const ind = bar.querySelector(".tab-indicator");
      const active = bar.querySelector(".tab.active");
      if (!ind || !active) return;
      if (!animate) ind.style.transition = "none";
      ind.style.left = active.offsetLeft + "px";
      ind.style.width = active.offsetWidth + "px";
      if (!animate) { void ind.offsetWidth; ind.style.transition = ""; }
    }

    const VIEW_IDS = { journal: "journalView", analysis: "analysisView", milestones: "milestonesView", reports: "reportsView" };
    function switchView(name) {
      Object.entries(VIEW_IDS).forEach(([n, id]) =>
        $("#" + id).classList.toggle("hidden", n !== name)
      );
      document.querySelectorAll(".tab").forEach((t) =>
        t.classList.toggle("active", t.dataset.view === name)
      );
      positionIndicator();
      renderHeaderFlags();
      // Each view starts scrolled to the top. Set scrollTop directly so the
      // page's smooth-scroll behavior doesn't animate the jump.
      document.documentElement.scrollTop = 0; window.scrollTo(0, 0);
      if (name === "analysis") renderAnalysis();
      if (name === "milestones") renderMilestones();
      if (name === "reports") renderReports();
    }

    /* ---------------- Wire up ---------------- */
    function init() {
      applyTheme();
      renderDate();
      renderDay();
      renderHeaderFlags();

      $("#themeBtn").addEventListener("click", toggleTheme);
      $("#menuBtn").addEventListener("click", openMenu);
      $("#prevDay").addEventListener("click", () => shiftDay(-1));
      $("#nextDay").addEventListener("click", () => shiftDay(1));
      $("#dateLabel").addEventListener("click", openCalendar);
      $("#reportGenBtn").addEventListener("click", generateReport);
      document.querySelectorAll(".tab").forEach((t) =>
        t.addEventListener("click", () => switchView(t.dataset.view))
      );

      // Place the sliding tab highlight once layout is ready, and keep it
      // aligned on resize.
      requestAnimationFrame(() => positionIndicator(false));
      window.addEventListener("resize", () => positionIndicator(false));

      // keyboard: left/right arrows change day
      document.addEventListener("keydown", (e) => {
        if ($("#modalRoot").children.length) {
          if (e.key === "Escape") closeModal();
          return;
        }
        if (e.target.tagName === "INPUT") return;
        if (e.key === "ArrowLeft") shiftDay(-1);
        if (e.key === "ArrowRight") shiftDay(1);
      });

      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("sw.js").catch(() => {})
        );
      }
    }

    init();
  })();
  </script>
