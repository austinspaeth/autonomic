<!doctype html>
<!--
  The OG card's bottom strip, rendered ONCE by gen-og-overlay.mjs into
  og-overlay.png. Every article's social card is that one PNG composited over
  its cover, which is why gen-og.mjs needs no browser and no fonts: all the
  text in the strip was set here, at design time.
  Transparent background on purpose - the gradient carries its own alpha.
-->
<html><head><meta charset="utf-8"/>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --accent:#e03127; --display:"Space Grotesk",sans-serif; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:transparent}
  body{width:1200px;height:210px;overflow:hidden}

  .strip{
    width:1200px;height:210px;padding:0 52px 40px;
    display:flex;align-items:flex-end;justify-content:space-between;color:#fff;
    background:linear-gradient(to top,
      rgba(5,5,6,.97) 0%, rgba(5,5,6,.92) 38%, rgba(5,5,6,.6) 70%, rgba(5,5,6,0) 100%);
  }

  .brand{display:flex;align-items:center;gap:16px}
  .mark{height:40px;width:auto;color:var(--accent);flex:none}
  .word{font-family:var(--display);font-weight:700;font-size:34px;letter-spacing:-.02em;line-height:1}

  .badges{display:flex;gap:14px;flex:none}
  .badge{display:flex;align-items:center;gap:11px;height:58px;padding:0 20px 0 18px;
         border:1px solid rgba(255,255,255,.55);border-radius:10px;background:#000}
  .glyph{flex:none}
  .bt{display:flex;flex-direction:column;justify-content:center;line-height:1;color:#fff}
  .bt .small{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:11px;font-weight:400;margin-bottom:4px}
  .bt .big{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:22px;font-weight:500;letter-spacing:-.01em}
</style></head>
<body>
<div class="strip">
  <div class="brand">
    <svg class="mark" viewBox="0 0 651.59 348.34" fill="currentColor"><path d="MARKPATH"/></svg>
    <div class="word">Autonomic</div>
  </div>
  <div class="badges">
    <div class="badge">
      <svg class="glyph" width="26" height="31" viewBox="0 0 384 512" fill="#fff"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
      <div class="bt"><span class="small">Available on the</span><span class="big">App Store</span></div>
    </div>
    <div class="badge">
      <svg class="glyph" width="27" height="30" viewBox="0 0 24 24">
        <path fill="#00D3FF" d="M3.6 1.8 13.8 12 3.6 22.2A2 2 0 0 1 3 20.77V3.23c0-.55.24-1.05.6-1.43z"/>
        <path fill="#FFCE00" d="M16.8 15 13.8 12l3-3 3.86 2.19c.66.38.66 1.24 0 1.62L16.8 15z"/>
        <path fill="#FF3A44" d="M16.8 15 6.05 21.11c-.6.34-1.28.24-1.74-.18l.05-.05L13.8 12l3 3z"/>
        <path fill="#00C853" d="M4.36 3.07 4.31 3.02c.46-.42 1.14-.52 1.74-.18L16.8 9l-3 3L4.36 3.07z"/>
      </svg>
      <div class="bt"><span class="small">Available on</span><span class="big">Google Play</span></div>
    </div>
  </div>
</div>
</body></html>
