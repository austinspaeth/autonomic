<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050506" />
    <title>Page not found · Autonomic</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <style>
      :root {
        --bg: #050506;
        --panel: #131316;
        --line: rgba(255, 255, 255, 0.08);
        --line-2: rgba(255, 255, 255, 0.14);
        --text: #f5f5f7;
        --dim: #9a9aa3;
        --accent: #e03127;
        --accent-2: #ff6a5c;
        --green: #54d98a;
        --display: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--body);
        -webkit-font-smoothing: antialiased;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 20px;
        overflow-x: hidden;
      }
      .glow {
        position: fixed;
        inset: -20% 0 auto 0;
        height: 60vh;
        background: radial-gradient(60% 60% at 50% 0%, rgba(224, 49, 39, 0.18), transparent 70%);
        pointer-events: none;
        z-index: 0;
      }
      .card { position: relative; z-index: 1; max-width: 560px; width: 100%; }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: var(--display);
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.01em;
        margin-bottom: 40px;
        color: var(--text);
        text-decoration: none;
      }
      .brand svg { width: 26px; height: 26px; color: var(--accent); }
      .ecg { width: 100%; max-width: 420px; height: 64px; margin: 0 auto 8px; display: block; color: var(--accent); }
      .ecg path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
      .code {
        font-family: var(--display);
        font-weight: 700;
        font-size: clamp(64px, 16vw, 120px);
        line-height: 1;
        letter-spacing: -0.03em;
        margin: 4px 0 10px;
        background: linear-gradient(180deg, var(--text), var(--dim));
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      h1 {
        font-family: var(--display);
        font-weight: 600;
        font-size: clamp(22px, 4vw, 30px);
        margin: 0 0 14px;
        letter-spacing: -0.01em;
      }
      p.lead { color: var(--dim); font-size: 16px; line-height: 1.6; margin: 0 auto 30px; max-width: 440px; }
      .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
      .btn {
        font-family: var(--display);
        font-weight: 600;
        font-size: 15px;
        padding: 12px 22px;
        border-radius: 12px;
        text-decoration: none;
        border: 1px solid transparent;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover { background: var(--accent-2); }
      .btn-ghost { background: rgba(255, 255, 255, 0.04); color: var(--text); border-color: var(--line-2); }
      .btn-ghost:hover { background: rgba(255, 255, 255, 0.08); }
      .links { margin-top: 30px; font-size: 14px; color: var(--dim); }
      .links a { color: var(--dim); text-decoration: none; padding: 0 8px; }
      .links a:hover { color: var(--text); }
      .links span { opacity: 0.4; }
    </style>
  </head>
  <body>
    <div class="glow" aria-hidden="true"></div>
    <main class="card">
      <a class="brand" href="/">
        <svg viewBox="0 0 512 512" aria-hidden="true">
          <polyline
            points="41,266 179,266 200,225 220,307 246,92 272,420 297,240 317,266 471,266"
            fill="none"
            stroke="currentColor"
            stroke-width="44"
            stroke-linejoin="round"
            stroke-linecap="round"
          />
        </svg>
        Autonomic
      </a>

      <svg class="ecg" viewBox="0 0 420 64" preserveAspectRatio="none" aria-hidden="true">
        <path d="M0 32 H150 l14 -26 12 46 14 -52 12 32 H240 l180 0" />
      </svg>

      <div class="code">404</div>
      <h1>This reading didn't register.</h1>
      <p class="lead">
        The page you're looking for moved, flatlined, or never existed. Let's get you
        back to a clean signal.
      </p>

      <div class="actions">
        <a class="btn btn-primary" href="/">Back to home</a>
        <a class="btn btn-ghost" href="/insights/">Read the blog</a>
      </div>

      <div class="links">
        <a href="/privacy-policy/">Privacy</a>
        <span>·</span>
        <a href="/terms-of-service/">Terms</a>
      </div>
    </main>
  </body>
</html>
