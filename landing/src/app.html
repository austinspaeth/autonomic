<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Autonomic" />
    <meta name="apple-mobile-web-app-title" content="Autonomic" />

    <!-- Google Analytics (GA4), opt-out. The script loads by default; the
         cookie banner (bottom of <body>) lets visitors block it. Blocking
         persists in localStorage, stops the script from loading on future
         visits, disables the already-loaded tag for the current page, and
         drops all gtag() calls. Plain script in the shell so it runs on every
         page regardless of SvelteKit's csr setting; custom events are
         dispatched via the global gtag() below and from the homepage waitlist
         form. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function _ajBlocked() {
        if (window.location.hostname === 'localhost') return true;
        try { return localStorage.getItem('aj-cookie-consent') === 'blocked'; } catch (e) { return true; }
      }
      function gtag(){ if (!_ajBlocked()) dataLayer.push(arguments); }
      if (!_ajBlocked()) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-3R3E75CLGQ';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-3R3E75CLGQ');
      }
    </script>

    <!-- Site-wide social/brand defaults. Per-page <svelte:head> sets og:title,
         og:description, og:image and canonical; these single-purpose tags never
         collide with those, so they apply to every page. -->
    <meta property="og:site_name" content="Autonomic" />
    <meta property="og:locale" content="en_US" />
    <meta name="publisher" content="Autonomic" />

    %sveltekit.head%
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="The Autonomic Blog" href="/rss.xml" />

    <!-- Site-wide Organization + WebSite structured data (constant across every
         page) so search engines can build a brand entity and understand the site
         as a whole. Per-page JSON-LD (Article, FAQ, Breadcrumb…) is additive. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://autonomic.care/#organization",
            "name": "Autonomic",
            "url": "https://autonomic.care/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://autonomic.care/web-app-manifest-512x512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://autonomic.care/og.png",
            "description": "A private, offline iOS and Android journal that scores daily HRV, blood pressure, sleep and orthostatic readings against medical thresholds, for recovery from POTS, dysautonomia and post-viral illness.",
            "slogan": "See your nervous system recover."
          },
          {
            "@type": "WebSite",
            "@id": "https://autonomic.care/#website",
            "url": "https://autonomic.care/",
            "name": "Autonomic",
            "description": "Score your daily HRV, blood pressure, sleep and orthostatic readings against medical thresholds to track recovery from POTS, dysautonomia and post-viral illness.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://autonomic.care/#organization" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('has-js');
    </script>
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Cookie-consent banner. Analytics is opt-out: GA loads by default (see
         the loader in <head>); "Block cookies" persists the opt-out, disables
         the already-loaded tag for this page, and stops it loading on future
         visits. -->
    <div id="aj-cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie notice" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;max-width:360px;margin-left:auto;background:var(--panel,#131316);border:1px solid var(--line-2,rgba(255,255,255,0.14));border-radius:var(--r,16px);padding:16px 18px;box-shadow:0 12px 32px rgba(0,0,0,0.45);font-family:var(--body,sans-serif);color:var(--text,#f5f5f7);">
      <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--dim,#9a9aa3);">We use Google Analytics cookies to see which pages help people. Block them and we won't track you at all. <a href="/privacy-policy/" style="color:var(--accent-2,#ff6a5c);text-decoration:underline;">Privacy Policy</a></p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="aj-cookie-block" type="button" style="background:transparent;color:var(--dim,#9a9aa3);border:1px solid var(--line-2,rgba(255,255,255,0.14));border-radius:10px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;">Block cookies</button>
        <button id="aj-cookie-accept" type="button" style="background:var(--accent,#e03127);color:#fff;border:1px solid var(--accent,#e03127);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">Accept</button>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (window.location.hostname === 'localhost') return;
          if (localStorage.getItem('aj-cookie-consent')) return;
          var banner = document.getElementById('aj-cookie-banner');
          if (!banner) return;
          banner.style.display = 'block';
          function choose(value) {
            try { localStorage.setItem('aj-cookie-consent', value); } catch (e) {}
            banner.style.display = 'none';
            if (value === 'blocked') window['ga-disable-G-3R3E75CLGQ'] = true;
            // Track accepts only — a "blocked" event would break the promise
            // that blocking means no tracking at all.
            else if (typeof gtag === 'function') gtag('event', 'cookie_accept', { location: window.location.pathname });
          }
          document.getElementById('aj-cookie-accept').addEventListener('click', function () { choose('accepted'); });
          document.getElementById('aj-cookie-block').addEventListener('click', function () { choose('blocked'); });
        } catch (e) { /* localStorage disabled: no banner shows and nothing is tracked */ }
      })();
    </script>

    <!-- Site interactivity. The site ships with no framework runtime (csr is
         off); this small guarded script wires the nav, FAQ, forms and copy
         button on every page. -->
    <script>
      (function () {
        'use strict';

        function init() {
          // Page context, resolved once from the DOM (not the path, which the
          // blog serves under two shapes): an article page is anything that
          // rendered .article-prose, and its slug comes from the canonical link.
          var proseEl = document.querySelector('.article-prose');
          var canonicalEl = document.querySelector('link[rel="canonical"]');
          var pagePath = window.location.pathname;
          var articleSlug = '';
          if (proseEl) {
            var canon = canonicalEl ? canonicalEl.getAttribute('href') || '' : '';
            articleSlug = (canon || pagePath).replace(/[?#].*$/, '').replace(/\/$/, '').split('/').pop() || '';
          }
          var pageType = proseEl
            ? 'blog_article'
            : pagePath === '/' ? 'home'
            : /^\/(insights|blog)\b/.test(pagePath) ? 'blog_hub'
            : pagePath.replace(/^\/|\/$/g, '').replace(/\//g, '_') || 'other';

          // Shared GA event helper: every custom event carries the page path,
          // the kind of page, and (on an article) which article, so any event
          // can be split by where it happened without parsing URLs in GA.
          // gtag() is always defined (head loader) and no-ops when blocked.
          function ajEvent(name, params) {
            if (typeof gtag !== 'function') return;
            var p = params || {};
            p.location = pagePath;
            p.page_type = pageType;
            if (articleSlug) p.article = articleSlug;
            gtag('event', name, p);
          }

          // Where on the page an element sits, for the `placement` param.
          // Ordered most-specific first; falls back to the enclosing section.
          function placementOf(el) {
            if (!el || !el.closest) return 'unknown';
            if (el.closest('#dlModal')) return 'download_modal';
            if (el.closest('#nav')) return 'nav';
            if (el.closest('.article-cta')) return 'blog_end_cta';
            if (el.closest('.side-get')) return 'blog_sidebar';
            if (el.closest('.insights-side')) return 'blog_sidebar';
            if (el.closest('.article-prose')) return 'article_body';
            if (el.closest('.article-related')) return 'article_related';
            if (el.closest('footer')) return 'footer';
            if (el.closest('.hero')) return 'hero';
            var sec = el.closest('section[id], section[aria-label]');
            if (sec) return sec.id || (sec.getAttribute('aria-label') || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
            return 'page';
          }

          // Slug of an article an anchor points at (for card / list clicks).
          function slugOf(href) {
            return String(href || '').replace(/[?#].*$/, '').replace(/\/$/, '').split('/').pop() || '';
          }

          var yr = document.getElementById('yr');
          if (yr) yr.textContent = String(new Date().getFullYear());

          var nav = document.getElementById('nav');
          if (nav) {
            var onScroll = function () { nav.classList.toggle('scrolled', window.scrollY > 12); };
            onScroll();
            window.addEventListener('scroll', onScroll, { passive: true });

            var burger = document.getElementById('burger');
            if (burger) {
              burger.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                burger.classList.toggle('open', open);
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
              });
              nav.querySelectorAll('.nav-links a, .nav-cta a').forEach(function (a) {
                a.addEventListener('click', function () {
                  nav.classList.remove('open');
                  burger.classList.remove('open');
                  burger.setAttribute('aria-expanded', 'false');
                });
              });
            }
          }

          // Platform-aware download CTA + dual-download modal.
          // Store URLs carry the site's attribution tags (Apple pt+ct, Play
          // referrer) — keep in sync with storeUrl() in src/lib/site.ts.
          (function () {
            var STORE = {
              ios: 'https://apps.apple.com/app/apple-store/id6789786971?pt=126963570&ct=Landing&mt=8',
              android:
                'https://play.google.com/store/apps/details?id=com.autonomic.journal&referrer=utm_source%3Dautonomic.care%26utm_medium%3Dreferral%26utm_campaign%3Dlanding'
            };
            var GLYPH = {
              ios: '<svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM262.1 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 20-27.8 44.7-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>',
              android: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15.6 5.2 16.8 3a.4.4 0 0 0-.7-.4l-1.24 2.14a6.5 6.5 0 0 0-5.72 0L7.9 2.6a.4.4 0 0 0-.7.4l1.2 2.2A6 6 0 0 0 5.3 10.4h13.4a6 6 0 0 0-3.1-5.2zM9.5 8.6a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6zm5 0a.8.8 0 1 1 0-1.6.8.8 0 0 1 0 1.6z"/></svg>'
            };

            function detectPlatform() {
              var ua = navigator.userAgent || '';
              if (/android/i.test(ua)) return 'android';
              // iPadOS 13+ reports as Mac; disambiguate by touch support.
              if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
              if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
              return null;
            }

            // Every download click fires TWO events: the store-specific one
            // (unchanged, so existing reports keep working) and a single
            // `download_click` carrying platform + placement, so total download
            // intent can be read off one event and split by where it came from
            // (blog end CTA, blog sidebar, nav, hero, modal, …).
            function trackDownload(platform, el, placement) {
              var place = placement || placementOf(el);
              ajEvent(platform === 'android' ? 'play_store_click' : 'app_store_click', { placement: place });
              ajEvent('download_click', { platform: platform, placement: place });
            }
            window.ajTrackDownload = trackDownload;

            var platform = detectPlatform();

            // Modal open/close (desktop / unknown platform).
            var modal = document.getElementById('dlModal');
            var lastFocus = null;
            function openModal(trigger) {
              if (!modal) return;
              ajEvent('download_modal_open', { placement: placementOf(trigger) });
              lastFocus = document.activeElement;
              modal.hidden = false;
              document.body.style.overflow = 'hidden';
              var x = modal.querySelector('.dlm-x');
              if (x) x.focus();
            }
            function closeModal() {
              if (!modal || modal.hidden) return;
              modal.hidden = true;
              document.body.style.overflow = '';
              if (lastFocus && lastFocus.focus) lastFocus.focus();
            }
            if (modal) {
              modal.querySelectorAll('[data-dl-close]').forEach(function (el) {
                el.addEventListener('click', closeModal);
              });
              document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeModal();
              });
            }

            // Every download CTA: on a phone, deep-link straight to its store
            // with the platform glyph; otherwise open the modal.
            document.querySelectorAll('[data-dl-cta]').forEach(function (el) {
              if (platform) {
                el.setAttribute('href', STORE[platform]);
                var slot = el.querySelector('.btn-dl-ic');
                if (slot) { slot.innerHTML = GLYPH[platform]; el.classList.add('has-ic'); }
                el.addEventListener('click', function () { trackDownload(platform, el); });
              } else {
                el.addEventListener('click', function (e) {
                  e.preventDefault();
                  openModal(el);
                });
              }
            });
          })();

          // AI report picker: clicking a chip swaps the mocked prompt (title +
          // body) to that report's full, pasteable prompt. Each chip carries its
          // prompt + title in data-prompt / data-title attributes.
          (function () {
            var chips = document.querySelectorAll('.ai-chip[data-prompt]');
            var bodyEl = document.querySelector('.aip-body');
            var titleEl = document.querySelector('.aip-title');
            if (!chips.length || !bodyEl) return;
            function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            function previewOf(t) { var i = t.indexOf('FOCUS:'); return i >= 0 ? t.slice(i) : t; }
            function render(chip) {
              var text = chip.getAttribute('data-prompt') || '';
              bodyEl.innerHTML = esc(previewOf(text)).replace(/^([A-Z][A-Z0-9 ()/&.'-]*?:)/gm, '<span class="c-key">$1<\/span>');
              bodyEl.setAttribute('data-copy', text);
              if (titleEl) titleEl.textContent = chip.getAttribute('data-title') || '';
              chips.forEach(function (c) { c.classList.toggle('selected', c === chip); });
            }
            chips.forEach(function (c) {
              c.addEventListener('click', function () { render(c); });
            });
            // Seed data-copy from the initial (statically-rendered) report so the
            // copy button grabs the full prompt even before any click.
            var start = document.querySelector('.ai-chip.selected[data-prompt]') || chips[0];
            if (start) bodyEl.setAttribute('data-copy', start.getAttribute('data-prompt') || '');
          })();

          // Track store CTA clicks site-wide. Every store badge/link carries
          // data-dl-store="ios|android" (hero, download section, blog end-CTA,
          // insights sidebar, modal); the platform-aware nav CTA tracks itself.
          document.querySelectorAll('[data-dl-store]').forEach(function (el) {
            el.addEventListener('click', function () {
              var p = el.getAttribute('data-dl-store');
              if (typeof window.ajTrackDownload === 'function') window.ajTrackDownload(p === 'android' ? 'android' : 'ios', el);
            });
          });

          // ---- Engagement tracking -------------------------------------
          // One delegated listener maps every remaining interactive element
          // to a GA event (store badges/CTAs are wired individually above,
          // so they're excluded here to avoid double-counting).
          document.addEventListener('click', function (ev) {
            var t = ev.target;
            if (!t || !t.closest) return;
            // Store CTAs/badges are wired individually above (they resolve the
            // platform first); skip them here so nothing double-counts.
            if (t.closest('[data-dl-cta],[data-dl-store]')) return;
            var el;
            if ((el = t.closest('[data-wa-go],[data-wa-act],[data-wa-log]'))) {
              // Watch interactive (#watch): which face/button was tapped.
              var action = el.getAttribute('data-wa-log') ? 'log:' + el.getAttribute('data-wa-log')
                : el.getAttribute('data-wa-act') || 'go:' + el.getAttribute('data-wa-go');
              ajEvent('watch_interact', { action: action });
            } else if ((el = t.closest('.ai-chip[data-prompt]'))) {
              // AI interactive: report chip selected.
              ajEvent('ai_report_select', { report: el.getAttribute('data-report') || el.getAttribute('data-title') || '' });
            } else if ((el = t.closest('.aip-copy'))) {
              // AI interactive: prompt copied (which report was showing).
              var sel = document.querySelector('.ai-chip.selected[data-report]');
              ajEvent('ai_prompt_copy', { report: sel ? sel.getAttribute('data-report') : '' });
            } else if ((el = t.closest('.article-prose a'))) {
              // Any link inside the article body: cross-links between articles,
              // citations out to studies, in-page jumps.
              var ph = el.getAttribute('href') || '';
              ajEvent('article_link_click', {
                target: ph,
                link_type: /^https?:/i.test(ph) && ph.indexOf('autonomic.care') < 0 ? 'external'
                  : ph.charAt(0) === '#' ? 'anchor' : 'internal',
                text: (el.textContent || '').trim().slice(0, 100)
              });
            } else if ((el = t.closest('.ash-btn'))) {
              ajEvent('article_share', { network: (el.textContent || '').trim() });
            } else if ((el = t.closest('.blog-card, .recent-card, .article-line, .side-recent-link, .side-pillars a'))) {
              // Every route into an article, tagged with the surface it came
              // from: related block, a hub/list page, or the blog sidebar.
              ajEvent('article_click', {
                article_target: slugOf(el.getAttribute('href')),
                placement: el.closest('.side-pillars') ? 'sidebar_start_here'
                  : el.closest('.insights-side') ? 'sidebar_recent'
                  : el.closest('.article-related') ? 'related'
                  : 'list'
              });
            } else if ((el = t.closest('.ac-author, .author-name a, .writer-link'))) {
              ajEvent('author_click', { author: (el.textContent || '').trim().slice(0, 60) });
            } else if ((el = t.closest('.ac-tag, .article-chips a, .side-all, .topic-card'))) {
              ajEvent('topic_click', { target: el.getAttribute('href') || '', text: (el.textContent || '').trim().slice(0, 60) });
            } else if (t.closest('#burger')) {
              ajEvent('nav_click', { target: 'menu' });
            } else if ((el = t.closest('#nav a'))) {
              if (el.hasAttribute('data-dl-cta') || el.hasAttribute('data-dl-store')) return;
              ajEvent('nav_click', { target: el.getAttribute('href') || '' });
            } else if ((el = t.closest('a[href^="#"], a[href^="/#"]'))) {
              // Any other in-page link (trustbar "Read my story", pricing
              // cross-links, footer section links, …).
              if (el.hasAttribute('data-dl-cta') || el.hasAttribute('data-dl-store')) return;
              ajEvent('link_click', { target: el.getAttribute('href') || '' });
            }
          });

          // FAQ (and any other <details>) opens. Toggle doesn't bubble, so
          // listen in the capture phase. Strip the "+" indicator glyph.
          document.addEventListener('toggle', function (ev) {
            var d = ev.target;
            if (d && d.tagName === 'DETAILS' && d.open) {
              var s = d.querySelector('summary');
              var label = s ? s.textContent.replace(/\+\s*$/, '').trim().slice(0, 100) : '';
              // A <details> inside the article body is expandable content, not
              // an FAQ answer; keep the two apart in reporting.
              if (d.closest('.article-prose')) ajEvent('article_details_open', { label: label });
              else ajEvent('faq_open', { question: label });
            }
          }, true);

          // ---- Blog content interaction ---------------------------------
          // In-article calculators (.metric-calc, written into the markdown):
          // one `calc_use` the first time a widget is touched, plus a
          // `calc_change` per committed field so we can see which inputs the
          // reader actually explores.
          document.querySelectorAll('.metric-calc').forEach(function (calc, i) {
            var head = calc.querySelector('.mc-head');
            var name = (head ? head.textContent : '').trim().slice(0, 60) || 'calculator-' + (i + 1);
            var used = false;
            calc.addEventListener('change', function (ev) {
              var f = ev.target;
              if (!f || !f.tagName || !/^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)) return;
              if (!used) { used = true; ajEvent('calc_use', { calc: name }); }
              var lab = f.closest('.mc-field');
              var labEl = lab ? lab.querySelector('.mc-label') : null;
              ajEvent('calc_change', {
                calc: name,
                field: (labEl ? labEl.textContent : f.name || f.type || '').trim().slice(0, 60)
              });
            });
          });

          if (proseEl) {
            // Reading depth through the article body: 25/50/75/100% of the
            // prose scrolled past the bottom of the viewport, once each.
            var depthHit = {};
            var onDepth = function () {
              var box = proseEl.getBoundingClientRect();
              var total = box.height;
              if (total <= 0) return;
              var read = Math.min(total, Math.max(0, window.innerHeight - box.top));
              var pct = Math.floor((read / total) * 100);
              [25, 50, 75, 100].forEach(function (m) {
                if (pct >= m && !depthHit[m]) {
                  depthHit[m] = true;
                  ajEvent('article_scroll', { percent: m });
                }
              });
              if (depthHit[100]) window.removeEventListener('scroll', onDepth);
            };
            window.addEventListener('scroll', onDepth, { passive: true });
            onDepth();

            // Copying out of an article is a strong "this was useful" signal.
            var copiedOnce = false;
            proseEl.addEventListener('copy', function () {
              if (copiedOnce) return;
              copiedOnce = true;
              ajEvent('article_copy');
            });
          }
          // --------------------------------------------------------------

          // Section views: fire once per page load when a section crosses the
          // middle band of the viewport (works for sections taller than the
          // screen, where a visible-fraction threshold would never trip).
          // Sections are keyed by id, falling back to a slug of aria-label.
          if (window.IntersectionObserver) {
            var seenSections = {};
            var sectionObs = new IntersectionObserver(function (entries) {
              entries.forEach(function (en) {
                if (!en.isIntersecting) return;
                var sec = en.target;
                var key = sec.id || (sec.getAttribute('aria-label') || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
                if (!key || seenSections[key]) return;
                seenSections[key] = true;
                sectionObs.unobserve(sec);
                ajEvent('section_view', { section: key });
              });
            }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
            document.querySelectorAll('section').forEach(function (s) {
              if (s.id || s.getAttribute('aria-label')) sectionObs.observe(s);
            });
          }
          // --------------------------------------------------------------

          var copyBtn = document.querySelector('.aip-copy');
          if (copyBtn) {
            var promptEl = document.querySelector('.aip-body');
            copyBtn.addEventListener('click', function () {
              var txt = promptEl ? (promptEl.getAttribute('data-copy') || promptEl.innerText) : '';
              var done = function () {
                var prev = copyBtn.textContent;
                copyBtn.textContent = 'Copied ✓';
                setTimeout(function () { copyBtn.textContent = prev; }, 1600);
              };
              if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
              else done();
            });
          }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
      })();
    </script>
  </body>
</html>
