<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050506" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Autonomic" />
    <meta name="apple-mobile-web-app-title" content="Autonomic" />

    <!-- Google Analytics (GA4), opt-out. The script loads by default; the
         cookie banner (bottom of <body>) lets visitors block it. Blocking
         persists in localStorage, stops the script from loading on future
         visits, disables the already-loaded tag for the current page, and
         drops all gtag() calls. Plain script in the shell so it runs on every
         page regardless of SvelteKit's csr setting; custom events are
         dispatched via the global gtag() below and from the homepage waitlist
         form. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function _ajBlocked() {
        if (window.location.hostname === 'localhost') return true;
        try { return localStorage.getItem('aj-cookie-consent') === 'blocked'; } catch (e) { return true; }
      }
      function gtag(){ if (!_ajBlocked()) dataLayer.push(arguments); }
      if (!_ajBlocked()) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-3R3E75CLGQ';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-3R3E75CLGQ');
      }
    </script>

    <!-- Site-wide social/brand defaults. Per-page <svelte:head> sets og:title,
         og:description, og:image and canonical; these single-purpose tags never
         collide with those, so they apply to every page. -->
    <meta property="og:site_name" content="Autonomic" />
    <meta property="og:locale" content="en_US" />
    <meta name="publisher" content="Autonomic" />

    %sveltekit.head%
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="alternate" type="application/rss+xml" title="The Autonomic Blog" href="/rss.xml" />

    <!-- Site-wide Organization + WebSite structured data (constant across every
         page) so search engines can build a brand entity and understand the site
         as a whole. Per-page JSON-LD (Article, FAQ, Breadcrumb…) is additive. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://autonomic.care/#organization",
            "name": "Autonomic",
            "url": "https://autonomic.care/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://autonomic.care/favicon-512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://autonomic.care/og.png",
            "description": "A private, offline iOS journal that scores daily HRV, blood pressure, sleep and orthostatic readings against medical thresholds, for recovery from POTS, dysautonomia and post-viral illness.",
            "slogan": "See your nervous system recover."
          },
          {
            "@type": "WebSite",
            "@id": "https://autonomic.care/#website",
            "url": "https://autonomic.care/",
            "name": "Autonomic",
            "description": "Score your daily HRV, blood pressure, sleep and orthostatic readings against medical thresholds to track recovery from POTS, dysautonomia and post-viral illness.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://autonomic.care/#organization" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('has-js');
    </script>
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Cookie-consent banner. Analytics is opt-out: GA loads by default (see
         the loader in <head>); "Block cookies" persists the opt-out, disables
         the already-loaded tag for this page, and stops it loading on future
         visits. -->
    <div id="aj-cookie-banner" role="dialog" aria-live="polite" aria-label="Cookie notice" style="display:none;position:fixed;left:16px;right:16px;bottom:16px;z-index:9999;max-width:360px;margin-left:auto;background:var(--panel,#131316);border:1px solid var(--line-2,rgba(255,255,255,0.14));border-radius:var(--r,16px);padding:16px 18px;box-shadow:0 12px 32px rgba(0,0,0,0.45);font-family:var(--body,sans-serif);color:var(--text,#f5f5f7);">
      <p style="margin:0 0 12px;font-size:14px;line-height:1.5;color:var(--dim,#9a9aa3);">We use Google Analytics cookies to see which pages help people. Block them and we won't track you at all. <a href="/privacy-policy/" style="color:var(--accent-2,#ff6a5c);text-decoration:underline;">Privacy Policy</a></p>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button id="aj-cookie-block" type="button" style="background:transparent;color:var(--dim,#9a9aa3);border:1px solid var(--line-2,rgba(255,255,255,0.14));border-radius:10px;padding:8px 14px;font-size:13px;font-family:inherit;cursor:pointer;">Block cookies</button>
        <button id="aj-cookie-accept" type="button" style="background:var(--accent,#e03127);color:#fff;border:1px solid var(--accent,#e03127);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;font-family:inherit;cursor:pointer;">Accept</button>
      </div>
    </div>
    <script>
      (function () {
        try {
          if (window.location.hostname === 'localhost') return;
          if (localStorage.getItem('aj-cookie-consent')) return;
          var banner = document.getElementById('aj-cookie-banner');
          if (!banner) return;
          banner.style.display = 'block';
          function choose(value) {
            try { localStorage.setItem('aj-cookie-consent', value); } catch (e) {}
            banner.style.display = 'none';
            if (value === 'blocked') window['ga-disable-G-3R3E75CLGQ'] = true;
          }
          document.getElementById('aj-cookie-accept').addEventListener('click', function () { choose('accepted'); });
          document.getElementById('aj-cookie-block').addEventListener('click', function () { choose('blocked'); });
        } catch (e) { /* localStorage disabled: no banner shows and nothing is tracked */ }
      })();
    </script>

    <!-- Site interactivity. The site ships with no framework runtime (csr is
         off); this small guarded script wires the nav, FAQ, forms and copy
         button on every page. -->
    <script>
      (function () {
        'use strict';

        function init() {
          var yr = document.getElementById('yr');
          if (yr) yr.textContent = String(new Date().getFullYear());

          var nav = document.getElementById('nav');
          if (nav) {
            var onScroll = function () { nav.classList.toggle('scrolled', window.scrollY > 12); };
            onScroll();
            window.addEventListener('scroll', onScroll, { passive: true });

            var burger = document.getElementById('burger');
            if (burger) {
              burger.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                burger.classList.toggle('open', open);
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
              });
              nav.querySelectorAll('.nav-links a, .nav-cta a').forEach(function (a) {
                a.addEventListener('click', function () {
                  nav.classList.remove('open');
                  burger.classList.remove('open');
                  burger.setAttribute('aria-expanded', 'false');
                });
              });
            }
          }

          // AI report picker: clicking a chip swaps the mocked prompt (title +
          // body) to that report's full, pasteable prompt. Each chip carries its
          // prompt + title in data-prompt / data-title attributes.
          (function () {
            var chips = document.querySelectorAll('.ai-chip[data-prompt]');
            var bodyEl = document.querySelector('.aip-body');
            var titleEl = document.querySelector('.aip-title');
            if (!chips.length || !bodyEl) return;
            function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            function previewOf(t) { var i = t.indexOf('FOCUS:'); return i >= 0 ? t.slice(i) : t; }
            function render(chip) {
              var text = chip.getAttribute('data-prompt') || '';
              bodyEl.innerHTML = esc(previewOf(text)).replace(/^([A-Z][A-Z0-9 ()/&.'-]*?:)/gm, '<span class="c-key">$1<\/span>');
              bodyEl.setAttribute('data-copy', text);
              if (titleEl) titleEl.textContent = chip.getAttribute('data-title') || '';
              chips.forEach(function (c) { c.classList.toggle('selected', c === chip); });
            }
            chips.forEach(function (c) {
              c.addEventListener('click', function () { render(c); });
            });
            // Seed data-copy from the initial (statically-rendered) report so the
            // copy button grabs the full prompt even before any click.
            var start = document.querySelector('.ai-chip.selected[data-prompt]') || chips[0];
            if (start) bodyEl.setAttribute('data-copy', start.getAttribute('data-prompt') || '');
          })();

          // The waitlist forms are owned by the homepage Svelte component
          // (they POST to FlowForm on submit). No handler needed here.

          // Track App Store CTA clicks site-wide (these buttons appear in the
          // nav, blog end-CTA and insights sidebar as well as the homepage).
          document.querySelectorAll('.btn-appstore, .dl-ios-badge').forEach(function (el) {
            el.addEventListener('click', function () {
              if (typeof gtag === 'function') {
                gtag('event', 'app_store_click', { location: window.location.pathname });
              }
            });
          });

          var copyBtn = document.querySelector('.aip-copy');
          if (copyBtn) {
            var promptEl = document.querySelector('.aip-body');
            copyBtn.addEventListener('click', function () {
              var txt = promptEl ? (promptEl.getAttribute('data-copy') || promptEl.innerText) : '';
              var done = function () {
                var prev = copyBtn.textContent;
                copyBtn.textContent = 'Copied ✓';
                setTimeout(function () { copyBtn.textContent = prev; }, 1600);
              };
              if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
              else done();
            });
          }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
      })();
    </script>
  </body>
</html>
