<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f2eff1" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2eff1" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="Autonomic" />
    <meta name="apple-mobile-web-app-title" content="Autonomic" />

    <!-- Google Analytics (GA4), opt-out. The script loads by default; the
         cookie banner (bottom of <body>) lets visitors block it. Blocking
         persists in localStorage, stops the script from loading on future
         visits, disables the already-loaded tag for the current page, and
         drops all gtag() calls. Plain script in the shell so it runs on every
         page regardless of SvelteKit's csr setting; custom events are
         dispatched via the global gtag() below and from the homepage waitlist
         form. -->
    <script>
      window.dataLayer = window.dataLayer || [];

      /* Headless browsers. A scripted browser does not just READ the page, it
         drives it: link checkers, SEO auditors, uptime and accessibility
         scanners and AI browsing agents all enumerate a page by dispatching
         real clicks at every anchor they find, and a dispatched click is
         indistinguishable from a finger inside a listener. One pass over an
         article therefore fires the whole engagement set at once -- the CTA, a
         store badge, a link off to the product pages -- which is how a visitor
         who never left the article comes to look like a conversion. GA's own
         bot filtering only knows DECLARED crawlers (a user agent on the IAB
         list), and these declare nothing.

         `navigator.webdriver` is the W3C automation flag: the spec REQUIRES it
         to be true in a browser under automation, and no ordinary browsing mode
         sets it, so this excludes the scripted traffic without touching a
         single real visitor. It is folded into `_ajBlocked` rather than checked
         per event so that it covers everything at once -- the tag never loads,
         no event is queued, and the /download sniffer takes its blocked path
         and redirects immediately instead of waiting on a callback. */
      function _ajAutomated() {
        try { return navigator.webdriver === true; } catch (e) { return false; }
      }

      function _ajBlocked() {
        if (window.location.hostname === 'localhost') return true;
        // /master is the private analytics dashboard, not a page of the site:
        // noindex, one signed-in visitor, nothing to measure.
        if (/^\/master(\/|$)/.test(window.location.pathname)) return true;
        if (_ajAutomated()) return true;
        try { return localStorage.getItem('aj-cookie-consent') === 'blocked'; } catch (e) { return true; }
      }

      /* DebugView. GA streams a hit to DebugView only when the hit carries
         `debug_mode`, which is normally set by a Chrome extension -- no use at
         all for the question "what is this visitor's phone actually sending".
         `?aj_debug=1` turns it on for the rest of the browser session and
         `?aj_debug=0` turns it off; it lives in sessionStorage so it expires
         with the tab and can never leak into an ordinary visit. Debug hits are
         still counted in reports, so this is safe to leave on while watching.

         It also makes the body script log every event it sends to the console,
         which is the one view that shows the PARAMETERS -- and `location` is
         the parameter that answers "which page did this come from", the thing
         GA's own realtime view will not tell you. */
      function _ajDebug() {
        try {
          if (/[?&]aj_debug=1(&|$)/.test(window.location.search)) sessionStorage.setItem('aj-debug', '1');
          else if (/[?&]aj_debug=0(&|$)/.test(window.location.search)) sessionStorage.removeItem('aj-debug');
          return sessionStorage.getItem('aj-debug') === '1';
        } catch (e) { return false; }
      }

      function gtag(){ if (!_ajBlocked()) dataLayer.push(arguments); }
      if (!_ajBlocked()) {
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-3R3E75CLGQ';
        document.head.appendChild(s);
        gtag('js', new Date());
        gtag('config', 'G-3R3E75CLGQ', _ajDebug() ? { debug_mode: true } : {});
      }
    </script>

    <!-- Site-wide social/brand defaults. Per-page <svelte:head> sets og:title,
         og:description, og:image and canonical; these single-purpose tags never
         collide with those, so they apply to every page. -->
    <meta property="og:site_name" content="Autonomic" />
    <meta property="og:locale" content="en_US" />
    <meta name="publisher" content="Autonomic" />

    %sveltekit.head%
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="alternate" type="application/rss+xml" title="Questions People Ask, from Autonomic" href="/rss.xml" />

    <!-- Site-wide Organization + WebSite structured data (constant across every
         page) so search engines can build a brand entity and understand the site
         as a whole. Per-page JSON-LD (Article, FAQ, Breadcrumb…) is additive. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://autonomic.care/#organization",
            "name": "Autonomic",
            "url": "https://autonomic.care/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://autonomic.care/web-app-manifest-512x512.png",
              "width": 512,
              "height": 512
            },
            "image": "https://autonomic.care/og.png",
            "description": "A private, offline iOS and Android journal that scores daily HRV, blood pressure, sleep and orthostatic readings against medical thresholds, for recovery from POTS, dysautonomia and post-viral illness.",
            "slogan": "See your nervous system recover."
          },
          {
            "@type": "WebSite",
            "@id": "https://autonomic.care/#website",
            "url": "https://autonomic.care/",
            "name": "Autonomic",
            "description": "Score your daily HRV, blood pressure, sleep and orthostatic readings against medical thresholds to track recovery from POTS, dysautonomia and post-viral illness.",
            "inLanguage": "en-US",
            "publisher": { "@id": "https://autonomic.care/#organization" }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@700&display=swap"
      rel="stylesheet"
    />
    <script>
      document.documentElement.classList.add('has-js');
    </script>
  </head>
  <body>
    <div style="display: contents">%sveltekit.body%</div>

    <!-- Fixed bottom dock. Everything that hovers over the page bottom lives
         here, stacked upward in DOM order, so the pieces can never overlap
         each other. The dock itself takes no pointer events (it spans the full
         width and would otherwise eat taps on the page behind it); each child
         turns them back on. On desktop the dock is `display: contents` and its
         children position themselves, exactly as they did before it existed. -->
    <div class="aj-dock" id="aj-dock">
      <!-- Cookie-consent banner. Analytics is opt-out: GA loads by default (see
           the loader in <head>); "Block cookies" persists the opt-out, disables
           the already-loaded tag for this page, and stops it loading on future
           visits. On mobile it starts collapsed as a pill (.aj-cb-pill) and
           expands into the same card on tap. -->
      <div id="aj-cookie-banner" class="aj-cb" role="dialog" aria-live="polite" aria-label="Cookie notice" hidden>
        <div class="aj-cb-pill">
          <button id="aj-cookie-open" class="aj-cb-open" type="button" aria-expanded="false" aria-controls="aj-cookie-card">
            <svg class="aj-cb-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
              <path d="M21 12.8A9 9 0 1 1 11.2 3a4 4 0 0 0 4.4 4.6A4 4 0 0 0 20 12a4 4 0 0 0 1 .8Z" stroke-linejoin="round" />
              <circle cx="9" cy="10" r="1" fill="currentColor" stroke="none" />
              <circle cx="8.5" cy="15.5" r="1" fill="currentColor" stroke="none" />
              <circle cx="14" cy="16" r="1" fill="currentColor" stroke="none" />
            </svg>
            <span>Cookie preferences</span>
          </button>
          <button id="aj-cookie-dismiss" class="aj-cb-x" type="button" aria-label="Dismiss cookie notice">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>
        </div>
        <div class="aj-cb-card" id="aj-cookie-card">
          <p class="aj-cb-copy">We use Google Analytics cookies to see which pages help people. Block them and we won't track you at all. <a href="/privacy-policy/">Privacy Policy</a></p>
          <div class="aj-cb-actions">
            <button id="aj-cookie-block" class="aj-cb-btn" type="button">Block cookies</button>
            <button id="aj-cookie-accept" class="aj-cb-btn aj-cb-btn--go" type="button">Accept</button>
          </div>
        </div>
      </div>
    </div>
    <script>
      (function () {
        try {
          // Nowhere that sets no cookies asks about them — this covers
          // localhost and /master as well as an existing "blocked" choice.
          if (_ajBlocked()) return;
          if (localStorage.getItem('aj-cookie-consent')) return;
          var banner = document.getElementById('aj-cookie-banner');
          if (!banner) return;
          banner.hidden = false;
          var opener = document.getElementById('aj-cookie-open');
          opener.addEventListener('click', function () {
            var open = banner.classList.toggle('is-open');
            opener.setAttribute('aria-expanded', open ? 'true' : 'false');
          });
          function choose(value) {
            try { localStorage.setItem('aj-cookie-consent', value); } catch (e) {}
            banner.hidden = true;
            banner.classList.remove('is-open');
            if (value === 'blocked') window['ga-disable-G-3R3E75CLGQ'] = true;
            // Track accepts only — a "blocked" event would break the promise
            // that blocking means no tracking at all. Dismissing the pill is
            // neither: it leaves the opt-out default (GA on) in place without
            // claiming the visitor actively agreed to anything.
            else if (value === 'accepted' && typeof gtag === 'function') gtag('event', 'cookie_accept', { location: window.location.pathname });
          }
          document.getElementById('aj-cookie-accept').addEventListener('click', function () { choose('accepted'); });
          document.getElementById('aj-cookie-block').addEventListener('click', function () { choose('blocked'); });
          document.getElementById('aj-cookie-dismiss').addEventListener('click', function () { choose('dismissed'); });
        } catch (e) { /* localStorage disabled: no banner shows and nothing is tracked */ }
      })();
    </script>

    <!-- Site interactivity. The site ships with no framework runtime (csr is
         off); this small guarded script wires the nav, FAQ, forms and copy
         button on every page. -->
    <script>
      (function () {
        'use strict';

        function init() {
          // Page context, resolved once from the DOM (not the path, which the
          // blog serves under two shapes): an article page is anything that
          // rendered .article-prose, and its slug comes from the canonical link.
          var proseEl = document.querySelector('.article-prose');
          var canonicalEl = document.querySelector('link[rel="canonical"]');
          var pagePath = window.location.pathname;
          var articleSlug = '';
          if (proseEl) {
            var canon = canonicalEl ? canonicalEl.getAttribute('href') || '' : '';
            articleSlug = (canon || pagePath).replace(/[?#].*$/, '').replace(/\/$/, '').split('/').pop() || '';
          }
          var pageType = proseEl
            ? 'blog_article'
            : pagePath === '/' ? 'home'
            : /^\/(insights|blog)\b/.test(pagePath) ? 'blog_hub'
            : pagePath.replace(/^\/|\/$/g, '').replace(/\//g, '_') || 'other';

          // Shared GA event helper: every custom event carries the page path,
          // the kind of page, and (on an article) which article, so any event
          // can be split by where it happened without parsing URLs in GA.
          // gtag() is always defined (head loader) and no-ops when blocked.
          var ajDebugOn = typeof _ajDebug === 'function' && _ajDebug();
          function ajEvent(name, params) {
            if (typeof gtag !== 'function') return;
            var p = params || {};
            p.location = pagePath;
            p.page_type = pageType;
            if (articleSlug) p.article = articleSlug;
            // `?aj_debug=1`: every event, with its parameters, in the console
            // of the phone that sent it. GA's realtime view names the event and
            // hides the parameters, so this is the only place `location` can be
            // read -- and `location` is what separates "this page fired it"
            // from "an earlier page in the same session did".
            if (ajDebugOn) try { console.log('[aj] ' + name, p); } catch (e) {}
            gtag('event', name, p);
          }
          // Page scripts (the blog search) report through the same helper.
          window.ajEvent = ajEvent;

          /* DOWNLOAD INTENT, once per session: "did this visitor ask for the
             app", which is the other question the key events exist to answer.
             It needs its own event because none of the three that were being
             read as the answer can be:

               `cta_click`      fires on every CTA of any kind, download or
                                pitch, and fires TWICE on a desktop download
                                (once opening the modal, once on the badge
                                inside it);
               `download_click` fires per store badge, so a visitor weighing up
                                iPhone and Android is two conversions;
               `download_redirect` is INBOUND traffic through /download, not an
                                action taken on the site at all -- it belongs to
                                acquisition, and marking it a key event puts
                                every QR-code arrival in the conversion column
                                before the visitor has done anything.

             All three stay, unchanged, as the reporting splits. This is the
             headcount: first ask wins, the rest of the session is a no-op, and
             it carries where the ask happened so it still breaks down by
             surface. sessionStorage, so it expires with the tab -- a visitor
             who comes back tomorrow is a new ask, which is what a daily
             conversion count should mean. */
          var dlIntentSent = false;
          function noteDownloadIntent(how, params) {
            if (dlIntentSent) return;
            try {
              if (sessionStorage.getItem('aj-dl-intent') === '1') { dlIntentSent = true; return; }
              sessionStorage.setItem('aj-dl-intent', '1');
            } catch (e) { /* private mode: the in-page flag still holds */ }
            dlIntentSent = true;
            var p = params || {};
            p.how = how;
            ajEvent('download_intent', p);
          }

          // Every CTA names itself with data-cta ("article_mid_card",
          // "page_cta", "nav_get_app"…). A name used twice on one page (two
          // mid-page download bars) is numbered in page order, mid_cta then
          // mid_cta_2, so each one is still its own row in GA.
          (function () {
            var seen = {};
            document.querySelectorAll('[data-cta]').forEach(function (el) {
              var n = el.getAttribute('data-cta');
              seen[n] = (seen[n] || 0) + 1;
              if (seen[n] > 1) el.setAttribute('data-cta', n + '_' + seen[n]);
            });
          })();
          function ctaOf(el) {
            var c = el && el.closest ? el.closest('[data-cta]') : null;
            return c ? c.getAttribute('data-cta') : '';
          }

          // Where on the page an element sits, for the `placement` param.
          // A named CTA is its own placement; otherwise most-specific first,
          // falling back to the enclosing section.
          function placementOf(el) {
            if (!el || !el.closest) return 'unknown';
            if (el.closest('#dlModal')) return 'download_modal';
            var named = ctaOf(el);
            if (named) return named;
            // Dysautonomia Awareness Month surfaces. Before #nav and the blog
            // sidebar, which contain two of them.
            if (el.closest('.awareness')) return 'nav_awareness';
            if (el.closest('.gva')) return 'giveaway_home_banner';
            if (el.closest('.gvs')) return 'giveaway_blog_sidebar';
            if (el.closest('.gvm')) return 'giveaway_blog_mobile_banner';
            if (el.closest('.gvp-hero')) return 'giveaway_page_hero';
            if (el.closest('.gvp-end')) return 'giveaway_page_end';
            // The launch article's countdown card and closing card.
            if (el.closest('.gvx-clock')) return 'giveaway_article_top';
            if (el.closest('.gvx-end')) return 'giveaway_article_end';
            if (el.closest('#enter')) return 'giveaway_page_enter';
            if (el.closest('#rules')) return 'giveaway_page_rules';
            if (el.closest('#dlModal')) return 'download_modal';
            if (el.closest('#nav')) return 'nav';
            if (el.closest('.article-cta')) return 'blog_end_cta';
            if (el.closest('.side-get')) return 'blog_sidebar';
            if (el.closest('.insights-side')) return 'blog_sidebar';
            if (el.closest('.article-prose')) return 'article_body';
            if (el.closest('.article-related')) return 'article_related';
            if (el.closest('footer')) return 'footer';
            if (el.closest('.hero')) return 'hero';
            var sec = el.closest('section[id], section[aria-label]');
            if (sec) return sec.id || (sec.getAttribute('aria-label') || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
            return 'page';
          }

          // Which promo brought this visitor to the giveaway page, if any
          // (set by giveaway_promo_click on the way in; 'direct' otherwise).
          function gvFrom() {
            try { return sessionStorage.getItem('aj-gv-from') || 'direct'; } catch (e) { return 'direct'; }
          }

          // Slug of an article an anchor points at (for card / list clicks).
          function slugOf(href) {
            return String(href || '').replace(/[?#].*$/, '').replace(/\/$/, '').split('/').pop() || '';
          }

          var yr = document.getElementById('yr');
          if (yr) yr.textContent = String(new Date().getFullYear());

          var nav = document.getElementById('nav');
          if (nav) {
            var onScroll = function () {
              var on = window.scrollY > 12;
              nav.classList.toggle('scrolled', on);
              // The blog's topic bar sits under the header and changes with it.
              document.documentElement.classList.toggle('nav-scrolled', on);
            };
            onScroll();
            window.addEventListener('scroll', onScroll, { passive: true });
            // A restored scroll position (reload, Back) can land without a scroll event.
            window.addEventListener('pageshow', onScroll);

            var burger = document.getElementById('burger');
            if (burger) {
              burger.addEventListener('click', function () {
                var open = nav.classList.toggle('open');
                burger.classList.toggle('open', open);
                burger.setAttribute('aria-expanded', open ? 'true' : 'false');
              });
              nav.querySelectorAll('.nav-links a, .nav-cta a').forEach(function (a) {
                a.addEventListener('click', function () {
                  nav.classList.remove('open');
                  burger.classList.remove('open');
                  burger.setAttribute('aria-expanded', 'false');
                });
              });
            }
          }

          // Platform-aware download CTA + dual-download modal.
          // Store URLs carry the site's attribution tags (Apple pt+ct, Play
          // referrer) — keep in sync with storeUrl() in src/lib/site.ts.
          (function () {
            var STORE = {
              ios: 'https://apps.apple.com/app/apple-store/id6789786971?pt=126963570&ct=Landing&mt=8',
              android:
                'https://play.google.com/store/apps/details?id=com.autonomic.journal&referrer=utm_source%3Dautonomic.care%26utm_medium%3Dreferral%26utm_campaign%3Dlanding'
            };

            // A page with its own campaign (the giveaway page) says so in
            // <meta name="aj-store-campaign">. Every store link on it then
            // carries that campaign instead of Landing: the nav button, the
            // modal's badges and its QR codes (built by `npm run qr` as
            // /qr-<platform>-<campaign>.svg). Same formula as storeUrl().
            var campMeta = document.querySelector('meta[name="aj-store-campaign"]');
            var CAMP = campMeta ? (campMeta.getAttribute('content') || '').trim() : '';
            if (CAMP) {
              STORE = {
                ios: 'https://apps.apple.com/app/apple-store/id6789786971?pt=126963570&ct=' + encodeURIComponent(CAMP) + '&mt=8',
                android:
                  'https://play.google.com/store/apps/details?id=com.autonomic.journal&referrer=' +
                  encodeURIComponent('utm_source=autonomic.care&utm_medium=referral&utm_campaign=' + CAMP.toLowerCase())
              };
              document.querySelectorAll('#dlModal [data-dl-store]').forEach(function (a) {
                var p = a.getAttribute('data-dl-store');
                if (STORE[p]) a.setAttribute('href', STORE[p]);
              });
              document.querySelectorAll('#dlModal .dlm-qr img').forEach(function (img) {
                var src = img.getAttribute('src') || '';
                img.setAttribute('src', src.replace(/^\/qr-(ios|android)\.svg$/, '/qr-$1-' + CAMP.toLowerCase() + '.svg'));
              });
            }
            var GLYPH = {
              ios: '<svg viewBox="0 0 384 512" fill="currentColor" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5c0 26.2 4.8 53.3 14.4 81.2 12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zM262.1 104.5c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 20-27.8 44.7-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>',
              // The Play Store mark, not the Android robot: the button opens
              // Play, and the robot head only fills the top third of a 24-box,
              // so it rendered as a flat sliver next to the label.
              android: '<svg viewBox="0 0 512 512" fill="currentColor" aria-hidden="true"><path d="M325.3 234.3 104.6 13l280.8 161.2-60.1 60.1zM47 0C34 6.8 25.3 19.2 25.3 35.3v441.3c0 16.1 8.7 28.5 21.7 35.3l256.6-256L47 0zm425.2 225.6-58.9-34.1-65.7 64.5 65.7 64.5 60.1-34.1c18-14.3 18-46.5-1.2-60.8zM104.6 499l280.8-161.2-60.1-60.1L104.6 499z"/></svg>'
            };

            function detectPlatform() {
              var ua = navigator.userAgent || '';
              if (/android/i.test(ua)) return 'android';
              // iPadOS 13+ reports as Mac; disambiguate by touch support.
              if (/iphone|ipad|ipod/i.test(ua)) return 'ios';
              if (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return 'ios';
              return null;
            }

            // Every download click fires TWO events: the store-specific one
            // (unchanged, so existing reports keep working) and a single
            // `download_click` carrying platform + placement, so total download
            // intent can be read off one event and split by where it came from
            // (blog end CTA, blog sidebar, nav, hero, modal, …).
            // `plan` splits free-framed CTAs from Pro-framed ones — without it
            // every button on the site reads as the same undifferentiated
            // "download" and paid intent can't be measured at all.
            // Every CTA click also fires ONE generic `cta_click` naming the CTA
            // (`cta`) and what kind it is (`cta_type`: download | store |
            // pitch), so "which CTA works" is one report. A store badge inside
            // the download modal is credited to the CTA that OPENED the modal
            // (`cta`), while its placement stays `download_modal`.
            var modalOpener = '', modalFeature = '';
            function trackDownload(platform, el, placement) {
              var place = placement || placementOf(el);
              var inModal = !!(el && el.closest && el.closest('#dlModal'));
              var cta = inModal ? (modalOpener || 'download_modal') : place;
              var plan = (el && el.getAttribute && el.getAttribute('data-dl-plan')) || 'unspecified';
              // The app feature the CTA was selling, on an article (data-feature).
              var fEl = inModal ? null : el && el.closest && el.closest('[data-feature]');
              var feature = fEl ? fEl.getAttribute('data-feature') : modalFeature;
              ajEvent(platform === 'android' ? 'play_store_click' : 'app_store_click', { placement: place, plan: plan, cta: cta, feature: feature });
              ajEvent('download_click', { platform: platform, placement: place, plan: plan, cta: cta, feature: feature });
              ajEvent('cta_click', { cta: cta, cta_type: inModal ? 'store' : 'download', platform: platform, plan: plan, feature: feature, via: inModal ? 'download_modal' : 'direct' });
              noteDownloadIntent(inModal ? 'store_badge_in_modal' : 'store_link', { placement: place, cta: cta, platform: platform, plan: plan, feature: feature });
            }
            window.ajTrackDownload = trackDownload;

            var platform = detectPlatform();

            // Modal open/close (desktop / unknown platform).
            var modal = document.getElementById('dlModal');
            var lastFocus = null;
            function openModal(trigger) {
              if (!modal) return;
              modalOpener = placementOf(trigger);
              var tf = trigger && trigger.closest && trigger.closest('[data-feature]');
              modalFeature = tf ? tf.getAttribute('data-feature') : '';
              ajEvent('download_modal_open', { placement: modalOpener, cta: modalOpener });
              ajEvent('cta_click', { cta: modalOpener, cta_type: 'download', platform: 'desktop', plan: (trigger && trigger.getAttribute && trigger.getAttribute('data-dl-plan')) || 'unspecified', feature: modalFeature, via: 'download_modal' });
              noteDownloadIntent('download_modal', { placement: modalOpener, cta: modalOpener, platform: 'desktop', plan: (trigger && trigger.getAttribute && trigger.getAttribute('data-dl-plan')) || 'unspecified', feature: modalFeature });
              lastFocus = document.activeElement;
              modal.hidden = false;
              document.body.style.overflow = 'hidden';
              var x = modal.querySelector('.dlm-x');
              if (x) x.focus();
            }
            function closeModal() {
              if (!modal || modal.hidden) return;
              modal.hidden = true;
              document.body.style.overflow = '';
              if (lastFocus && lastFocus.focus) lastFocus.focus();
            }
            if (modal) {
              modal.querySelectorAll('[data-dl-close]').forEach(function (el) {
                el.addEventListener('click', closeModal);
              });
              document.addEventListener('keydown', function (e) {
                if (e.key === 'Escape') closeModal();
              });
            }

            // Every download CTA: on a phone, deep-link straight to its store
            // with the platform glyph; otherwise open the modal.
            document.querySelectorAll('[data-dl-cta]').forEach(function (el) {
              if (platform) {
                el.setAttribute('href', STORE[platform]);
                var slot = el.querySelector('.btn-dl-ic');
                if (slot) { slot.innerHTML = GLYPH[platform]; el.classList.add('has-ic'); }
                el.addEventListener('click', function () { trackDownload(platform, el); });
              } else {
                el.addEventListener('click', function (e) {
                  e.preventDefault();
                  openModal(el);
                });
              }
            });
          })();

          // AI report picker: clicking a chip swaps the preview, title and
          // footer to that report. The full prompts run to 150 KB, so they live
          // in static/demo-prompts and are fetched up front once the section is
          // near, so Copy can write synchronously inside the click.
          var aiPrompts = {};
          (function () {
            var chips = document.querySelectorAll('.ai-chip[data-src]');
            var bodyEl = document.querySelector('.aip-body');
            var titleEl = document.querySelector('.aip-title');
            var noteEl = document.querySelector('.aip-note');
            if (!chips.length || !bodyEl) return;
            function esc(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
            function render(chip) {
              bodyEl.innerHTML = esc(chip.getAttribute('data-preview') || '').replace(/^([A-Z][A-Z0-9 ()/&.'-]*?:)/gm, '<span class="c-key">$1<\/span>');
              bodyEl.setAttribute('data-src', chip.getAttribute('data-src') || '');
              if (titleEl) titleEl.textContent = chip.getAttribute('data-title') || '';
              if (noteEl) noteEl.textContent = chip.getAttribute('data-foot') || '';
              chips.forEach(function (c) { c.classList.toggle('selected', c === chip); });
            }
            chips.forEach(function (c) {
              c.addEventListener('click', function () { render(c); });
            });
            function prefetch() {
              chips.forEach(function (c) {
                var src = c.getAttribute('data-src');
                if (src && !aiPrompts[src]) {
                  aiPrompts[src] = fetch(src).then(function (r) { return r.text(); }).then(function (t) { aiPrompts[src] = t; return t; });
                }
              });
            }
            var section = document.getElementById('ai');
            if (section && 'IntersectionObserver' in window) {
              var io = new IntersectionObserver(function (es) {
                if (es.some(function (e) { return e.isIntersecting; })) { io.disconnect(); prefetch(); }
              }, { rootMargin: '600px' });
              io.observe(section);
            } else prefetch();
          })();

          // Track store CTA clicks site-wide. Every store badge/link carries
          // data-dl-store="ios|android" (hero, download section, blog end-CTA,
          // insights sidebar, modal); the platform-aware nav CTA tracks itself.
          document.querySelectorAll('[data-dl-store]').forEach(function (el) {
            el.addEventListener('click', function () {
              var p = el.getAttribute('data-dl-store');
              if (typeof window.ajTrackDownload === 'function') window.ajTrackDownload(p === 'android' ? 'android' : 'ios', el);
            });
          });

          // ---- Engagement tracking -------------------------------------
          // Page chrome: present on every page and identical on all of them.
          // It no longer gates `blog_to_site` (see below) -- it names the
          // `via` split, so "left from the writing" and "left from the nav"
          // stay separable underneath one headcount.
          var AJ_CHROME = '#nav, #dlModal, footer, .bl-crumb, .awareness, .gva, .gvs, .gvm';
          // The blog itself, under both of the shapes it is served as. The
          // question is "did this reader go anywhere that is not the blog",
          // so this is the ONE thing a destination may not be.
          var AJ_BLOG_PAGE = /^\/(insights|blog)(\/|$)/;
          // /master is the private analytics dashboard, not a page of the
          // site. Nothing on the blog links to it and the tag does not load
          // there at all, so it can never be somebody exploring the product.
          var AJ_NOT_SITE_PAGE = /^\/master(\/|$)/;
          var blogToSiteSent = false;
          // One delegated listener maps every remaining interactive element
          // to a GA event (store badges/CTAs are wired individually above,
          // so they're excluded here to avoid double-counting).
          document.addEventListener('click', function (ev) {
            var t = ev.target;
            if (!t || !t.closest) return;
            // Store CTAs/badges are wired individually above (they resolve the
            // platform first); skip them here so nothing double-counts.
            if (t.closest('[data-dl-cta],[data-dl-store]')) return;
            // Leaving the blog for ANYWHERE THAT IS NOT THE BLOG:
            // `blog_to_site`, a key event, and the thing the whole blog is
            // for. The question it answers is "who explores past my writing",
            // and a reader who finishes an article and taps the brand logo has
            // explored past it just as surely as one who follows a link in the
            // prose -- so HOW they left is a split, not a condition.
            //
            // That is the one thing this has been wrong about twice, in both
            // directions. The first version fired on any same-origin link off
            // the blog and ALSO counted a reader who clicked a legal page, the
            // breadcrumb, or an anchor on the page they were already on; the
            // second excluded the chrome outright, which threw away the nav and
            // the footer -- the two commonest ways out of an article, and the
            // ones every page carries. The destination is what decides, and
            // `via` says which route was taken.
            //
            // THREE guards:
            //  1. the destination is not the blog (`AJ_BLOG_PAGE`, both of the
            //     shapes it is served under) and is a page of the site at all
            //     (`AJ_NOT_SITE_PAGE`);
            //  2. it is a different page, same origin -- an anchor on the
            //     current article is not leaving it;
            //  3. once per page load. A reader leaves the blog once; one who
            //     clicks through, comes back and clicks again is still one
            //     person doing one thing, and as a KEY event this has to be a
            //     headcount rather than a tap count.
            //
            // Scripted traffic is handled upstream: `navigator.webdriver` is
            // folded into `_ajBlocked`, so a link checker clicking every anchor
            // on the page never loads the tag at all. That guard is what makes
            // counting the chrome safe.
            //
            // It fires ALONGSIDE whatever the link reports below. Downloads are
            // excluded above; they are download_click.
            var bl = !blogToSiteSent && (pageType === 'blog_article' || pageType === 'blog_hub')
              ? t.closest('a[href]') : null;
            if (bl) {
              var bu = null;
              try { bu = new URL(bl.getAttribute('href'), window.location.href); } catch (e) { /* bad href */ }
              if (bu && bu.origin === window.location.origin && bu.pathname !== pagePath &&
                  !AJ_BLOG_PAGE.test(bu.pathname) && !AJ_NOT_SITE_PAGE.test(bu.pathname)) {
                blogToSiteSent = true;
                ajEvent('blog_to_site', {
                  target: bu.pathname,
                  cta: ctaOf(bl) || placementOf(bl),
                  from_type: pageType,
                  via: bl.closest(AJ_CHROME) ? 'chrome' : 'body'
                });
              }
            }
            var el;
            // Giveaway page store badges are wired in the giveaway block below.
            if (t.closest('.gvp-badge')) return;
            if ((el = t.closest('a[href*="dysautonomia-awareness-giveaway"]'))) {
              // Any promo INTO the giveaway page (nav ribbon, home banner, blog
              // sidebar card, blog mobile banner, a link in an article). The
              // placement is also remembered for the page's own arrival event.
              var gvPlace = placementOf(el);
              try { sessionStorage.setItem('aj-gv-from', gvPlace); } catch (e) { /* private mode */ }
              ajEvent('giveaway_promo_click', { placement: gvPlace });
              return;
            }
            if ((el = t.closest('.gvp a, .gvp .gvp-social'))) {
              // On the giveaway page itself.
              var gh = el.getAttribute('href') || '';
              if (el.classList.contains('gvp-cta')) {
                ajEvent('giveaway_cta_click', { placement: placementOf(el), from: gvFrom() });
              } else if (el.classList.contains('gvp-social')) {
                // Also counts taps on a platform whose post is not up yet:
                // that is demand for it.
                var net = (el.getAttribute('aria-label') || '').replace(/^Tag a friend on\s+|\s+post coming soon$/g, '');
                ajEvent('giveaway_social_click', { network: net, available: el.classList.contains('is-off') ? 'no' : 'yes' });
              } else if (gh === '#rules') {
                ajEvent('giveaway_rules_click', { placement: placementOf(el) });
              } else if (/^mailto:/i.test(gh)) {
                ajEvent('giveaway_email_click', { placement: placementOf(el) });
              } else {
                ajEvent('giveaway_link_click', { target: gh, placement: placementOf(el) });
              }
              return;
            }
            if ((el = t.closest('[data-wa-go],[data-wa-act],[data-wa-log]'))) {
              // Watch interactive (#watch): which face/button was tapped.
              var action = el.getAttribute('data-wa-log') ? 'log:' + el.getAttribute('data-wa-log')
                : el.getAttribute('data-wa-act') || 'go:' + el.getAttribute('data-wa-go');
              ajEvent('watch_interact', { action: action });
            } else if ((el = t.closest('.ai-chip[data-src]'))) {
              // AI interactive: report chip selected.
              ajEvent('ai_report_select', { report: el.getAttribute('data-report') || el.getAttribute('data-title') || '' });
            } else if ((el = t.closest('.aip-copy'))) {
              // AI interactive: prompt copied (which report was showing).
              var sel = document.querySelector('.ai-chip.selected[data-report]');
              ajEvent('ai_prompt_copy', { report: sel ? sel.getAttribute('data-report') : '' });
            } else if ((el = t.closest('a[data-cta]'))) {
              // A named link that is not a download: a pitch into a feature,
              // condition or comparison page. Fired twice, like a download: the
              // specific event and the generic cta_click.
              var cn = el.getAttribute('data-cta') || '';
              var ch = el.getAttribute('href') || '';
              var feat = (el.closest('[data-feature]') || el).getAttribute('data-feature') || '';
              ajEvent('app_pitch_click', { cta: cn, target: ch, feature: feat });
              ajEvent('cta_click', { cta: cn, cta_type: 'pitch', target: ch, feature: feat });
            } else if ((el = t.closest('.bl-toc a'))) {
              ajEvent('toc_click', { section: (el.textContent || '').replace(/^\d+/, '').trim().slice(0, 80) });
            } else if ((el = t.closest('.bl-sym[data-sym]'))) {
              ajEvent('symptom_open', { symptom: el.getAttribute('data-sym') || '' });
            } else if ((el = t.closest('.article-prose a'))) {
              // Any link inside the article body: cross-links between articles,
              // citations out to studies, in-page jumps.
              var ph = el.getAttribute('href') || '';
              ajEvent('article_link_click', {
                target: ph,
                link_type: /^https?:/i.test(ph) && ph.indexOf('autonomic.care') < 0 ? 'external'
                  : ph.charAt(0) === '#' ? 'anchor' : 'internal',
                text: (el.textContent || '').trim().slice(0, 100)
              });
            } else if ((el = t.closest('.bl-rail-share a'))) {
              ajEvent('article_share', { network: el.getAttribute('data-share') || '' });
            } else if ((el = t.closest('.bl-card, .bl-row, .bl-pillars a, .bl-topic-a, .bl-latest, .bl-feat'))) {
              // Every route into an article, tagged with the list it came from
              // (data-list on the section: blog_new, blog_start_here,
              // blog_topics, blog_symptom, topic_group, topic_newest, related,
              // condition_latest…), or the hero's latest question.
              var list = el.closest('[data-list]');
              ajEvent('article_click', {
                article_target: slugOf(el.getAttribute('href')),
                placement: el.classList.contains('bl-latest') ? 'blog_latest' : list ? list.getAttribute('data-list') : 'list'
              });
            } else if ((el = t.closest('.bl-byline-n, .bl-author h2 a'))) {
              ajEvent('author_click', { author: (el.textContent || '').trim().slice(0, 60) });
            } else if ((el = t.closest('.bl-chip, .bl-atags a, .bl-topic-h, .insights-pill, .bl-crumb a, .bl-headlink'))) {
              ajEvent('topic_click', { target: el.getAttribute('href') || '', text: (el.textContent || '').trim().slice(0, 60) });
            } else if (t.closest('#burger')) {
              ajEvent('nav_click', { target: 'menu' });
            } else if ((el = t.closest('#nav a'))) {
              if (el.hasAttribute('data-dl-cta') || el.hasAttribute('data-dl-store')) return;
              ajEvent('nav_click', { target: el.getAttribute('href') || '' });
            } else if ((el = t.closest('a[href]'))) {
              // Any other link: in-page jumps, question-grid and feature cards,
              // footer links, outbound. Tagged with where it sits.
              if (el.hasAttribute('data-dl-cta') || el.hasAttribute('data-dl-store')) return;
              var lh = el.getAttribute('href') || '';
              ajEvent('link_click', {
                target: lh,
                placement: placementOf(el),
                link_type: /^https?:/i.test(lh) && lh.indexOf('autonomic.care') < 0 ? 'external' : lh.charAt(0) === '#' || lh.indexOf('/#') === 0 ? 'anchor' : 'internal',
                text: (el.textContent || '').trim().slice(0, 80)
              });
            }
          });

          // FAQ (and any other <details>) opens. Toggle doesn't bubble, so
          // listen in the capture phase. Strip the "+" indicator glyph.
          document.addEventListener('toggle', function (ev) {
            var d = ev.target;
            if (d && d.tagName === 'DETAILS' && d.open) {
              var s = d.querySelector('summary');
              var label = s ? s.textContent.replace(/\+\s*$/, '').trim().slice(0, 100) : '';
              // A <details> inside the article body is expandable content, not
              // an FAQ answer; keep the two apart in reporting.
              if (d.closest('.article-prose')) ajEvent('article_details_open', { label: label });
              else ajEvent('faq_open', { question: label });
            }
          }, true);

          // ---- Blog content interaction ---------------------------------
          // In-article calculators (.metric-calc, written into the markdown):
          // one `calc_use` the first time a widget is touched, plus a
          // `calc_change` per committed field so we can see which inputs the
          // reader actually explores.
          document.querySelectorAll('.metric-calc').forEach(function (calc, i) {
            var head = calc.querySelector('.mc-head');
            var name = (head ? head.textContent : '').trim().slice(0, 60) || 'calculator-' + (i + 1);
            var used = false;
            calc.addEventListener('change', function (ev) {
              var f = ev.target;
              if (!f || !f.tagName || !/^(INPUT|SELECT|TEXTAREA)$/.test(f.tagName)) return;
              if (!used) { used = true; ajEvent('calc_use', { calc: name }); }
              var lab = f.closest('.mc-field');
              var labEl = lab ? lab.querySelector('.mc-label') : null;
              ajEvent('calc_change', {
                calc: name,
                field: (labEl ? labEl.textContent : f.name || f.type || '').trim().slice(0, 60)
              });
            });
          });

          if (proseEl) {
            // Reading depth through the article body: 25/50/75/100% of the
            // prose scrolled past the bottom of the viewport, once each.
            var depthHit = {};
            var onDepth = function () {
              var box = proseEl.getBoundingClientRect();
              var total = box.height;
              if (total <= 0) return;
              var read = Math.min(total, Math.max(0, window.innerHeight - box.top));
              var pct = Math.floor((read / total) * 100);
              [25, 50, 75, 100].forEach(function (m) {
                if (pct >= m && !depthHit[m]) {
                  depthHit[m] = true;
                  ajEvent('article_scroll', { percent: m });
                }
              });
              if (depthHit[100]) window.removeEventListener('scroll', onDepth);
            };
            window.addEventListener('scroll', onDepth, { passive: true });
            onDepth();

            // Copying out of an article is a strong "this was useful" signal.
            var copiedOnce = false;
            proseEl.addEventListener('copy', function () {
              if (copiedOnce) return;
              copiedOnce = true;
              ajEvent('article_copy');
            });
          }
          // --------------------------------------------------------------

          // CTA impressions: `cta_view` once per named CTA per page load when
          // half of it is on screen, so every cta_click has a denominator
          // (click-through = cta_click / cta_view, split by `cta`). The nav
          // button is always on screen and reports itself elsewhere, so it is
          // left out.
          if (window.IntersectionObserver) {
            var ctaObs = new IntersectionObserver(function (entries) {
              entries.forEach(function (en) {
                if (!en.isIntersecting) return;
                ctaObs.unobserve(en.target);
                var fe = en.target.closest('[data-feature]');
                var f = fe ? fe.getAttribute('data-feature') : '';
                ajEvent('cta_view', { cta: en.target.getAttribute('data-cta'), feature: f });
              });
            }, { threshold: 0.5 });
            document.querySelectorAll('[data-cta]').forEach(function (el) {
              if (el.closest('#nav') || el.closest('footer')) return;
              // A named link inside a named block is counted by its block.
              if (el.parentElement && el.parentElement.closest('[data-cta]')) return;
              ctaObs.observe(el);
            });
          }

          // Section views: fire once per page load when a section crosses the
          // middle band of the viewport (works for sections taller than the
          // screen, where a visible-fraction threshold would never trip).
          // Sections are keyed by id, falling back to a slug of aria-label.
          if (window.IntersectionObserver) {
            var seenSections = {};
            var sectionObs = new IntersectionObserver(function (entries) {
              entries.forEach(function (en) {
                if (!en.isIntersecting) return;
                var sec = en.target;
                var key = sec.id || (sec.getAttribute('aria-label') || '').toLowerCase().replace(/[^a-z0-9]+/g, '-');
                if (!key || seenSections[key]) return;
                seenSections[key] = true;
                sectionObs.unobserve(sec);
                ajEvent('section_view', { section: key });
              });
            }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
            document.querySelectorAll('section').forEach(function (s) {
              if (s.id || s.getAttribute('aria-label')) sectionObs.observe(s);
            });
          }
          // --------------------------------------------------------------

          // ---- Dysautonomia Awareness Month giveaway -------------------
          // Promo IMPRESSIONS, so every giveaway_promo_click has a denominator:
          // once per page load per surface, when half of it is on screen (a
          // surface hidden at this width, like the mobile banner on desktop,
          // never intersects and so never counts). The nav ribbon is on every
          // page and needs none: page views are its denominator.
          if (window.IntersectionObserver) {
            var gvSeen = {};
            var gvObs = new IntersectionObserver(function (entries) {
              entries.forEach(function (en) {
                if (!en.isIntersecting) return;
                var where = placementOf(en.target);
                gvObs.unobserve(en.target);
                if (gvSeen[where]) return;
                gvSeen[where] = true;
                ajEvent('giveaway_promo_view', { placement: where });
              });
            }, { threshold: 0.5 });
            document.querySelectorAll('.gva, .gvs, .gvm, .gvx-clock, .gvx-end').forEach(function (n) { gvObs.observe(n); });
          }

          var gvPage = document.querySelector('.gvp');
          if (gvPage) {
            var from = gvFrom();
            ajEvent('giveaway_page_arrival', { from: from, referrer: document.referrer ? (function () {
              try { return new URL(document.referrer).hostname; } catch (e) { return 'unknown'; }
            })() : 'none' });

            // Store badges: counted as downloads like every other store CTA
            // (so the site-wide download numbers include them), and again as a
            // giveaway download carrying the promo that brought them here.
            gvPage.querySelectorAll('.gvp-badge').forEach(function (b) {
              b.addEventListener('click', function () {
                var platform = /play\.google/.test(b.getAttribute('href') || '') ? 'android' : 'ios';
                var place = placementOf(b);
                if (typeof window.ajTrackDownload === 'function') window.ajTrackDownload(platform, b, place);
                ajEvent('giveaway_download_click', { platform: platform, placement: place, from: from });
              });
            });

            // Which parts of the page were actually reached. Its sections carry
            // no ids, so the site-wide section_view cannot see most of them.
            if (window.IntersectionObserver) {
              var gvSections = [
                ['hero', '.gvp-hero'], ['letter', '.gvp-letter'], ['how_to_enter', '#enter'],
                ['prizes', '.gvp-grand'], ['dates', '.gvp-dates'], ['rules', '#rules'], ['closing', '.gvp-end']
              ];
              var gvSecObs = new IntersectionObserver(function (entries) {
                entries.forEach(function (en) {
                  if (!en.isIntersecting) return;
                  gvSecObs.unobserve(en.target);
                  ajEvent('giveaway_section_view', { section: en.target.getAttribute('data-gv-sec'), from: from });
                });
              }, { rootMargin: '-40% 0px -40% 0px', threshold: 0 });
              gvSections.forEach(function (pair) {
                var n = gvPage.querySelector(pair[1]);
                if (!n) return;
                n.setAttribute('data-gv-sec', pair[0]);
                gvSecObs.observe(n);
              });
            }

            // Scroll depth through the whole page, 25/50/75/100 once each.
            var gvDepth = {};
            var onGvDepth = function () {
              var box = gvPage.getBoundingClientRect();
              if (box.height <= 0) return;
              var pct = Math.floor((Math.min(box.height, Math.max(0, window.innerHeight - box.top)) / box.height) * 100);
              [25, 50, 75, 100].forEach(function (m) {
                if (pct >= m && !gvDepth[m]) { gvDepth[m] = true; ajEvent('giveaway_scroll', { percent: m, from: from }); }
              });
              if (gvDepth[100]) window.removeEventListener('scroll', onGvDepth);
            };
            window.addEventListener('scroll', onGvDepth, { passive: true });
            onGvDepth();

            // Time actually spent reading: one event at 15s and one at 60s of
            // the tab being visible, so a bounce and a read are told apart.
            var gvVisibleMs = 0;
            var gvLast = Date.now();
            var gvMarks = { 15: false, 60: false };
            var gvTick = setInterval(function () {
              var now = Date.now();
              if (!document.hidden) gvVisibleMs += now - gvLast;
              gvLast = now;
              [15, 60].forEach(function (sec) {
                if (!gvMarks[sec] && gvVisibleMs >= sec * 1000) {
                  gvMarks[sec] = true;
                  ajEvent('giveaway_engaged', { seconds: sec, from: from });
                }
              });
              if (gvMarks[60]) clearInterval(gvTick);
            }, 1000);
          }
          // --------------------------------------------------------------

          var copyBtn = document.querySelector('.aip-copy');
          if (copyBtn) {
            var promptEl = document.querySelector('.aip-body');
            copyBtn.addEventListener('click', function () {
              var src = promptEl ? promptEl.getAttribute('data-src') || '' : '';
              var got = aiPrompts[src];
              var label = copyBtn.textContent;
              var done = function (ok) {
                copyBtn.textContent = ok ? 'Copied ✓' : 'Copy failed';
                setTimeout(function () { copyBtn.textContent = label; }, 1600);
              };
              var cb = navigator.clipboard;
              if (!cb) { done(false); return; }
              if (typeof got === 'string') { cb.writeText(got).then(function () { done(true); }, function () { done(false); }); return; }
              // Not fetched yet: hand the clipboard a promise, which keeps the
              // write inside the click for Safari.
              var text = got || fetch(src).then(function (r) { return r.text(); });
              if (window.ClipboardItem && cb.write) {
                cb.write([new ClipboardItem({ 'text/plain': Promise.resolve(text).then(function (t) { return new Blob([t], { type: 'text/plain' }); }) })]).then(function () { done(true); }, function () { done(false); });
              } else {
                Promise.resolve(text).then(function (t) { return cb.writeText(t); }).then(function () { done(true); }, function () { done(false); });
              }
            });
          }
        }

        if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
        else init();
      })();
    </script>
  </body>
</html>
