version: 0.2

env:
  variables:
    SLS_STAGE: "prod"
    SLS_REGION: "us-west-2"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd landing
      - npm ci
      - cd ..
      # Backend for the /master dashboard
      - cd sls
      - npm ci
      - cd ..
      # PINNED. An unpinned global install is what broke this pipeline for
      # three days: v4.41 began resolving its deployment bucket through an SSM
      # parameter the CodeBuild role had no grant for, so every `sls deploy`
      # failed with no commit to blame it on. Bump this deliberately, and
      # expect to check the role's permissions when you do.
      - npm i -g serverless@4.41.0

  build:
    commands:
      - cd landing
      - npm run build
      - cd ..

  post_build:
    commands:
      # Deploy landing site to S3 (includes /master, the analytics dashboard,
      # prerendered from landing/master/ by the build above)
      #
      # `download/` is fenced off. Campaign download pages (/download/facebook
      # and friends) are written into that prefix by the master dashboard's API
      # at the moment a campaign is saved, so they exist in the bucket and never
      # in the build output — and an unqualified `--delete` would take every one
      # of them out on the next push to main. The exclude protects them; the
      # re-include hands back the three files the build genuinely owns
      # (index.html and its .br/.gz twins), which are /download itself.
      # See sls/lambdas/api/links.js; move one of these two things and you
      # must move the other.
      - aws s3 sync landing/build/ s3://$S3_BUCKET --delete --exclude "download/*" --include "download/index.html*"
      # Invalidate CloudFront cache
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
      # Deploy the master dashboard's API + DynamoDB table
      - cd sls
      - sls deploy --stage $SLS_STAGE --region $SLS_REGION --conceal
