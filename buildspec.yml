version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - cd landing
      - npm ci
      - cd ..

  build:
    commands:
      - cd landing
      - npm run build
      - cd ..

  post_build:
    commands:
      # Deploy landing site to S3
      - aws s3 sync landing/build/ s3://$S3_BUCKET --delete
      # Invalidate CloudFront cache
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
