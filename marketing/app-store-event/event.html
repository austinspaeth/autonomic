<!doctype html>
<!--
  App Store in-app event media for the Dysautonomia Awareness Month giveaway,
  rendered by render.mjs twice: the 16:9 event card and the 9:16 event details
  page (body class `card` / `detail`). The watch placeholder is filled from the
  landing site's PrizeWatchArt.svelte, so the watch matches the giveaway page.

  Both set the ribbon left and the watch right. No text: the App Store lays the badge, event name and short description
  over the bottom of both, so the art stays in the upper part.
-->
<html><head><meta charset="utf-8"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#060607;overflow:hidden}
  .stage{position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 50% 50%, #0b1413 0%, #060607 70%)}
  body.card .stage{width:1920px;height:1080px}
  body.detail .stage{width:1080px;height:1920px}

  /* ONE glow, centred on the ribbon: the light comes from the ribbon and
     reaches back behind the watch, it is not the watch's own. */
  .glow{position:absolute;border-radius:50%;pointer-events:none;
    background:radial-gradient(closest-side,rgba(45,212,191,.34) 0%,rgba(45,212,191,.16) 30%,rgba(45,212,191,.09) 62%,rgba(45,212,191,0) 100%)}

  .ribbon,.watch{position:absolute}
  .ribbon svg,.watch svg{display:block;width:100%;height:100%;overflow:visible}
  .ribbon{filter:drop-shadow(0 0 36px rgba(45,212,191,.55)) drop-shadow(0 0 90px rgba(45,212,191,.3))}
  .watch{filter:drop-shadow(0 30px 60px rgba(0,0,0,.6))}


  /* ── 16:9 card: ribbon left, watch right, with room between them ── */
  body.card .ribbon{left:520px;top:292px;width:288px;height:403px}
  body.card .watch{left:1060px;top:240px;width:392px;height:490px}
  body.card .glow{left:-96px;top:-267px;width:1520px;height:1520px}

  /* ── 9:16 details: ribbon left, watch right, like the card ── */
  body.detail .ribbon{left:200px;top:443px;width:250px;height:350px}
  body.detail .watch{left:580px;top:400px;width:350px;height:437px}
  body.detail .glow{left:-315px;top:-22px;width:1280px;height:1280px}
</style></head>
<body class="%%LAYOUT%%">
<div class="stage">
  <div class="glow"></div>

  <div class="ribbon">
    <svg viewBox="0 0 100 140">
      <defs>
        <linearGradient id="rg" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="140">
          <stop offset="0%" stop-color="#5eead4"/><stop offset="55%" stop-color="#14b8a6"/><stop offset="100%" stop-color="#0f766e"/>
        </linearGradient>
        <linearGradient id="rs" gradientUnits="userSpaceOnUse" x1="10" y1="10" x2="70" y2="70">
          <stop offset="0%" stop-color="#ecfeff" stop-opacity="0"/><stop offset="50%" stop-color="#ecfeff" stop-opacity=".55"/><stop offset="100%" stop-color="#ecfeff" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <path d="M80 134 L43 63 C29 37 32 9 50 9 C68 9 71 37 57 63 L20 134" fill="none" stroke="url(#rg)" stroke-width="17" stroke-linejoin="round"/>
      <path d="M80 134 L43 63 C29 37 32 9 50 9 C68 9 71 37 57 63 L20 134" fill="none" stroke="url(#rs)" stroke-width="17" stroke-linejoin="round" style="mix-blend-mode:screen"/>
      <path d="M80 134 L43 63 C29 37 32 9 50 9 C68 9 71 37 57 63 L20 134" fill="none" stroke="#ecfeff" stroke-opacity=".25" stroke-width="1.4" stroke-linejoin="round" transform="translate(-4 -2)"/>
    </svg>
  </div>
  <div class="watch">%%WATCH%%</div>

</div>
</body></html>
