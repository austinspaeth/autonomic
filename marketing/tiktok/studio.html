<!doctype html>
<!--
  Autonomic · Creative studio for TikTok / Instagram slideshows.

  Run it:  node marketing/tiktok/studio.mjs   (opens http://localhost:4747)

  Content lives in the repo, one folder per set:
    sets/<YYYY-MM-DD-name>/set.json   name, created date, notes, creatives (copy, captions, image briefs)
    sets/<YYYY-MM-DD-name>/img/       photos placed in the studio
    sets/<YYYY-MM-DD-name>/video/     clips imported in the Composer (composer.js + composer.css: the video view)
  The studio lists every set (newest first) in the picker at the top left. Dropping a photo
  onto a phone writes it into the set's img/ folder; editing slide text or the Position
  slider writes set.json. Git is the history.

  set.json shape: see sets/2026-10-06-awareness-launch/set.json. Per slide:
    layout  hook | photo | list | phone (mock: "watch" swaps the phone for an Apple Watch) | logo        text  one string per paragraph, *asterisks* = teal, :ribbon: and :awesome: = inline icons
    cta     adds the Autonomic lockup                 fine  optional small print
    img     { src, pos, source: unsplash|mine|app, search, shows, frame }

  Every slide is a real 1080×1920 canvas. On screen it sits in an iPhone wearing the TikTok,
  Instagram Reels or Instagram Feed interface; exports are always the clean canvas.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides Studio</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Grand+Hotel&family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Caveat:wght@500..700&family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Manrope:wght@200..800&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link rel="stylesheet" href="composer.css">


<style>
:root{
  --bg:#0b0f10; --ink:#f2f5f4; --muted:#b9c6c4; --dim:#7f908e; --teal:#30c5b0;
  --z:1;
  --page:#060809; --glass:rgba(255,255,255,.035); --glass2:rgba(255,255,255,.06);
  --hair:rgba(255,255,255,.08); --hair2:rgba(255,255,255,.14); --txt:#e9efee; --sub:#8b9a98;
  --amber:#f2b45a;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--page)}
body{min-height:100vh;color:var(--txt);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:14px;font-feature-settings:"cv11","tnum";-webkit-font-smoothing:antialiased;
  background:radial-gradient(1400px 700px at 20% -20%,rgba(48,197,176,.06),transparent 60%),var(--page);background-attachment:fixed}
button,input,label{font:inherit;color:inherit}
svg{display:block}

/* ================= studio chrome · one face, three weights, sentence case ================= */
.bar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:20px;padding:14px 40px;
  background:rgba(10,13,14,.8);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600}
.brand .ic{width:28px;height:28px;border-radius:8px;background-size:cover;box-shadow:0 0 0 1px var(--hair)}
.brand small{display:none}

.seg{position:relative;display:flex;padding:3px;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px var(--hair)}
.seg button{position:relative;z-index:1;display:flex;align-items:center;gap:7px;border:0;background:none;cursor:pointer;
  padding:6px 13px;border-radius:7px;font-size:13px;font-weight:500;color:var(--sub);transition:color .2s}
.seg button svg{width:14px;height:14px}
.seg button.on{color:var(--txt)}
.seg .pill{position:absolute;z-index:0;top:3px;bottom:3px;border-radius:7px;background:rgba(255,255,255,.09);
  transition:left .3s cubic-bezier(.3,1.2,.5,1),width .3s cubic-bezier(.3,1.2,.5,1)}
.spacer{flex:1}
.sw{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer;user-select:none}
.sw i{position:relative;width:28px;height:16px;border-radius:8px;background:rgba(255,255,255,.12);transition:background .2s}
.sw i::after{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on i{background:var(--teal)}
.sw.on i::after{transform:translateX(12px)}
.sw.on{color:var(--txt)}
.zoom{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub);font-weight:500}
input[type=range]{-webkit-appearance:none;appearance:none;height:3px;border-radius:2px;background:rgba(255,255,255,.12);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;cursor:pointer}
.zoom input{width:96px}
.cta{display:flex;align-items:center;gap:7px;border:0;cursor:pointer;padding:7px 13px;border-radius:8px;font-size:13px;font-weight:600;
  color:#04201b;background:var(--teal)}
.cta:hover{filter:brightness(1.08)}
.cta svg{width:14px;height:14px}
.ghost{display:flex;align-items:center;gap:6px;border:0;cursor:pointer;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:500;
  background:none;box-shadow:inset 0 0 0 1px var(--hair);color:var(--txt)}
.ghost:hover{background:rgba(255,255,255,.05)}
.ghost svg{width:14px;height:14px}

main{padding:40px 40px 140px}
.hero{margin-bottom:56px;max-width:900px}
.hero h1{font-size:28px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.hero p{font-size:14px;color:var(--sub);line-height:1.6;margin-top:6px;max-width:680px}
.h-k{font-size:13px;color:var(--sub);margin-bottom:6px}

.creative{margin-bottom:64px}
.c-head{display:flex;align-items:flex-end;gap:24px;max-width:1860px;margin-bottom:6px}
.c-main{flex:1;min-width:0}
.c-title{font-size:18px;font-weight:600;letter-spacing:-.01em}
.c-num{color:var(--sub);font-weight:400;margin-right:10px}
.c-goal{font-size:13.5px;color:var(--sub);margin-top:3px}
.c-actions{display:flex;align-items:center;gap:14px}
.c-prog{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--sub)}
.c-prog .ready{font-size:12px;font-weight:600;color:var(--teal);background:rgba(45,212,191,.12);padding:3px 9px;border-radius:999px;margin-right:4px}
.c-prog .ready[hidden]{display:none}
.c-prog .meter{width:64px;height:3px;border-radius:2px;background:rgba(255,255,255,.08);overflow:hidden}
.c-prog .meter i{display:block;height:100%;background:var(--teal);transition:width .3s}
.c-cap{display:flex;align-items:flex-start;gap:10px;max-width:860px;margin:10px 0 22px}
.c-cap.c-title{margin-bottom:-14px}
.c-cap.c-title .t{color:var(--txt);font-weight:500}
.c-cap .t{font-size:13px;line-height:1.55;color:var(--sub);flex:1}
.c-cap .t b{color:var(--txt);font-weight:500;margin-right:6px}
.c-cap .ib{width:26px;height:26px;margin-top:-3px}

.row{display:flex;gap:32px;overflow-x:auto;padding:6px 4px 18px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.12) transparent}
.card{flex:none;width:calc(421px * var(--z));display:flex;flex-direction:column;gap:12px}
.dev-box{position:relative;width:calc(421px * var(--z));height:calc(880px * var(--z))}
.dev-box.drag .device{box-shadow:0 0 0 3px var(--teal),0 40px 90px rgba(0,0,0,.7)}
.dev-box .dropnote{position:absolute;inset:0;display:none;align-items:center;justify-content:center;z-index:5;border-radius:calc(68px * var(--z));
  background:rgba(6,30,27,.5);backdrop-filter:blur(3px);font-weight:500;font-size:14px;color:#fff;pointer-events:none}
.dev-box.drag .dropnote{display:flex}
.device-scale{transform:scale(var(--z));transform-origin:0 0;width:421px;height:880px}

.s-head{display:flex;align-items:center;gap:4px;margin-top:4px}
.s-lbl{font-size:13px;font-weight:500;color:var(--txt);margin-right:auto}
.s-lbl span{color:var(--sub);font-weight:400}
.ib{width:30px;height:30px;border-radius:8px;border:0;cursor:pointer;display:grid;place-items:center;background:none;color:var(--sub);transition:all .15s}
.ib:hover{color:var(--txt);background:rgba(255,255,255,.07)}
.ib svg{width:15px;height:15px}
.brief{padding:12px 14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair)}
.b-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;font-size:12.5px}
.chip{display:flex;align-items:center;gap:6px;font-weight:500;color:var(--txt)}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:#9aa6a4}
.chip.mine::before{background:var(--amber)}
.chip.app::before{background:var(--teal)}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--sub)}
.status i{display:none}
.status.set{color:var(--teal)}
.b-row{display:grid;grid-template-columns:58px 1fr;gap:10px;font-size:13px;line-height:1.5}
.b-row + .b-row{margin-top:6px}
.b-row dt{color:var(--sub)}
.b-row dd{color:#cfd8d7}
.b-row dd.credit{color:var(--sub);font-size:12px}
.b-foot{display:flex;align-items:center;gap:12px;margin-top:10px;padding-top:10px;border-top:1px solid var(--hair);font-size:12.5px;color:var(--sub)}
.b-foot a{color:var(--txt);text-decoration:none;display:flex;align-items:center;gap:5px}
.b-foot a svg{width:12px;height:12px;color:var(--sub)}
.b-foot a:hover{color:var(--teal)}
.b-foot label{display:flex;align-items:center;gap:8px;margin-left:auto}
.tune{padding:10px 14px 12px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--hair)}
.t-head{display:flex;align-items:center;justify-content:space-between;margin:-4px -6px 4px 0;font-size:12.5px;font-weight:500;color:var(--txt)}
.t-head .ib{width:26px;height:26px}
.t-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;font-size:12.5px;color:var(--sub)}
.t-grid label{display:grid;grid-template-columns:52px 1fr;align-items:center;gap:8px;min-width:0}
.t-grid input[type=range]{width:100%;min-width:0}
.t-grid label.tint{grid-template-columns:52px auto;justify-content:start}
.t-grid input[type=color]{width:30px;height:20px;padding:0;border:1px solid var(--hair);border-radius:6px;background:none;cursor:pointer}
.t-grid input[type=color]::-webkit-color-swatch-wrapper{padding:2px}
.t-grid input[type=color]::-webkit-color-swatch{border:none;border-radius:4px}
.warn{color:var(--amber);font-size:12.5px;margin-top:8px}

/* video note: only present when a slide needs footage rather than a still */
.b-row.video dt{color:#f2b45a}
.b-row.video dd{color:var(--txt)}

/* interface off: the slide alone, no phone */
body:not(.ui-on) .dev-box{width:calc(393px * var(--z));height:calc(699px * var(--z));margin-left:calc(14px * var(--z))}
body:not(.ui-on) .device-scale{width:393px;height:699px}
body:not(.ui-on) .device{width:393px;height:699px;padding:0;background:none;box-shadow:0 30px 70px rgba(0,0,0,.5);border-radius:14px}
body:not(.ui-on) .device::before,body:not(.ui-on) .btn-l,body:not(.ui-on) .btn-r,body:not(.ui-on) .sb,
body:not(.ui-on) .island,body:not(.ui-on) .home-ind,body:not(.ui-on) .glare{display:none}
body:not(.ui-on) .bezel{padding:0;background:none;box-shadow:none;border-radius:14px}
body:not(.ui-on) .screen{width:393px;height:699px;border-radius:14px}
body:not(.ui-on) .content{top:0 !important;height:699px !important}
body:not(.ui-on) .content > .slide{transform:scale(.363889) !important}

/* views */
#shots{display:none;padding:40px 40px 140px}
body.view-shots #app{display:none}
body.view-shots #shots{display:block}
body.view-shots .only-slides{display:none}
#composer{display:none;padding:40px 40px 80px}
body.view-composer #app,body.view-composer #shots,body.view-composer .only-slides,body.view-composer #saveAll{display:none}
body.view-composer #composer{display:block}
.card.flash .dev-box{animation:flash 1.4s ease-out}
@keyframes flash{0%,40%{filter:drop-shadow(0 0 0 rgba(48,197,176,0))}20%{filter:drop-shadow(0 0 24px rgba(48,197,176,.8))}}

/* shot list */
.sl-group{max-width:1180px;margin-bottom:44px}
.sl-head{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
.sl-head h2{font-size:18px;font-weight:600}
.sl-head span{font-size:13px;color:var(--sub)}
.sl-sub{font-size:13px;color:var(--sub);margin-bottom:14px}
.sl-row{display:grid;grid-template-columns:28px 58px 1fr 130px;gap:16px;align-items:center;padding:12px 4px;border-top:1px solid var(--hair)}
.sl-row:last-child{border-bottom:1px solid var(--hair)}
.sl-row.done .sl-body{opacity:.55}
.sl-check{width:20px;height:20px;border-radius:6px;border:1.5px solid rgba(255,255,255,.3);display:grid;place-items:center;cursor:pointer;background:none}
.sl-check.on{background:var(--teal);border-color:var(--teal)}
.sl-check.on::after{content:"";width:9px;height:5px;border:2px solid #04201b;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.sl-check:disabled{cursor:default}
.sl-thumb{width:58px;height:103px;border-radius:8px;background:#151c1e center/cover no-repeat;box-shadow:inset 0 0 0 1px var(--hair)}
.sl-thumb.empty{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.04) 0 6px,transparent 6px 12px)}
.sl-thumb{cursor:pointer;display:grid;place-items:center;color:var(--sub);transition:box-shadow .15s,transform .15s}
.sl-thumb svg{width:18px;height:18px}
.sl-thumb:hover{box-shadow:inset 0 0 0 1.5px rgba(48,197,176,.6);color:var(--teal)}
.sl-thumb.over{box-shadow:inset 0 0 0 2px var(--teal),0 0 0 4px rgba(48,197,176,.2);transform:scale(1.04);color:var(--teal)}
.sl-thumb.busy{opacity:.5}
.sl-row.dragging{background:rgba(48,197,176,.05)}
.sl-body{min-width:0}
.sl-where{font-size:12.5px;color:var(--sub)}
.sl-where b{color:var(--txt);font-weight:500}
.sl-what{font-size:14px;color:var(--txt);margin-top:3px;line-height:1.45}
.sl-frame{font-size:12.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.sl-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.sl-state{font-size:12.5px;color:var(--sub)}
.sl-state.placed{color:var(--teal)}
.sl-state.shot{color:var(--amber)}
.sl-go{border:0;background:none;color:var(--txt);font-size:12.5px;cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:rgba(255,255,255,.25)}
.sl-terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}

/* sound brief */
.chip.snd::before{background:#a78bfa}
.s-mood{font-size:13.5px;font-weight:500;color:var(--txt)}
.s-notes{font-size:13px;line-height:1.55;color:#cfd8d7;margin-top:4px}
.s-terms{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:12.5px;color:var(--sub)}
.s-terms span{margin-right:2px}
.term{border:0;cursor:pointer;padding:3px 9px;border-radius:6px;background:rgba(255,255,255,.06);font-size:12.5px;color:var(--txt)}
.term:hover{background:rgba(255,255,255,.11)}
.s-tip{font-size:12px;color:var(--sub);margin-top:10px;padding-top:9px;border-top:1px solid var(--hair)}
.s-song{margin-top:12px;padding:12px 14px;border-radius:10px;border:1px dashed rgba(255,255,255,.16);font-size:12.5px;color:var(--sub);cursor:pointer;line-height:1.5}
.s-song b{color:var(--txt);font-weight:500}
.s-song.drag{border-color:var(--teal);background:rgba(48,197,176,.08)}
.s-song.set{display:flex;align-items:center;gap:10px;border-style:solid;border-color:var(--hair);cursor:default;padding:6px 8px 6px 6px}
.s-song .nm{flex:1;min-width:0;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-song label{display:flex;align-items:center;gap:6px;white-space:nowrap}
.s-song input[type=number]{width:52px;padding:3px 6px;border-radius:6px;border:1px solid var(--hair);background:rgba(255,255,255,.04);color:var(--txt);font:inherit}
.s-song .ib svg{width:14px;height:14px}

/* set picker, save state */
.sets{position:relative}
.sets > button{display:flex;align-items:center;gap:10px;padding:5px 10px;border-radius:8px;border:0;cursor:pointer;text-align:left;background:none}
.sets > button:hover{background:rgba(255,255,255,.05)}
.sets > button svg{width:13px;height:13px;color:var(--sub)}
.sets .lab{display:flex;align-items:baseline;gap:8px;max-width:360px}
.sets .nm{font-size:13.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sets .dt{font-size:13.5px;font-weight:500;color:var(--txt);white-space:nowrap}
.brand + .sets{margin-left:-6px;padding-left:14px;border-left:1px solid var(--hair)}
.menu{position:absolute;top:calc(100% + 8px);left:0;width:400px;max-height:70vh;overflow:auto;padding:5px;border-radius:12px;display:none;
  background:#121718;box-shadow:0 0 0 1px var(--hair2),0 24px 60px rgba(0,0,0,.55)}
.menu.on{display:block}
.m-k{font-size:12px;color:var(--sub);padding:8px 10px 4px}
.menu a{display:block;padding:9px 10px;border-radius:8px;color:inherit;text-decoration:none}
.menu a:hover{background:rgba(255,255,255,.05)}
.menu a.on{background:rgba(255,255,255,.07)}
.m-r{display:flex;align-items:baseline;gap:10px}
.m-r b{font-size:13.5px;font-weight:500;flex:1}
.m-r span{font-size:12.5px;color:var(--sub);white-space:nowrap}
.m-n{font-size:12.5px;color:var(--sub);line-height:1.5;margin-top:3px}
.m-f{font-size:12px;color:var(--sub);margin-top:3px;opacity:.75}
.saved{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub);white-space:nowrap}
.saved i{width:6px;height:6px;border-radius:50%;background:var(--teal)}
.saved.busy i{background:var(--amber)}
.saved.err{color:#ff8a8a}.saved.err i{background:#ff5a5a}
.offline{max-width:560px;margin:14vh auto;text-align:center}
.offline h2{font-size:22px;font-weight:600}
.offline p{color:var(--sub);margin-top:10px;line-height:1.55}
.offline pre{margin-top:14px;padding:12px 16px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--hair);font:13px ui-monospace,Menlo,monospace;color:var(--txt)}

/* ================= iPhone ================= */
.device{position:relative;width:421px;height:880px;padding:3px;border-radius:70px;
  background:linear-gradient(145deg,#9fa4a9 0%,#53585d 9%,#2c2f33 22%,#7c8187 41%,#3a3d41 58%,#8d9196 76%,#45494d 90%,#a3a8ad 100%);
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 50px 100px -10px rgba(0,0,0,.75),0 20px 40px rgba(0,0,0,.45)}
.device::before{content:"";position:absolute;inset:1px;border-radius:69px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18),inset 0 0 6px rgba(0,0,0,.6);pointer-events:none}
.bezel{position:relative;width:100%;height:100%;padding:11px;border-radius:67px;background:#020202;box-shadow:inset 0 0 0 1.5px #1b1c1e}
.screen{position:relative;width:393px;height:852px;border-radius:56px;overflow:hidden;background:#000;isolation:isolate}
.btn-l,.btn-r{position:absolute;width:4px;border-radius:2px;background:linear-gradient(90deg,#3a3d41,#9da2a7 50%,#4a4e52)}
.btn-l{left:-3px}.btn-r{right:-3px}
.glare{position:absolute;inset:0;z-index:30;pointer-events:none;border-radius:56px;
  background:linear-gradient(118deg,rgba(255,255,255,.075) 0%,rgba(255,255,255,.02) 26%,transparent 42%)}
.island{position:absolute;z-index:31;left:50%;top:11px;width:126px;height:37px;margin-left:-63px;border-radius:19px;background:#000;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.03)}
.island::after{content:"";position:absolute;right:16px;top:12px;width:13px;height:13px;border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#2a3550 0%,#0b0f1a 55%,#000 100%)}
.content{position:absolute;left:0;width:393px;overflow:hidden;z-index:1}
.content > .slide{transform:scale(.363889);transform-origin:0 0}
body[data-p=rl] .content{top:35px;height:699px}
/* TikTok photo posts crop the slide: only rows 220-1700 are shown, starting right under the status bar
   (measured off a real post, 2026-10-07). The mock copies that crop so the header lands where it really does. */
body[data-p=tt] .content{top:61px;height:538.5px}
body[data-p=tt] .content > .slide{transform:translateY(-80.06px) scale(.363889)}

/* ================= the slide: designed at 1080×1920 ================= */
.slide{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
/* brand type: one display face per preset (body[data-type]); Caveat is used ONLY for the POTSDad signature */
body,body[data-type=warm]{--display:"Fraunces",Georgia,serif;--dw:600;--bw:400;--ems:italic;--track:-.018em;--lh:1.07;--k:1}
body[data-type=bold]{--display:"Manrope",Inter,sans-serif;--dw:800;--bw:600;--ems:normal;--track:-.025em;--lh:1.06;--k:1}
body[data-type=editorial]{--display:"Instrument Serif",Georgia,serif;--dw:400;--bw:400;--ems:italic;--track:-.012em;--lh:1.02;--k:1.14}
body{--hand:"Caveat","Bradley Hand",cursive}
.slide{font-family:var(--display);font-optical-sizing:none;font-feature-settings:normal} /* canvas export draws the default optical size; match it */
.slide em{font-style:var(--ems);color:var(--teal)}
.sig{display:inline-block;font-family:var(--hand);font-weight:700;font-size:calc(74px * var(--fit));line-height:1;color:var(--teal);
  transform:rotate(-4deg);transform-origin:0 100%;margin-bottom:calc(40px * var(--fit))}
.slide [contenteditable]{outline:none;cursor:text}
.slide [contenteditable]:focus{outline:4px dashed rgba(48,197,176,.65);outline-offset:10px}
.img-slot{position:absolute;inset:0;background-color:#0f1517;background-size:cover;background-repeat:no-repeat;background-position:center}
.img-slot:not(.has-img){background-image:
  radial-gradient(900px 700px at 70% 22%,rgba(48,197,176,.16),transparent 70%),
  radial-gradient(800px 800px at 15% 85%,rgba(48,120,197,.10),transparent 70%),
  linear-gradient(180deg,#162022,#0d1314)}
.slide{--tint:11,15,16}
.scrim{position:absolute;inset:0;opacity:var(--scrim,1)}
.shade{position:absolute;inset:0;pointer-events:none;background:rgba(var(--tint),var(--shade,0))}
/* Safe zone, measured against a real TikTok photo post (2026-10-07), not the generic 8% rule:
   the photo view centre-crops a 1080x1920 slide to about rows 220-1700, and its search bar
   then covers down to about row 335. Copy therefore starts at 370. */
.copy{position:absolute;left:86px;right:200px;top:370px;bottom:640px;display:flex;flex-direction:column;justify-content:flex-end;--fit:1}
.stack{flex:none}
.p{font-size:calc(80px * var(--fit) * var(--k) * var(--ts,1));font-weight:var(--dw);line-height:calc(var(--lh) + .06);letter-spacing:var(--track);text-shadow:0 2px 24px rgba(0,0,0,.55)}
.p + .p{margin-top:calc(34px * var(--fit));font-weight:var(--bw);color:#dbe3e1}
.fine{margin-top:calc(44px * var(--fit));font-family:Inter,sans-serif;font-size:calc(30px * var(--fit));font-weight:500;line-height:1.35;color:var(--dim)}

.l-hook .scrim{background:linear-gradient(180deg,rgba(var(--tint),.50) 0%,rgba(var(--tint),.74) 26%,rgba(var(--tint),.80) 52%,rgba(var(--tint),.62) 76%,rgba(var(--tint),.80) 100%)}
.slide .rbn{display:inline-block;width:.56em;height:.84em;vertical-align:-.1em;margin-left:.22em;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='128' height='192' viewBox='0 0 64 96' fill='none' stroke-width='11' stroke-linejoin='round'><path d='M15 90 L38 45 C45 31 43 9 32 9 C21 9 19 31 26 45 L49 90' stroke='%23189E92'/><path d='M15 90 L35 51' stroke='%2340D6C6'/><path d='M26 45 C19 31 21 9 32 9 C40 9 43 20 41 32' stroke='%2340D6C6'/></svg>") 0 0/100% 100% no-repeat}
/* :awesome: the awesome face, drawn here rather than borrowed, same mechanism as the ribbon */
.slide .awe{display:inline-block;width:1em;height:1em;vertical-align:-.14em;margin-left:.1em;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 100 100' stroke='%231d1d1d' stroke-linejoin='round' stroke-linecap='round'><circle cx='50' cy='50' r='46' fill='%23FEDD58' stroke-width='6'/><path d='M17 45 V37 a12 12 0 0 1 24 0 V45 Z M56 45 V37 a12 12 0 0 1 24 0 V45 Z' fill='%23fff' stroke-width='3.5'/><circle cx='33' cy='34' r='5' fill='%231d1d1d' stroke='none'/><circle cx='72' cy='34' r='5' fill='%231d1d1d' stroke='none'/><path d='M24 57 H78 C78 76 66 87 51 87 C36 87 24 76 24 57 Z' fill='%238C1C4B' stroke-width='4'/><path d='M39 83.5 C41 74 61 74 63 83.5 C56 86.5 46 86.5 39 83.5 Z' fill='%23F5B5CE' stroke='none'/><path d='M19 57 H78' fill='none' stroke-width='4'/></svg>") 0 0/100% 100% no-repeat}
.slide [contenteditable]{overflow-wrap:normal;word-break:normal}
.copy .stack > :not(.lockup){transform:translate(var(--tx,0px),var(--ty,0px))}
.l-hook .copy{justify-content:center}
.l-hook.copy-top .copy{justify-content:flex-start}
.slide.scrim-light .scrim{background:linear-gradient(180deg,rgba(var(--tint),.55) 0%,rgba(var(--tint),.35) 40%,rgba(var(--tint),.2) 60%,rgba(var(--tint),.6) 100%)}
.l-hook .p[data-i="0"]{font-size:calc(124px * var(--fit) * var(--k) * var(--ts,1));line-height:var(--lh);font-weight:var(--dw)}
.l-hook .p + .p{font-size:calc(62px * var(--fit) * var(--k) * var(--ts,1));font-weight:var(--bw);line-height:1.2;color:var(--muted);margin-top:calc(36px * var(--fit))}

.l-photo .scrim{background:linear-gradient(180deg,rgba(var(--tint),0) 0%,rgba(var(--tint),.05) 24%,rgba(var(--tint),.70) 44%,rgba(var(--tint),.93) 60%,rgba(var(--tint),.97) 100%)}
.l-photo.cta .scrim{background:linear-gradient(180deg,rgba(var(--tint),.78) 0%,rgba(var(--tint),0) 20%,rgba(var(--tint),.05) 26%,rgba(var(--tint),.70) 44%,rgba(var(--tint),.93) 60%,rgba(var(--tint),.97) 100%)}
.l-photo.cta > .lockup{position:absolute;left:86px;right:86px;top:370px}

.l-list .scrim{background:linear-gradient(180deg,rgba(var(--tint),.82) 0%,rgba(var(--tint),.86) 50%,rgba(var(--tint),.92) 100%)}
.l-list .copy{justify-content:center}
.kicker{display:inline-block;font-size:calc(50px * var(--fit) * var(--k) * var(--ts,1));font-weight:var(--dw);letter-spacing:var(--track);line-height:1.1;color:var(--teal);margin-bottom:calc(56px * var(--fit))}
.item{display:flex;align-items:baseline;gap:calc(30px * var(--fit))}
.item + .item{margin-top:calc(50px * var(--fit))}
.num{flex:none;min-width:calc(84px * var(--fit));font-size:calc(96px * var(--fit) * var(--k) * var(--ts,1));font-weight:var(--dw);font-style:var(--ems);line-height:1;color:var(--teal)}
.item .p{font-size:calc(76px * var(--fit) * var(--k) * var(--ts,1));font-weight:var(--dw);margin:0;color:var(--ink)}

#stage{position:fixed;left:0;top:0;width:1080px;height:1920px;z-index:-10;pointer-events:none}

#focus .fwrap{position:relative}

#focus .hint kbd{font:inherit;font-weight:700;color:#aab6b4;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.07);margin:0 2px}

  opacity:0;transition:all .25s cubic-bezier(.3,1.3,.5,1);z-index:200;max-width:760px;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}

// Edited slide text back to the config's markup: <em> → *asterisks*, everything else plain text.
function toMarkup(el) {
  let out = '';
  el.childNodes.forEach(n => {
    if (n.nodeType === 3) out += n.textContent;
    else if (n.nodeName === 'EM') out += '*' + n.textContent + '*';
    else if (n.nodeName === 'BR') out += ' ';
    else if (n.dataset?.tok) out += n.dataset.tok;
    else out += toMarkup(n);
  });
  return out.replace(/\s+/g, ' ').replace(/\*\*/g, '').trim();
}

let SETS = [], SET = null, SET_ID = '';
const base = () => `sets/${SET_ID}/`;
const resolve = src => !src ? '' : /^(https?:|data:|blob:|\/)/.test(src) ? src : base() + src;
const saveState = document.getElementById('saveState');
const showSave = (cls, text) => { saveState.className = 'saved ' + cls; saveState.lastChild.textContent = text; };
let saveTimer = null, saving = Promise.resolve(), inflight = 0, SET_VERSION = '', CODE_VERSION = '';
// Debounced write of the whole set back to sets/<id>/set.json; writes are serialised and carry
// the version they were based on. If the file changed meanwhile (another tab, or Claude editing
// it), the server refuses and this tab reloads the latest copy instead of overwriting it.
function persist() {
  saveTimer = null;
  const id = SET_ID, body = JSON.stringify(SET);
  inflight++;
  return saving = saving
    .then(() => fetch(`/api/sets/${id}`, { method: 'PUT', headers: { 'content-type': 'application/json', 'x-version': SET_VERSION }, body }))
    .then(async r => {
      if (r.status === 409) { showSave('err', 'Reloaded'); toast('This set changed on disk since you opened it, so it was reloaded. Redo your last edit.', 7000); await openSet(id, true); return; }
      if (!r.ok) throw new Error(r.status);
      SET_VERSION = (await r.json()).version; showSave('ok', 'Saved to set.json');
    })
    .catch(() => showSave('err', 'Not saved'))
    .finally(() => { inflight--; });
}
// Pick up edits made on disk (by Claude, or another tab) without a manual refresh.
setInterval(async () => {
  if (!SET_ID || saveTimer || inflight || document.hidden) return;
  try {
    const r = await fetch(`/api/sets/${SET_ID}/version`); if (!r.ok) return;
    const { version, code } = await r.json();
    // The studio's own files changed on disk: reload, or this tab keeps drawing with the old code.
    if (code && CODE_VERSION && code !== CODE_VERSION) return location.reload();
    if (code) CODE_VERSION = code;
    if (SET_VERSION && version !== SET_VERSION && !saveTimer && !inflight) { await openSet(SET_ID, true); toast('Updated from set.json'); }
  } catch {}
}, 2500);
function save() { showSave('busy', 'Saving…'); clearTimeout(saveTimer); saveTimer = setTimeout(persist, 450); }
function flushSave() { if (!saveTimer) return saving; clearTimeout(saveTimer); return persist(); }

  : `<div class="s-song" data-song="${ci}" data-act="pick"><b>Drop the song here</b> or click to choose. It plays under this creative's MP4.<input type="file" accept="audio/*,.mp3,.m4a,.wav,.aif,.aiff" hidden></div>`;
let songPlayer = null;
function wireSong(el, c, ci) {
  const input = el.querySelector('input[type=file]'), m = c.music;
  const refresh = () => { const n = document.createElement('div'); n.innerHTML = songHTML(m, ci); const nx = n.firstElementChild; el.replaceWith(nx); wireSong(nx, c, ci); };
  const take = async file => {
    if (!file) return;
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (!/^(mp3|m4a|aac|wav|aif|aiff)$/.test(ext)) return toast('Use an MP3, M4A, WAV or AIFF file');
    toast('Uploading song…', 20000);
    const r = await fetch(`/api/sets/${SET_ID}/audio/c${ci + 1}?ext=${ext}`, { method: 'POST', body: file });
    if (!r.ok) return toast('Could not save the song (' + r.status + ')');
    m.file = (await r.json()).src; m.fileName = file.name; delete m.start;
    save(); refresh(); toast('Song added. It plays under this creative\'s MP4.');
  };
  input.onchange = () => { take(input.files[0]); input.value = ''; };
  el.addEventListener('dragover', e => { e.preventDefault(); el.classList.add('drag'); });
  el.addEventListener('dragleave', () => el.classList.remove('drag'));
  el.addEventListener('drop', e => { e.preventDefault(); el.classList.remove('drag'); take(e.dataTransfer.files[0]); });
  if (!m.file) { el.onclick = e => { if (e.target !== input) input.click(); }; return; }
  const play = el.querySelector('[data-act="play"]');
  play.onclick = () => {
    if (songPlayer && songPlayer.ci === ci && !songPlayer.paused) { songPlayer.pause(); play.innerHTML = PLAY; return; }
    if (songPlayer) songPlayer.pause();
    songPlayer = new Audio(resolve(m.file) + '?v=' + Date.now()); songPlayer.ci = ci;
    songPlayer.currentTime = +m.start || 0; songPlayer.play(); play.innerHTML = PAUSE;
    songPlayer.onpause = () => { play.innerHTML = PLAY; };
  };
  el.querySelector('[data-act="start"]').oninput = e => { const v = Math.max(0, +e.target.value || 0); if (v) m.start = v; else delete m.start; save(); };
  el.querySelector('[data-act="unsong"]').onclick = async () => {
    if (songPlayer && songPlayer.ci === ci) songPlayer.pause();
    await fetch(`/api/sets/${SET_ID}/audio/c${ci + 1}`, { method: 'DELETE' });
    delete m.file; delete m.fileName; delete m.start; save(); refresh();
  };
}

/* ---------- images ---------- */
function setImage(entry, url) {
  const el = entry.slide.querySelector('[data-slot]'), note = entry.card.querySelector('.note');
  const mark = ok => { entry.hasImg = ok; const st = entry.card.querySelector('.status');
    st.classList.toggle('set', ok); st.lastChild.textContent = ok ? 'Placed' : 'Image needed'; progress(entry.c); renderShots(); };
  note.innerHTML = '';
  if (!url) { el.style.backgroundImage = ''; el.classList.remove('has-img'); mark(false); return; }
  const probe = new Image();
  probe.onload = () => { entry.nat = { w: probe.naturalWidth, h: probe.naturalHeight }; applyCrop(entry);
    el.style.backgroundImage = `url("${url}")`; el.classList.add('has-img'); mark(true); };
  probe.onerror = () => { el.style.backgroundImage = ''; el.classList.remove('has-img'); mark(false);
    note.innerHTML = `<div class="warn">Could not load ${esc(String(entry.sl.img.src).slice(0, 80))}</div>`; };

}
// img.pos is a CSS background-position ("center 40%", "30% 60%"); img.zoom scales the image past its cover fit.
const KW = { left: 0, top: 0, center: 50, right: 100, bottom: 100 };
const parsePos = pos => { const [a = 'center', b = 'center'] = String(pos || 'center').split(/\s+/);
  const v = t => t in KW ? KW[t] : (parseFloat(t) || 0); return [v(a), v(b)]; };
function applyCrop(entry) {
  const img = entry.sl.img, el = entry.slide.querySelector('[data-slot]');
  const [x, y] = parsePos(img.pos), z = +img.zoom || 1;

  // Background-size as a width percentage of the slot. Cover fit is the base: wider than the slide means
  // the image is height-bound and overflows sideways. Phone mockups fit the screenshot to the screen width.
  const nat = entry.nat;
  if (z === 1) el.style.backgroundSize = '';
  else if (el.closest('.mock')) el.style.backgroundSize = `${(100 * z).toFixed(2)}% auto`;
  else if (nat) el.style.backgroundSize = `${(Math.max(1, (nat.w / nat.h) / (1080 / 1920)) * 100 * z).toFixed(2)}% auto`;
  const set = (k, v) => { const i = entry.card.querySelector(`[data-crop="${k}"]`); if (i) i.value = v; };

}
// Overlay strength: 50 is the layout's own scrim; below fades it, above adds a flat shade on top.

const TINT = '#0b0f10';
function applyLook(entry) {
  const sl = entry.sl, s = entry.slide.style, v = sl.overlay ?? 50, t = sl.tint || TINT;
  s.setProperty('--scrim', Math.min(1, v / 50).toFixed(3));
  s.setProperty('--shade', (Math.max(0, v - 50) / 50 * 0.75).toFixed(3));
  s.setProperty('--tint', [1, 3, 5].map(i => parseInt(t.slice(i, i + 2), 16)).join(','));

function applyMock(entry) {

  const set = (k, v) => { const i = entry.card.querySelector(`[data-mock="${k}"]`); if (i) i.value = v; };

// Text size (sl.textSize, 1 = fitted) and nudge in slide pixels (sl.textX / sl.textY).
function applyText(entry) {

  entry.slide.querySelectorAll('.copy').forEach(c => {

    c.style.setProperty('--tx', (sl.textX || 0) + 'px'); c.style.setProperty('--ty', (sl.textY || 0) + 'px');

  const set = (k, v) => { const i = entry.card.querySelector(`[data-text="${k}"]`); if (i) i.value = v; };

const imageURL = entry => {

    let blob, ext;
    try { ({ blob, ext } = await prepare(file)); } catch { blob = file; ext = 'heic'; }
    const r = await fetch(`/api/sets/${SET_ID}/img/${entry.key}?ext=${ext}`, { method: 'POST', body: blob });
    if (!r.ok) throw new Error('server said ' + r.status);
    entry.sl.img.src = (await r.json()).src;
    delete entry.sl.img.shot;

// An Unsplash link (the photo's page, or its image address) placed as if the file had been dropped:

    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'server said ' + r.status);
    const blob = await r.blob();

/* ---------- text ---------- */
// Shrink copy (never below 56%) until it fits its safe region; outline it red if it still can't.
function fit(slide) {
  slide.querySelectorAll('.copy').forEach(copy => {
    const stack = copy.querySelector('.stack'); let f = 1; copy.style.setProperty('--fit', f);
    // A word too long for the line (contenteditable would split it mid-word) counts as not fitting too.
    const over = () => stack.offsetHeight > copy.clientHeight || [...stack.querySelectorAll('[data-i]')].some(el => el.scrollWidth > el.clientWidth + 1);
    copy.style.setProperty('--ts', 1);
    while (over() && f > 0.56) { f -= 0.02; copy.style.setProperty('--fit', f.toFixed(2)); }
    // The text size slider scales past the fit on purpose; the red outline says when it spills.

function wireText(entry) {
  entry.slide.querySelectorAll('[data-i]').forEach(el => el.addEventListener('input', () => {
    const md = toMarkup(el);
    entry.sl.text[+el.dataset.i] = el.dataset.num ? `${el.dataset.num}. ${md}` : md;
    fit(entry.slide); save();
  }));
  const fine = entry.slide.querySelector('[data-fine]');
  if (fine) fine.addEventListener('input', () => { entry.sl.fine = fine.textContent.trim(); fit(entry.slide); save(); });
}

let hovered = null;
function wire(entry) {
  const { card, box } = entry, input = card.querySelector('input[type=file]');
  card.querySelector('[data-act="pick"]').onclick = () => input.click();
  input.onchange = () => { takeFile(entry, input.files[0]); input.value = ''; };
  card.querySelector('[data-act="link"]').onclick = () => pasteLink(entry);
  card.querySelector('[data-act="clear"]').onclick = () => clearImage(entry);
  card.querySelectorAll('[data-crop]').forEach(inp => inp.oninput = () => {
    const v = k => +card.querySelector(`[data-crop="${k}"]`).value, img = entry.sl.img;
    img.pos = `${v('x')}% ${v('y')}%`;
    if (v('z') > 1) img.zoom = +v('z').toFixed(2); else delete img.zoom;
    applyCrop(entry); save();
  });
  card.querySelectorAll('[data-look]').forEach(inp => inp.oninput = () => {
    const sl = entry.sl, v = +card.querySelector('[data-look="overlay"]').value, t = card.querySelector('[data-look="tint"]').value;
    if (v === 50) delete sl.overlay; else sl.overlay = v;

    applyCrop(entry); applyLook(entry); applyMock(entry); fit(entry.slide); save();
  };

    const v = k => +card.querySelector(`[data-mock="${k}"]`).value, sl = entry.sl;
    const put = (k, x, d) => { if (x === d) delete sl[k]; else sl[k] = x; };
    put('phoneX', v('x'), 0); put('phoneY', v('y'), 0); put('phoneSize', +v('s').toFixed(2), 1);
    applyMock(entry); fit(entry.slide); save();
  });

    const v = k => +card.querySelector(`[data-text="${k}"]`).value, sl = entry.sl;
    const put = (k, x, d) => { if (x === d) delete sl[k]; else sl[k] = x; };
    put('textSize', +v('size').toFixed(2), 1); put('textX', v('x'), 0); put('textY', v('y'), 0);

  card.querySelector('[data-act="png"]').onclick = () => saveOne(entry);

  box.addEventListener('dragover', e => { e.preventDefault(); box.classList.add('drag'); });

}

/* ---------- export ---------- */
async function render(entry) {
  if (!window.html2canvas) throw new Error('html2canvas did not load (offline?). Use Focus, press C, and screenshot instead.');
  await document.fonts.ready;
  const stage = document.getElementById('stage'), clone = entry.slide.cloneNode(true);
  clone.querySelectorAll('.guides').forEach(n => n.remove());
  clone.querySelectorAll('.copy.overflow').forEach(n => n.classList.remove('overflow'));  // a studio warning, never in the PNG
  clone.querySelectorAll('[contenteditable]').forEach(n => n.removeAttribute('contenteditable'));
  stage.replaceChildren(clone);
  try {
    const canvas = await html2canvas(clone, { width: 1080, height: 1920, scale: 1, useCORS: true, backgroundColor: '#0b0f10',
      logging: false, scrollX: 0, scrollY: 0, windowWidth: 1080, windowHeight: 1920 });
    return await new Promise((res, rej) => { try { canvas.toBlob(b => b ? res(b) : rej(new Error('empty canvas')), 'image/png'); } catch (e) { rej(e); } });
  } finally { stage.replaceChildren(); }
}
const explain = e => e && e.name === 'SecurityError'
  ? 'Export blocked: an image comes from a host without CORS. Drop the photo onto the phone instead so it lives in the set.'

// Exports go through the studio server into iCloud Drive/Slides Studio/<set>/<NN creative>/slide-N.png;
// `reveal` asks it to open that folder in Finder once the batch is written.
async function exportSlide(entry, reveal = '') {
  const r = await fetch(`/api/sets/${SET_ID}/export/${entry.key}${reveal ? '?reveal=' + reveal : ''}`, { method: 'POST', body: await render(entry) });
  if (!r.ok) throw new Error('server said ' + r.status);
  return (await r.json()).path;
}
async function saveOne(entry) {
  try { toast('Rendering…', 20000); const path = await exportSlide(entry); toast(`Saved to <b>${esc(path.replace(/^.*\/com~apple~CloudDocs\//, 'iCloud Drive/'))}</b>`, 5000); }
  catch (e) { toast(explain(e), 9000); }
}
// How long a slide stays up in the MP4: long enough to read it, by word count.
const slideSeconds = sl => {
  const words = [...(sl.text || []), sl.fine || '', sl.kicker || ''].join(' ').split(/\s+/).filter(Boolean).length;
  return +Math.max(2.5, Math.min(6, 1.2 + words * 0.28)).toFixed(2);
};
async function exportVideo(c, reveal) {
  const ci = SET.creatives.indexOf(c) + 1;
  const r = await fetch(`/api/sets/${SET_ID}/video/c${ci}${reveal ? '?reveal=' + reveal : ''}`, { method: 'POST',
    headers: { 'content-type': 'application/json' }, body: JSON.stringify({ durations: c.slides.map(slideSeconds) }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'video failed (' + r.status + ')');

}
async function saveMany(list, reveal) {
  const creatives = [...new Set(list.map(e => e.c))];
  let n = 0, videos = 0, silent = 0, videoErr = '';
  for (const [k, c] of creatives.entries()) {
    const mine = list.filter(e => e.c === c), lastCreative = k === creatives.length - 1;
    for (const entry of mine) {
      try { toast(`Rendering ${++n} of ${list.length}…`, 20000); await exportSlide(entry); }
      catch (e) { toast(explain(e), 9000); return; }
    }
    // A video needs every slide of its creative on disk, so only a whole creative gets one.
    if (mine.length !== c.slides.length) continue;
    try {
      toast(`Making the MP4 for ${esc(c.name)}…`, 60000);
      const v = await exportVideo(c, lastCreative ? reveal : '');
      videos++; if (!v.song) silent++;
    } catch (e) { videoErr = e.message; }
  }
  if (videoErr && !videos) { if (reveal) exportSlide(list[list.length - 1], reveal).catch(() => {}); }
  toast(`Exported ${list.length} slides` + (videos ? ` and ${videos} MP4${videos > 1 ? 's' : ''}` : '') + ' to iCloud Drive/Slides Studio'
    + (silent ? `. ${silent} without a song: drop one on the Sound card.` : '') + (videoErr ? `<br>Video: ${esc(videoErr)}` : ''), 9000);

/* ---------- focus ---------- */
let focusIdx = -1, clean = false;
function openFocus(i) {
  focusIdx = (i + SLIDES.length) % SLIDES.length;
  const f = document.getElementById('focus'), wrap = f.querySelector('.fwrap'), entry = SLIDES[focusIdx];
  const bare = clean || !document.body.classList.contains('ui-on');
  const W = bare ? 1080 : 421, H = bare ? 1920 : 880;
  const s = Math.min((innerHeight - 70) / H, (innerWidth - 60) / W);

  node.querySelectorAll('.guides').forEach(n => n.remove());

/* ---------- shot list ---------- */
// Everything the set still needs, grouped by who makes it. Faces are always Austin's own
// photos; stock is only ever objects, scenes, hands and textures.
const GROUPS = [
  { source: 'mine', title: 'Your photos', sub: 'Anything with a face in it is you. Drop a photo on a thumbnail, or click it to upload.' },
  { source: 'app', title: 'App screenshots', sub: 'Captured from the app in the simulator; replace any with your own real data.' },
  { source: 'unsplash', title: 'Stock', sub: 'Objects, scenes, hands and textures only. No strangers\' faces.' },
];
function renderShots() {
  const el = document.getElementById('shots'); if (!el || !SET) return;
  const rows = SLIDES.map(e => ({ e, placed: e.hasImg, shot: !!e.sl.img.shot }));
  const need = rows.filter(r => !r.placed);
  const music = SET.creatives.filter(c => c.music);
  const doneMusic = music.filter(c => c.music.picked).length;
  let html = `<header class="hero"><div class="h-k">${esc(fmtDate(SET.created))} · ${esc(SET.name)}</div>
    <h1>Shot list</h1><p>${need.length ? `${need.length} image${need.length === 1 ? '' : 's'} still needed` : 'Every slide has its image'} · ${rows.length - need.length} of ${rows.length} placed · ${doneMusic} of ${music.length} sounds picked</p></header>`;
  for (const g of GROUPS) {
    const list = rows.filter(r => (r.e.sl.img.source || 'mine') === g.source)
      .sort((a, b) => (a.placed - b.placed) || (a.shot - b.shot));
    if (!list.length) continue;
    const left = list.filter(r => !r.placed).length;
    html += `<section class="sl-group"><div class="sl-head"><h2>${g.title}</h2><span>${left ? left + ' to do' : 'all placed'}</span></div><div class="sl-sub">${g.sub}</div>`;
    for (const { e, placed, shot } of list) {
      const i = SLIDES.indexOf(e), src = imageURL(e);
      const state = placed ? '<span class="sl-state placed">Placed</span>' : shot ? '<span class="sl-state shot">Shot, not placed</span>' : '<span class="sl-state">To do</span>';
      html += `<div class="sl-row${placed || shot ? ' done' : ''}">
        <button class="sl-check${placed || shot ? ' on' : ''}" data-shot="${i}" ${placed ? 'disabled title="Placed"' : 'title="Mark as shot"'}></button>
        <div class="sl-thumb${placed ? '' : ' empty'}" data-drop="${i}" title="${placed ? 'Drop or click to replace' : 'Drop a photo or click to upload'}" ${placed && src ? `style="background-image:url('${src}')"` : ''}><span>${placed ? '' : I.image}</span></div>
        <div class="sl-body"><div class="sl-where"><b>${num(SET.creatives.indexOf(e.c))} ${esc(e.c.name)}</b> · slide ${e.si + 1}</div>
          <div class="sl-what">${esc(e.sl.img.shows || '')}</div><div class="sl-frame">${esc(e.sl.img.frame || '')}</div></div>
        <div class="sl-side">${state}<button class="sl-go" data-go="${i}">Go to slide</button></div></div>`;
    }
    html += '</section>';
  }
  if (music.length) {
    html += `<section class="sl-group"><div class="sl-head"><h2>Sounds</h2><span>${music.length - doneMusic ? (music.length - doneMusic) + ' to pick' : 'all picked'}</span></div><div class="sl-sub">One per creative, chosen in the app when you post.</div>`;
    for (const c of music) {
      const ci = SET.creatives.indexOf(c), m = c.music;
      html += `<div class="sl-row${m.picked ? ' done' : ''}"><button class="sl-check${m.picked ? ' on' : ''}" data-music="${ci}" title="Mark as picked"></button><div class="sl-thumb empty"></div>
        <div class="sl-body"><div class="sl-where"><b>${num(ci)} ${esc(c.name)}</b>${m.bpm ? ' · ' + esc(m.bpm) + ' BPM' : ''}</div><div class="sl-what">${esc(m.mood || '')}</div>
          <div class="sl-terms">${(m.search || []).map(s => `<button class="term" data-term="${esc(s)}">${esc(s)}</button>`).join('')}</div></div>
        <div class="sl-side">${m.picked ? '<span class="sl-state placed">Picked</span>' : '<span class="sl-state">To do</span>'}</div></div>`;
    }
    html += '</section>';
  }
  el.innerHTML = html;
  el.querySelectorAll('[data-shot]').forEach(b => b.onclick = () => { const e = SLIDES[+b.dataset.shot]; e.sl.img.shot = !e.sl.img.shot; if (!e.sl.img.shot) delete e.sl.img.shot; save(); renderShots(); });
  el.querySelectorAll('[data-music]').forEach(b => b.onclick = () => { const m = SET.creatives[+b.dataset.music].music; m.picked = !m.picked; if (!m.picked) delete m.picked; save(); renderShots(); });
  // Thumbnails take a photo directly: drop or click, same upload path as the phones.
  el.querySelectorAll('.sl-row').forEach(row => {
    const z = row.querySelector('[data-drop]'); if (!z) return;
    row.addEventListener('dragover', ev => { ev.preventDefault(); row.classList.add('dragging'); });
    row.addEventListener('dragleave', ev => { if (!row.contains(ev.relatedTarget)) row.classList.remove('dragging'); });
    row.addEventListener('drop', ev => { ev.preventDefault(); row.classList.remove('dragging'); if (ev.target.closest('[data-drop]')) return;
      z.classList.add('busy'); takeFile(SLIDES[+z.dataset.drop], ev.dataTransfer.files[0]); });
  });
  el.querySelectorAll('[data-drop]').forEach(z => {
    const e = SLIDES[+z.dataset.drop];
    z.onclick = () => { const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'image/*';
      inp.onchange = () => takeFile(e, inp.files[0]); inp.click(); };
    z.addEventListener('dragover', ev => { ev.preventDefault(); z.classList.add('over'); });
    z.addEventListener('dragleave', () => z.classList.remove('over'));
    z.addEventListener('drop', ev => { ev.preventDefault(); z.classList.remove('over'); z.classList.add('busy'); takeFile(e, ev.dataTransfer.files[0]); });
  });
  el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const e = SLIDES[+b.dataset.go]; setView('slides');
    e.card.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'center' });
    e.card.classList.remove('flash'); void e.card.offsetWidth; e.card.classList.add('flash');
  });
}
const viewSeg = document.getElementById('viewSeg');
function setView(v) {
  document.body.classList.toggle('view-shots', v === 'shots'); document.body.classList.toggle('view-composer', v === 'composer'); LS.set('view', v);
  choose(viewSeg, 'v', v);
  // The Composer lives in composer.js, which may still be loading when the boot gets here; it draws itself once it has.
  if (v !== 'composer') window.pauseComposer?.();
  if (v === 'shots') renderShots(); else if (v === 'composer') window.renderComposer?.(); else setPlatform(document.body.dataset.p);
  window.scrollTo({ top: 0 });
}
viewSeg.querySelectorAll('button').forEach(b => b.onclick = () => setView(b.dataset.v));

/* ---------- set picker ---------- */
const picker = document.getElementById('sets'), menu = picker.querySelector('.menu');
picker.querySelector('button').onclick = e => { e.stopPropagation(); menu.classList.toggle('on'); };
document.addEventListener('click', e => { if (!picker.contains(e.target)) menu.classList.remove('on'); });
function renderPicker() {
  const cur = SETS.find(s => s.id === SET_ID);
  picker.querySelector('.dt').textContent = cur ? fmtDate(cur.created) : SET_ID;
  picker.querySelector('button').title = cur ? cur.name : '';
  menu.innerHTML = `<div class="m-k">${SETS.length} set${SETS.length === 1 ? '' : 's'}, newest first</div>` + SETS.map(s => `
    <a href="?set=${encodeURIComponent(s.id)}" data-id="${esc(s.id)}" class="${s.id === SET_ID ? 'on' : ''}">
      <div class="m-r"><b>${esc(s.name)}</b><span>${esc(fmtDate(s.created))}</span></div>
      ${s.notes ? `<div class="m-n">${esc(s.notes)}</div>` : ''}
      <div class="m-f">${s.creatives} creatives · ${s.slides} slides</div></a>`).join('');
  menu.querySelectorAll('a').forEach(a => a.onclick = e => { e.preventDefault(); menu.classList.remove('on'); openSet(a.dataset.id); });
}
async function openSet(id, refresh = false) {
  if (!refresh) await flushSave();
  const y = window.scrollY, rows = [...document.querySelectorAll('.row')].map(r => r.scrollLeft);
  const r = await fetch(`/api/sets/${encodeURIComponent(id)}`);
  if (!r.ok) { toast(`Could not open set ${esc(id)}`); return; }
  SET_VERSION = r.headers.get('x-version') || '';
  SET = await r.json(); SET_ID = id; LS.set('set', id);
  history.replaceState(null, '', '?set=' + encodeURIComponent(id));
  closeFocus(); build(); applyType((SET.style && SET.style.type) || 'bold'); renderPicker(); renderShots(); window.renderComposer?.(refresh); showSave('ok', 'Saved to set.json');
  if (refresh) { window.scrollTo({ top: y }); document.querySelectorAll('.row').forEach((r, i) => { r.scrollLeft = rows[i] || 0; }); }
  else window.scrollTo({ top: 0 });
}

/* ---------- top bar ---------- */
const seg = document.getElementById('seg');
function choose(group, attr, value) {
  group.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset[attr] === value));
  const on = group.querySelector('button.on'), pill = group.querySelector('.pill');
  if (on) { pill.style.left = on.offsetLeft + 'px'; pill.style.width = on.offsetWidth + 'px'; }
}
function setPlatform(p) {
  document.body.dataset.p = p; LS.set('platform', p); choose(seg, 'p', p);
  if (focusIdx >= 0) openFocus(focusIdx);
}
seg.querySelectorAll('button').forEach(b => b.onclick = () => setPlatform(b.dataset.p));
// The slide typeface lives in set.json (style.type: bold | warm | editorial); it is not a studio control.
function applyType(tp) {
  document.body.dataset.type = tp;
  document.fonts.ready.then(() => { SLIDES.forEach(e => fit(e.slide)); if (focusIdx >= 0) openFocus(focusIdx); });
}
function toggle(id, cls, key, def) {
  const el = document.getElementById(id);
  const set = v => { document.body.classList.toggle(cls, v); el.classList.toggle('on', v); LS.set(key, v); if (focusIdx >= 0) openFocus(focusIdx); };
  set(LS.get(key, def));
  el.onclick = e => { e.preventDefault(); set(!document.body.classList.contains(cls)); };
}
toggle('swUi', 'ui-on', 'ui', true);
toggle('swGuides', 'guides-on', 'guides2', false);
const zoom = document.getElementById('zoom');
zoom.value = LS.get('zoom2', 1);
const setZoom = v => document.documentElement.style.setProperty('--z', v);
setZoom(zoom.value);
zoom.oninput = () => { setZoom(zoom.value); LS.set('zoom2', +zoom.value); };
document.getElementById('saveAll').onclick = () => saveMany(SLIDES, 'set');

// Cmd+V over a slide places a copied Unsplash link (or a copied image) there. Typing into the copy is left alone.
document.addEventListener('paste', e => {
  if (!hovered || e.target.closest?.('[contenteditable], input, textarea')) return;
  const file = [...(e.clipboardData?.files || [])].find(f => f.type.startsWith('image/'));
  const text = e.clipboardData?.getData('text') || '';
  if (file) { e.preventDefault(); takeFile(hovered, file); }
  else if (isLink(text)) { e.preventDefault(); takeLink(hovered, text); }
});
document.addEventListener('keydown', e => {
  if (e.target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if (document.body.classList.contains('view-composer')) { window.composerKey?.(e); return; }
  const P = { '1': 'tt', '2': 'rl', '3': 'fd' };
  if (P[e.key]) { setPlatform(P[e.key]); return; }
  if (focusIdx < 0) { if ((e.key === 'f' || e.key === 'F') && hovered) openFocus(SLIDES.indexOf(hovered)); return; }
  if (e.key === 'Escape') closeFocus();
  else if (e.key === 'ArrowRight') openFocus(focusIdx + 1);
  else if (e.key === 'ArrowLeft') openFocus(focusIdx - 1);
  else if (e.key === 'c' || e.key === 'C') { clean = !clean; openFocus(focusIdx); }
});
window.addEventListener('beforeunload', () => { if (saveTimer) fetch(`/api/sets/${SET_ID}`, { method: 'PUT', body: JSON.stringify(SET), keepalive: true, headers: { 'content-type': 'application/json' } }); });

/* ---------- boot ---------- */
(async () => {
  setPlatform(LS.get('platform', 'tt'));
  document.fonts.ready.then(() => { setPlatform(document.body.dataset.p); choose(viewSeg, 'v', LS.get('view', 'slides')); });
  try {
    const r = await fetch('/api/sets'); if (!r.ok) throw new Error();
    SETS = await r.json();
  } catch {
    document.getElementById('app').innerHTML = `<div class="offline"><h2>The studio server isn't running</h2>
      <p>This page reads and saves sets through a tiny local server. From the repo root run:</p>
      <pre>node marketing/tiktok/studio.mjs</pre><p>It opens the studio at http://localhost:4747.</p></div>`;
    return;
  }
  if (!SETS.length) { document.getElementById('app').innerHTML = '<div class="offline"><h2>No sets yet</h2><p>Add a folder under <b>marketing/tiktok/sets/</b> with a set.json.</p></div>'; return; }
  const want = new URLSearchParams(location.search).get('set') || LS.get('set', '');
  await openSet(SETS.some(s => s.id === want) ? want : SETS[0].id);
  setView(LS.get('view', 'slides'));
})();
</script>
<script src="composer.js"></script>
</body>
</html>
